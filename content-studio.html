<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>课程工作台 · jqka.top</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="assets/content-studio.css?v=studio-20261016">
<link rel="stylesheet" href="assets/illustration-review.css?v=10-unified-catalog">
<link rel="stylesheet" href="assets/textbook-drafts.css?v=1">
<link rel="stylesheet" href="assets/admin-wordbooks.css?v=8-review-opening">
<link rel="stylesheet" href="assets/wordbook-study.css?v=admin-preview-1">
<link rel="icon" type="image/png" sizes="32x32" href="assets/brand/icon-32-v1.png">
</head>
<body>
<section id="login" class="login hidden"><h1>登录课程工作台</h1><form id="loginForm"><label class="label" for="password">管理员密码</label><input id="password" class="field" type="password" autocomplete="current-password" required><p id="loginError" class="login-error" role="alert"></p><button class="btn primary">登录</button></form></section>
<div id="app" class="hidden">
  <header class="top">
    <div class="brand"><a href="/admin.html">jqka.top</a><span>课程工作台</span></div>
    <nav class="studio-nav" aria-label="工作台功能">
      <button type="button" id="editorOpen" class="btn" aria-pressed="true" aria-controls="studioLayout">编辑正文</button>
      <button type="button" id="libraryMetadataOpen" class="btn" aria-pressed="false" aria-controls="libraryMetadataPanel">目录分类</button>
      <button type="button" id="protectedPublicationOpen" class="btn" aria-pressed="false" aria-controls="protectedPublicationPanel">新建发布</button>
      <button type="button" id="illustrationReviewOpen" class="btn" aria-pressed="false" aria-controls="illustrationReviewPanel">配图审核</button>
      <button type="button" id="textbookDraftsOpen" class="btn" aria-pressed="false" aria-controls="textbookDraftsPanel">教材草稿</button>
      <button type="button" id="systemWordbooksOpen" class="btn" aria-pressed="false" aria-controls="systemWordbooksPanel">系统单词课程</button>
      <a class="btn" href="/expression-create.html">表达课程制作</a>
      <a id="textbookProductionLink" class="btn" href="textbook-production.html?admin=1" target="_blank" rel="noopener" hidden>教材生产进度</a>
    </nav>
    <a class="admin-link" href="/admin.html">返回后台</a>
  </header>
  <section id="protectedPublicationPanel" class="utility-panel" hidden aria-label="新建发布"></section>
  <section id="illustrationReviewPanel" class="utility-panel" hidden aria-label="配图审核"></section>
  <section id="textbookDraftsPanel" class="utility-panel" hidden aria-label="教材草稿"></section>
  <section id="systemWordbooksPanel" class="utility-panel" hidden aria-label="系统单词课程"></section>
  <section id="libraryMetadataPanel" class="utility-panel" hidden aria-labelledby="libraryMetadataTitle"></section>
  <main class="layout" id="studioLayout">
    <aside class="pane course-pane" aria-label="课程列表">
      <div class="pane-head"><h2>课程 <span id="courseCount" class="badge"></span></h2><button class="btn" id="hideCourses" type="button" aria-label="收起课程列表">收起</button></div>
      <div class="pane-search"><input id="courseSearch" class="field" type="search" aria-label="搜索课程" placeholder="搜索课程"></div><div id="courses" class="course-list"></div>
    </aside>
    <aside class="pane item-pane" aria-label="句子列表">
      <div class="pane-head"><h2>句子 <span id="itemCount" class="badge"></span></h2><button class="btn rail-toggle" id="showCourses" type="button">选课程</button></div>
      <div class="pane-search"><input id="itemSearch" class="field" type="search" aria-label="搜索句子" placeholder="搜索英文或中文"></div><div id="items" class="item-list"></div>
    </aside>
    <section id="editorPane" class="pane" aria-label="正文编辑"><div class="content">
      <div id="editorEmpty" class="empty" role="status">选择课程后开始编辑。</div>
      <div id="editor" class="hidden">
        <div class="editor-header"><div><h1 class="course-title" id="activeCourse"></h1><div class="course-meta" id="courseMeta"></div></div><div class="editor-actions"><button id="validate" class="btn">校验</button><button id="save" class="btn">保存草稿</button><button id="publish" class="btn primary">发布</button></div></div>
        <div class="toolbar"><span id="revision" class="badge"></span><span id="validationBadge" class="badge">待校验</span><span id="state" class="state" role="status" aria-live="polite">加载中…</span><span class="spacer"></span><span id="itemPosition" class="item-position"></span><button id="previous" class="btn">上一句</button><button id="next" class="btn">下一句</button></div>
        <div class="editor">
          <div class="sentence-fields"><label><span class="label">英文原句</span><textarea id="sentence" class="field sentence" rows="1"></textarea></label><label><span class="label">中文翻译</span><textarea id="translation" class="field" rows="1"></textarea></label></div>
          <section aria-label="意群编辑"><h2 class="section-title">意群与讲解</h2><div class="chunk-head" aria-hidden="true"><span></span><span>意群</span><span>中文提示</span><span>讲解</span></div><div id="chunks" class="chunks"></div></section>
        </div>
        <div id="validation" class="validation" role="status" aria-live="polite"></div>
        <details class="preview"><summary>学习预览</summary><div class="preview-body"><div id="previewSentence" class="preview-sentence"></div><div id="previewTranslation" class="preview-translation"></div><div id="previewChunks" class="preview-chunks"></div></div></details>
      </div>
    </div></section>
  </main>
</div>
<div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
<script src="js/membership.js"></script>
<script src="content-studio.js?v=studio-20261022-performance-1"></script>
  <script src="js/illustration-review.js?v=12-unified-catalog"></script>
<script src="js/textbook-drafts.js?v=2-stage-filter"></script>
<script src="js/learning-workspace.js"></script>
<script src="js/library-metadata-editor.js?v=studio-20261016-2"></script>
<script src="landing/sentence-cloze-engine.js"></script>
<script src="js/vocabulary-course-contract.js"></script>
<script src="js/vocabulary-word-dictation.js"></script>
<script src="js/vocabulary-word-choice.js"></script>
<script src="js/vocabulary-chunk-order.js"></script>
<script src="landing/sentence-cloze-view.js"></script>
<script src="landing/guided-sentence-view.js"></script>
<script src="landing/word-choice-view.js"></script>
<script src="landing/chunk-order-view.js"></script>
<script src="landing/word-dictation-view.js"></script>
<script src="js/admin-wordbooks.js?v=9-publish-budget"></script>
<script>
// 管理页也检查已注册的应用资源版本；不在编辑过程中自动刷新页面。
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.getRegistration().then(function (registration) {
    if (registration) return registration.update();
  }).catch(function () { /* 离线时继续使用当前页面，保留编辑内容。 */ });
}
</script>
</body>
</html>
