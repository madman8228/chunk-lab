<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Chunk Lab · 竖屏宣传片 9:16</title>
<style>
/* ================= 品牌常量 ================= */
:root{
  --bg:#f4f2ee;        /* 暖白背景 */
  --surface:#fffdfa;   /* 卡片 */
  --accent:#2c62c9;    /* 品牌蓝 */
  --accent-soft:#e8efff;
  --text:#202326;      /* 深灰文字 */
  --ok:#0b8a4a;        /* 正确绿 */
  --ok-light:#34c77b;
}
*{margin:0;padding:0;box-sizing:border-box}
/* 录制门控：body 加 .go 前冻结全部动画，保证动画 t0 与录制起点对齐（由 record.js 触发） */
body:not(.go) *{animation-play-state:paused !important}
html,body{width:1080px;height:1920px;overflow:hidden}
body{
  background:var(--bg);
  font-family:"Microsoft YaHei","PingFang SC","Hiragino Sans GB",system-ui,sans-serif;
  color:var(--text);
  -webkit-font-smoothing:antialiased;
}
.stage{position:relative;width:1080px;height:1920px;overflow:hidden}

/* ================= 场景窗口控制 =================
   .scene  外层负责「何时出现」
   .win    内层负责「何时消失」
   两者 opacity 相乘 = 一个可见时间窗，实现交叉淡入淡出 */
.scene{position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;opacity:0}
.scene{animation:fadeIn .28s ease-out both;animation-delay:calc(var(--s) * 1s)}
.win{position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  animation:fadeOut .28s ease-in both;animation-delay:calc((var(--e) - .28) * 1s)}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeOut{from{opacity:1}to{opacity:0}}

/* 通用入场：淡入 + 上移 */
.rise{opacity:0;animation:rise .5s cubic-bezier(.2,.8,.2,1) both;
  animation-delay:calc((var(--s) + var(--d)) * 1s)}
@keyframes rise{from{opacity:0;transform:translateY(38px)}to{opacity:1;transform:translateY(0)}}

/* 通用弹入 */
.pop{opacity:0;animation:pop .45s cubic-bezier(.34,1.56,.64,1) both;
  animation-delay:calc((var(--s) + var(--d)) * 1s)}
@keyframes pop{from{opacity:0;transform:scale(.82)}to{opacity:1;transform:scale(1)}}

/* 大字标题 */
.h1{font-size:88px;font-weight:800;line-height:1.28;letter-spacing:.01em;text-align:center}
.h2{font-size:60px;font-weight:700;line-height:1.35;text-align:center}
.accent{color:var(--accent)}
.tag{font-size:34px;font-weight:600;color:#6b7280;letter-spacing:.06em}

/* ============ 场景1：痛点钩子（深色） ============ */
#s1{--s:0;--e:3}
.dark{background:var(--text);color:#fff}
.words{display:flex;flex-wrap:wrap;gap:16px;justify-content:center;max-width:820px;margin-bottom:56px}
.wordchip{padding:14px 28px;border-radius:14px;background:#3a3f45;color:#e7e9ec;
  font-size:38px;font-weight:600;letter-spacing:.02em}
.wordchip{animation:pop .4s both;animation-delay:calc((var(--s) + var(--d)) * 1s)}
.wordchip.stall{animation:pop .4s both,dim .45s ease-in both;
  animation-delay:calc((var(--s) + var(--d)) * 1s),calc((var(--s) + 1.45) * 1s)}
@keyframes dim{to{opacity:.28;filter:blur(.4px)}}
.q{font-size:120px;font-weight:800;color:var(--accent-soft);
  animation:pop .4s both;animation-delay:calc((var(--s) + 2.0) * 1s);opacity:0}

/* ============ 场景2：语块重组 ============ */
#s2{--s:3;--e:6}
.chunkrow{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin-top:48px;max-width:920px}
.chunkblk{padding:22px 30px;border-radius:16px;background:var(--accent);color:#fff;
  font-size:46px;font-weight:700;box-shadow:0 10px 26px rgba(44,98,201,.28)}
.chunkblk{animation:pop .42s both;animation-delay:calc((var(--s) + var(--d)) * 1s)}
.chunklabel{margin-top:34px;font-size:34px;color:#6b7280;letter-spacing:.08em}

/* ============ 场景3：拆句练习 ============ */
#s3{--s:6;--e:9.3}
.card{width:860px;background:var(--surface);border:1px solid #e3e0d9;border-radius:32px;
  padding:52px 46px;box-shadow:0 18px 50px rgba(32,35,38,.10)}
.sentence{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px;justify-content:center}
.blk{min-width:96px;padding:16px 20px;border-radius:14px;font-size:44px;font-weight:700;text-align:center}
.blk.plain{color:var(--text)}
.blk.blank{background:var(--accent-soft);color:var(--accent);border:2px dashed #b9cbf0}
.blk.done{background:#e6f5ee;color:var(--ok);border:2px solid var(--ok-light)}
.blk{animation:pop .4s both;animation-delay:calc((var(--s) + var(--d)) * 1s)}
.blk.flip{animation:pop .4s both,toGreen .38s ease-out both;
  animation-delay:calc((var(--s) + var(--d)) * 1s),calc((var(--s) + var(--f)) * 1s)}
@keyframes toGreen{
  from{background:var(--accent-soft);color:var(--accent);border-color:#b9cbf0}
  to{background:#e6f5ee;color:var(--ok);border-color:var(--ok-light)}
}
.meta{margin-top:30px;display:flex;justify-content:space-between;font-size:30px;color:#8a9099}

/* ============ 场景4：AI 精讲 ============ */
#s4{--s:9.3;--e:12.1}
.aicard{width:860px;background:var(--surface);border:1px solid #e3e0d9;border-radius:32px;
  padding:48px 44px;box-shadow:0 18px 50px rgba(32,35,38,.10)}
.aihead{display:flex;align-items:center;gap:18px;margin-bottom:36px}
.aibadge{width:74px;height:74px;border-radius:20px;background:var(--accent);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:800}
.dims{display:flex;flex-direction:column;gap:18px}
.dim{display:flex;align-items:center;gap:20px;padding:22px 26px;border-radius:18px;
  background:var(--accent-soft)}
.dim{animation:slideIn .45s both;animation-delay:calc((var(--s) + var(--d)) * 1s)}
@keyframes slideIn{from{opacity:0;transform:translateX(-34px)}to{opacity:1;transform:translateX(0)}}
.dot{width:16px;height:16px;border-radius:50%;background:var(--accent);flex:0 0 auto}
.dimtext{font-size:40px;font-weight:700;color:var(--text)}

/* ============ 场景5：间隔复习 ============ */
#s5{--s:12.1;--e:14.9}
.due{display:inline-flex;align-items:center;gap:16px;padding:18px 34px;border-radius:999px;
  background:var(--accent);color:#fff;font-size:40px;font-weight:700}
.bars{width:820px;margin-top:44px;display:flex;flex-direction:column;gap:26px}
.barrow{display:flex;align-items:center;gap:22px}
.barlabel{font-size:32px;color:#6b7280;width:230px;flex:0 0 auto}
.track{flex:1;height:26px;border-radius:999px;background:#e6e3dd;overflow:hidden}
.fill{height:100%;border-radius:999px;background:var(--ok);width:0;
  animation:grow .8s cubic-bezier(.2,.8,.2,1) both;
  animation-delay:calc((var(--s) + var(--d)) * 1s)}
@keyframes grow{from{width:0}to{width:var(--w)}}

/* ============ 场景6：CTA ============ */
#s6{--s:14.9;--e:18}
/* 最后一镜保持到片尾，不再淡出 */
#s6 .win{animation:none;opacity:1}
.bluebg{background:var(--accent);color:#fff}
.logo{font-size:104px;font-weight:800;letter-spacing:-.02em}
.logo-sub{margin-top:18px;font-size:42px;font-weight:600;color:#dbe6ff}
.cta{margin-top:64px;padding:30px 58px;border-radius:24px;background:#fff;color:var(--accent);
  font-size:52px;font-weight:800;box-shadow:0 16px 40px rgba(0,0,0,.18)}
.search{margin-top:34px;font-size:38px;font-weight:600;color:#e3ecff}
</style>
</head>
<body>
<div class="stage">

  <!-- ========== 场景1 · 痛点钩子 0–3s ========== -->
  <div class="scene" id="s1">
    <div class="win dark">
      <div class="words">
        <div class="wordchip stall" style="--d:.15">apple</div>
        <div class="wordchip stall" style="--d:.30">want</div>
        <div class="wordchip stall" style="--d:.45">red</div>
        <div class="wordchip stall" style="--d:.60">I</div>
        <div class="wordchip stall" style="--d:.75">a</div>
        <div class="wordchip stall" style="--d:.90">eat</div>
      </div>
      <div class="h1 rise" style="--d:1.55">背了 3000 词，</div>
      <div class="h1 rise" style="--d:1.90;color:var(--accent-soft)">还是开不了口<span class="q">？</span></div>
    </div>
  </div>

  <!-- ========== 场景2 · 语块重组 3–6s ========== -->
  <div class="scene" id="s2">
    <div class="win">
      <div class="h1 rise" style="--d:.25">英语是按<span class="accent">「语块」</span>说的</div>
      <div class="h2 rise" style="--d:.60;color:#6b7280">不是拿单词硬拼的</div>
      <div class="chunkrow">
        <div class="chunkblk" style="--d:.95">I</div>
        <div class="chunkblk" style="--d:1.10">want</div>
        <div class="chunkblk" style="--d:1.25">a</div>
        <div class="chunkblk" style="--d:1.40">red</div>
        <div class="chunkblk" style="--d:1.55">apple</div>
      </div>
      <div class="chunklabel rise" style="--d:1.95">CHUNK · 意群 / 语块</div>
    </div>
  </div>

  <!-- ========== 场景3 · 拆句练习 6–9s ========== -->
  <div class="scene" id="s3">
    <div class="win">
      <div class="h1 rise" style="--d:.25">把整句拆成语块，逐个练</div>
      <div class="card pop" style="--d:.75;margin-top:52px">
        <div class="sentence">
          <div class="blk plain" style="--d:.95">I</div>
          <div class="blk blank flip" style="--d:1.05;--f:1.70">want</div>
          <div class="blk plain" style="--d:1.15">a</div>
          <div class="blk blank flip" style="--d:1.25;--f:2.05">red</div>
          <div class="blk blank flip" style="--d:1.35;--f:2.40">apple</div>
        </div>
        <div class="meta">
          <div class="rise" style="--d:2.20">本句 5 个语块</div>
          <div class="rise" style="--d:2.30;color:var(--ok);font-weight:700">答对 3 / 5 ✓</div>
        </div>
      </div>
    </div>
  </div>

  <!-- ========== 场景4 · AI 精讲 9–12s ========== -->
  <div class="scene" id="s4">
    <div class="win">
      <div class="h1 rise" style="--d:.25">AI 逐句精讲</div>
      <div class="aicard pop" style="--d:.70;margin-top:44px">
        <div class="aihead">
          <div class="aibadge pop" style="--d:.90">AI</div>
          <div class="dimtext rise" style="--d:1.00">这一句，一次讲透</div>
        </div>
        <div class="dims">
          <div class="dim" style="--d:1.15"><div class="dot"></div><div class="dimtext">语法 · 句型结构</div></div>
          <div class="dim" style="--d:1.35"><div class="dot"></div><div class="dimtext">搭配 · 地道组合</div></div>
          <div class="dim" style="--d:1.55"><div class="dot"></div><div class="dimtext">口语 · 怎么自然说</div></div>
        </div>
      </div>
    </div>
  </div>

  <!-- ========== 场景5 · 间隔复习 12–15s ========== -->
  <div class="scene" id="s5">
    <div class="win">
      <div class="h1 rise" style="--d:.25">间隔复习自动排期</div>
      <div class="h2 rise" style="--d:.55;color:#6b7280">到期队列 + 错题本，反复磨</div>
      <div class="pop" style="--d:.95;margin-top:46px">
        <div class="due">今日到期 12 句</div>
      </div>
      <div class="bars">
        <div class="barrow rise" style="--d:1.15">
          <div class="barlabel">已掌握</div><div class="track"><div class="fill" style="--d:1.25;--w:78%"></div></div>
        </div>
        <div class="barrow rise" style="--d:1.30">
          <div class="barlabel">复习中</div><div class="track"><div class="fill" style="--d:1.40;--w:54%"></div></div>
        </div>
        <div class="barrow rise" style="--d:1.45">
          <div class="barlabel">待攻克</div><div class="track"><div class="fill" style="--d:1.55;--w:32%"></div></div>
        </div>
      </div>
    </div>
  </div>

  <!-- ========== 场景6 · CTA 15–18s ========== -->
  <div class="scene" id="s6">
    <div class="win bluebg">
      <div class="logo pop" style="--d:.25">Chunk Lab</div>
      <div class="logo-sub rise" style="--d:.55">英语句型意群练习</div>
      <div class="cta pop" style="--d:.95">免登录，打开就练</div>
      <div class="search rise" style="--d:1.25">搜「Chunk Lab」，现在就开始</div>
    </div>
  </div>

</div>
</body>
</html>
