# Chunk Lab · Nginx 站点（与生产实际配置同步，2026-09-10）
# 安装：
#   sudo cp deploy/nginx-chunklab.conf /etc/nginx/sites-available/chunklab
#   sudo ln -sf /etc/nginx/sites-available/chunklab /etc/nginx/sites-enabled/chunklab
#   sudo nginx -t && sudo systemctl reload nginx
# TLS：执行 certbot --nginx -d chunklab.jqka.top --redirect 后自动注入 ssl_* 指令与 80→443 跳转

server {
    server_name chunklab.jqka.top;

    # 隐藏 nginx 版本号（安全自检 WARN 项，2026-09-10）
    server_tokens off;

    client_max_body_size 100m;

    # HSTS（2026-09-10 安全自检补）：一年内强制 HTTPS。
    # 不加 includeSubDomains，以免波及同机 jqka.top 上的其它子域（english-mud）。
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # —— 以下 TLS 指令由 certbot --nginx 注入 ——
    listen [::]:443 ssl;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/chunklab.jqka.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chunklab.jqka.top/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = chunklab.jqka.top) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    listen [::]:80;
    server_name chunklab.jqka.top;
    return 404;
}
