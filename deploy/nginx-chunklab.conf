# Chunk Lab Nginx 站点配置（腾讯云轻量 · TLS 终结 + 全量反代）
# 用法：把下方 two server blocks 存入 /etc/nginx/sites-available/chunklab，
#       替换 <你的域名>，然后：
#   sudo ln -s /etc/nginx/sites-available/chunklab /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d <你的域名>     # 自动签发 TLS 并改写 443 块
#
# 设计：index.js 同源托管前端静态 + /api，Nginx 只做 TLS 终结 + proxy，
#       无跨域问题（CORS_ORIGINS 留空 = fail-closed 拒绝跨域，正好）。

# HTTP → HTTPS 跳转（certbot 也会处理，先占位防明文）
server {
    listen 80;
    listen [::]:80;
    server_name <你的域名>;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name <你的域名>;

    # 以下 ssl_* 由 certbot --nginx 自动填充；手动填可用：
    # ssl_certificate     /etc/letsencrypt/live/<你的域名>/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/<你的域名>/privkey.pem;

    # 导入备份可能较大（课程/图片 base64），放宽请求体
    client_max_body_size 100m;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # TRUST_PROXY=true 时服务端信任第一跳 XFF 用于认证限速 IP 识别
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
