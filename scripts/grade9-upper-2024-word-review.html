<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>九年级上册词表差异审阅</title>
<style>
:root{font-family:system-ui,"Segoe UI",sans-serif;color:#49321f;background:#e6f3f6}*{box-sizing:border-box}body{margin:0}header,main{width:min(100% - 28px,1000px);margin:auto}header{padding:22px 0 14px;display:flex;justify-content:space-between;gap:12px;align-items:flex-start}h1{margin:0;font-size:clamp(22px,3vw,30px)}header p{margin:6px 0;color:#72583c}.badge{background:#fff9ec;border:1px solid #d7bb82;border-radius:30px;padding:7px 11px;font-size:13px;white-space:nowrap}main{padding-bottom:40px}.notice{background:#fff7e2;border:1px solid #e0c984;border-radius:12px;padding:13px 15px;line-height:1.55;margin-bottom:14px}.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:12px 0;color:#76583b}.bar input,.bar select{height:40px;border:1px solid #cfb27c;border-radius:8px;padding:0 10px;background:#fffdf8;color:inherit;font:inherit}.bar input{flex:1;min-width:180px}.items{display:grid;gap:12px}.card{display:grid;grid-template-columns:minmax(240px,1fr) minmax(240px,38%);gap:16px;padding:14px;background:#fffdf7;border:1px solid #decda8;border-radius:12px}.card h2{font-size:17px;margin:0 0 9px}.meta{font-size:12px;color:#8a7354}.scan{display:block;width:100%;height:auto;border:1px solid #e1d5bf;border-radius:6px;background:#eee9dd}.label{font-size:12px;color:#896d3d;margin-top:10px}.text{white-space:pre-wrap;line-height:1.5}.status{display:inline-block;margin:11px 8px 0 0;border-radius:20px;padding:4px 9px;background:#f5e9c8;font-size:12px}.status.approved{background:#e3f1df}.status.changes-requested{background:#f8e0d8}.note{display:block;width:min(100%,520px);min-height:40px;margin:10px 0;padding:8px;border:1px solid #cfb27c;border-radius:8px;background:#fff;color:inherit;font:inherit}.confirm{display:flex;gap:8px;align-items:center;margin:10px 0;font-size:13px}.buttons{display:flex;flex-wrap:wrap;gap:8px}.buttons button{min-height:38px;padding:6px 12px;border:1px solid #c9ad7b;border-radius:8px;background:#fff8e8;color:inherit;font:inherit;cursor:pointer}.buttons button.pass{background:#e8f2e4}.buttons button.change{background:#fff0eb}.buttons button:disabled{opacity:.55}.save{font-size:12px;color:#705a3d;align-self:center}.error{padding:14px;background:#fff0eb;color:#873d2c;border-radius:10px}.empty{padding:20px;background:#fffdf7;border-radius:10px}.foot{font-size:13px;line-height:1.6;color:#76583b}@media(max-width:680px){header{display:block}.badge{display:inline-block;margin-top:8px}.card{grid-template-columns:1fr}.source-image{order:-1}}
</style>
</head>
<body>
<header><div><h1>人教版英语《九年级上册》（2024）词表差异审阅</h1><p>对照教材扫描页审阅 34 项候选修订</p></div><span class="badge">本机记录 · 不改候选词表</span></header>
<main><div class="notice">每项请打开对应教材原页后再判断。选择“通过”或“需修改”，需要时写明意见；记录独立保存，不会改写原始转录或候选稿。全部差异审完仍需在 Codex 对话中明确确认，才会视为词表通过；本页面不会启动配图、音频或发布。</div>
<div id="error" class="error" hidden></div><div id="app" hidden><div class="bar"><label>筛选 <select id="filter"><option value="all">全部</option><option value="pending">待审</option><option value="approved">已通过</option><option value="changes-requested">需修改</option></select></label><input id="search" type="search" placeholder="搜索扫描页、词头或差异"><span id="summary"></span></div><section id="items" class="items"></section><p class="foot">审阅状态与备注写入独立的本机决定文件，并绑定 v3 候选、审阅清单及扫描页哈希。旧版本或扫描页变化后，旧结论不再适用。</p></div></main>
<script>
'use strict';
const $=id=>document.getElementById(id);let data;
const statusName=s=>s==='approved'?'已通过':s==='changes-requested'?'需修改':'待审';
async function decide(item,decision,card){const buttons=card.querySelectorAll('button');buttons.forEach(b=>b.disabled=true);const save=card.querySelector('.save');save.textContent='保存中…';try{const response=await fetch('/api/review',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({id:item.id,decision,note:card.querySelector('.note').value,scanReviewed:card.querySelector('.confirm input').checked,baseRevision:item.revision})});const result=await response.json();if(!response.ok)throw Error(result.error==='source-scan-not-confirmed'?'请先确认已对照教材原页。':result.error==='review-item-changed'?'此项已在其他窗口更新，请刷新后再审。':`保存失败（${response.status}）`);item.status=result.status;item.note=result.note;item.revision=result.revision;render();}catch(e){save.className='save error';save.textContent=e.message}finally{buttons.forEach(b=>b.disabled=false)}}
function render(){const q=$('search').value.trim().toLocaleLowerCase(),filter=$('filter').value;const rows=data.items.filter(x=>(filter==='all'||x.status===filter)&&(!q||[x.scanPage,x.unitPage,x.sourceDifference,x.candidate].join(' ').toLocaleLowerCase().includes(q)));const root=$('items');root.replaceChildren();for(const item of rows){const card=document.createElement('article');card.className='card';const info=document.createElement('div');const title=document.createElement('h2');title.textContent=`扫描页 p.${item.scanPage} · 教材 ${item.unitPage}`;const id=document.createElement('div');id.className='meta';id.textContent=`审阅项 ${item.id.slice(0,10)}`;const l1=document.createElement('div');l1.className='label';l1.textContent='原稿与教材的差异';const old=document.createElement('div');old.className='text';old.textContent=item.sourceDifference;const l2=document.createElement('div');l2.className='label';l2.textContent='v3 候选';const candidate=document.createElement('div');candidate.className='text';candidate.textContent=item.candidate;const status=document.createElement('span');status.className=`status ${item.status}`;status.textContent=statusName(item.status);const note=document.createElement('textarea');note.className='note';note.placeholder='需修改时写明理由或正确内容（可选）';note.maxLength=2000;note.value=item.note||'';note.setAttribute('aria-label',`p.${item.scanPage} 审阅意见`);const confirm=document.createElement('label');confirm.className='confirm';const check=document.createElement('input');check.type='checkbox';confirm.append(check,document.createTextNode('我已对照右侧教材原页'));const actions=document.createElement('div');actions.className='buttons';for(const [text,decision,cls] of [['通过','approved','pass'],['需修改','changes-requested','change'],['撤销结论','reset','']]){const b=document.createElement('button');b.type='button';b.textContent=text;b.className=cls;b.onclick=()=>decide(item,decision,card);actions.append(b)}const save=document.createElement('span');save.className='save';info.append(title,id,l1,old,l2,candidate,status,note,confirm,actions,save);const imgwrap=document.createElement('div');imgwrap.className='source-image';const img=document.createElement('img');img.className='scan';img.src=`/scans/${encodeURIComponent(item.scanFile)}`;img.alt=`教材扫描页 p.${item.scanPage}`;img.loading='lazy';imgwrap.append(img);card.append(info,imgwrap);root.append(card)}$('summary').textContent=`${data.summary.approved} 通过 · ${data.summary.changesRequested} 需修改 · ${data.summary.pending} 待审 · 显示 ${rows.length}/${data.items.length}`;if(!rows.length){const empty=document.createElement('div');empty.className='empty';empty.textContent='没有符合筛选条件的差异项。';root.append(empty)}}
async function init(){try{const r=await fetch('/api/items');if(!r.ok)throw Error(`读取审阅清单失败（${r.status}）`);data=await r.json();$('app').hidden=false;$('filter').onchange=render;$('search').oninput=render;render()}catch(e){$('error').hidden=false;$('error').textContent=e.message}}
init();
</script></body></html>
