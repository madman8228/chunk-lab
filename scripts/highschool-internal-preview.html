<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>高中词汇 · 内部测试</title>
<style>body{font:16px/1.6 system-ui,sans-serif;margin:0;color:#172b4d;background:#f4f5f7}header,main{max-width:1100px;margin:auto;padding:16px}header{position:sticky;top:0;background:white;border-bottom:1px solid #ccd4e0}h1{font-size:20px;margin:0}p{margin:8px 0}select,input,button{font:inherit;padding:8px;max-width:100%;box-sizing:border-box}nav{display:flex;gap:8px;flex-wrap:wrap}#cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}article{background:white;padding:12px;border:1px solid #ccd4e0;border-radius:6px}img{width:100%;aspect-ratio:16/9;object-fit:contain}h2{margin:4px 0;font-size:20px}.sub{font-size:13px;color:#42526e}a{color:#174ea6}</style>
<header><h1>高中词汇 · 内部测试</h1><p class="sub">部分配图待完善。此页只预览词汇，不保存学习进度，不发布课程。</p><nav><select id="book" aria-label="教材"></select><input id="search" type="search" placeholder="搜索单词或释义" aria-label="查找单词"><select id="filter" aria-label="图片筛选"><option value="all">全部词条</option><option value="images">已通过配图</option><option value="pending">暂不展示配图</option></select></nav><p id="status" role="status"></p></header>
<main><div id="cards"></div><p><button id="more">再显示 24 词</button></p></main>
<script>
'use strict';let items=[],limit=24;const $=id=>document.getElementById(id);function draw(){const query=$('search').value.trim().toLowerCase(),filter=$('filter').value;const selected=items.filter(i=>(i.word+' '+i.meaning).toLowerCase().includes(query)&&(filter==='all'||(filter==='images'?!!i.images:!i.images)));$('cards').replaceChildren();for(const item of selected.slice(0,limit)){const card=document.createElement('article');if(item.images){const img=document.createElement('img');img.src='/'+item.images.wide;img.alt=item.word+' 的配图';img.loading='lazy';card.append(img);}const heading=document.createElement('h2');heading.textContent=item.word;const meaning=document.createElement('p');meaning.textContent=item.meaning;const note=document.createElement('p');note.className='sub';note.textContent=item.unit+(item.images?'':' · 配图待完善');card.append(heading,meaning,note);$('cards').append(card);}$('more').hidden=selected.length<=limit;$('status').textContent='共 '+selected.length+' 词 · 显示 '+Math.min(limit,selected.length)+' 词';}
async function load(){try{$('status').textContent='读取中…';const response=await fetch('./'+$('book').value+'.json');if(!response.ok)throw Error('课程包读取失败');items=(await response.json()).items;limit=24;draw();}catch(e){$('status').textContent=e.message;}}
$('book').onchange=load;$('search').oninput=$('filter').onchange=()=>{limit=24;draw();};$('more').onclick=()=>{limit+=24;draw();};fetch('./report.json').then(r=>r.json()).then(report=>{for(const book of report.books){const option=document.createElement('option');option.value=book.id;option.textContent=book.title;$('book').append(option);}load();}).catch(e=>$('status').textContent=e.message);
</script></html>
