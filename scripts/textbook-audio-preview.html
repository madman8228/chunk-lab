<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>九年级全一册 · 课程音频预览</title>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#51341f;background:#e7f3f4;font-synthesis:none}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(180deg,#cfe9f6 0,#e7f2ef 42%,#f8f1de 100%)}header,main{width:min(100% - 32px,1000px);margin:auto}header{padding:20px 0 12px;display:flex;align-items:center;justify-content:space-between;gap:16px}h1{font-size:clamp(20px,3vw,28px);margin:0}header p{margin:5px 0 0;color:#76583b;font-size:14px}.read-only{border:1px solid #dfc38e;border-radius:999px;padding:7px 12px;background:#fff9eb;font-size:13px;white-space:nowrap}main{padding:12px 0 32px}.toolbar{display:flex;align-items:end;gap:12px;flex-wrap:wrap;margin-bottom:14px}.field{display:grid;gap:5px;font-size:13px}.field select{min-width:240px;height:42px;padding:0 12px;border:1px solid #d3b98d;border-radius:10px;background:#fffdf7;color:inherit;font:inherit}.count{margin-left:auto;font-size:14px;color:#76583b}.card{background:#fffaf0d9;border:1px solid #dfc99f;border-radius:18px;padding:clamp(16px,4vw,30px);box-shadow:0 8px 24px #68471a12}.image-wrap{width:min(100%,760px);margin:0 auto 22px;aspect-ratio:16/9;background:#e7e3d6;border-radius:12px;overflow:hidden;display:grid;place-items:center}.image-wrap img{width:100%;height:100%;object-fit:contain}.image-wrap.empty{color:#8a7458}.word-row{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}.word{font-size:clamp(30px,6vw,46px);margin:0;line-height:1.15}.phonetic{font-size:18px;color:#876344}.meaning{font-size:20px;margin:10px 0 18px}.scene{font-size:14px;color:#806444;margin:0 0 6px}.translation{font-size:18px;margin:0}.actions{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:24px}.nav{display:flex;gap:8px}.button{border:1px solid #c89d51;background:#ffdf83;color:#51341f;border-radius:10px;padding:10px 16px;font:inherit;font-weight:650;cursor:pointer}.button.secondary{background:#fffaf0}.button:disabled{opacity:.5;cursor:not-allowed}.position{font-size:14px;color:#76583b;white-space:nowrap}.status{min-height:1.5em;margin:12px 0 0;color:#7a5735;font-size:13px}.item-id{font-size:11px;color:#9a866a;margin-top:16px}.error{padding:18px;border:1px solid #cb8b73;border-radius:12px;background:#fff0e8;color:#713c2e}@media(max-width:560px){header{align-items:flex-start}.read-only{font-size:12px;padding:6px 9px}.field,.field select{width:100%}.count{margin-left:0}.card{padding:14px}.image-wrap{margin-bottom:16px}.actions{align-items:flex-start;flex-direction:column}.nav{width:100%}.nav .button{flex:1}.position{order:-1}}
</style>
<style>
.example{margin:20px 0 12px;padding:16px 18px;border-left:4px solid #d6a43e;border-radius:0 10px 10px 0;background:#fff5dc}.example-label{font-size:12px;color:#89612c;font-weight:700}.example-text{font-size:clamp(19px,3vw,24px);line-height:1.5;margin:5px 0 14px;color:#382819}.example-text:last-child{margin-bottom:0}.scene{margin-top:14px}
</style>
</head>
<body>
<header><div><h1 id="bookTitle">教材课程预览</h1><p>词目、配图、音标、单词与例句音频 · 本地只读预览</p></div><span class="read-only">不写入课程 / 账户</span></header>
<main><div id="error" class="error" hidden></div><div id="app" hidden>
<div class="toolbar"><label class="field">单元<select id="unitSelect"></select></label><div id="count" class="count"></div></div>
<section class="card" aria-live="polite"><div class="image-wrap" id="imageWrap"><img id="image" alt=""></div><div class="word-row"><h2 class="word" id="word"></h2><span class="phonetic" id="phonetic"></span></div><p class="meaning" id="meaning"></p><div class="example"><div class="example-label">原创英语例句</div><p class="example-text" id="example"></p><button class="button secondary" id="playSentence" type="button">▶ 播放例句</button><div class="example-label">中文例句</div><p class="example-text" id="translation"></p></div><p class="scene" id="scene"></p><div class="actions"><span class="position" id="position"></span><div class="nav"><button class="button secondary" id="previous" type="button">上一词</button><button class="button" id="play" type="button">▶ 播放单词</button><button class="button secondary" id="next" type="button">下一词</button></div></div><p class="status" id="status" role="status"></p><div class="item-id" id="itemId"></div></section>
</div></main>
<script>
'use strict';
const $=id=>document.getElementById(id);let data,unitIndex=0,itemIndex=0,audio;
function currentUnit(){return data.units[unitIndex]}
function render(){const unit=currentUnit(),item=unit.items[itemIndex];$('count').textContent=`${data.totalItems} 条词目 · 单词音频 ${data.wordAudioCount} 条 · 例句音频 ${data.sentenceAudioCount} 条`;$('position').textContent=`${unit.title} · ${itemIndex+1} / ${unit.items.length}`;$('word').textContent=item.word;$('phonetic').textContent=item.phonetic||'';$('meaning').textContent=item.meaning||'';$('example').textContent=item.example||'暂无英语例句';$('translation').textContent=item.translation||'暂无中文例句';$('scene').textContent=item.scene?`配图场景：${item.scene}`:'';$('itemId').textContent=item.itemId;$('image').src=item.imageUrl||'';$('image').alt=item.scene||item.word;$('imageWrap').classList.toggle('empty',!item.imageUrl);$('image').hidden=!item.imageUrl;$('play').disabled=!item.audioUrl;$('playSentence').disabled=!item.sentenceAudioUrl;$('status').textContent=item.audioUrl?'':'该词目没有可播放音频';$('previous').disabled=unitIndex===0&&itemIndex===0;$('next').disabled=unitIndex===data.units.length-1&&itemIndex===unit.items.length-1;if(audio){audio.pause();audio=null}}
function move(delta){const all=data.units;let u=unitIndex,i=itemIndex+delta;if(i<0){if(u===0)return;u--;i=all[u].items.length-1}else if(i>=all[u].items.length){if(u===all.length-1)return;u++;i=0}unitIndex=u;itemIndex=i;$('unitSelect').value=String(u);render()}
async function play(url,label){if(!url)return;try{audio?.pause();audio=new Audio(url);$('status').textContent=`正在播放${label}音频`;audio.onended=()=>{$('status').textContent=''};audio.onerror=()=>{$('status').textContent=`${label}音频加载失败`};await audio.play()}catch{$('status').textContent=`${label}音频播放失败：浏览器可能不支持该格式`}}
async function start(){try{const response=await fetch('/api/course');if(!response.ok)throw Error(`课程数据读取失败（${response.status}）`);data=await response.json();$('bookTitle').textContent=data.title;for(const [index,unit] of data.units.entries()){const option=document.createElement('option');option.value=String(index);option.textContent=unit.title;$('unitSelect').append(option)}$('unitSelect').onchange=()=>{unitIndex=Number($('unitSelect').value);itemIndex=0;render()};$('previous').onclick=()=>move(-1);$('next').onclick=()=>move(1);$('play').onclick=()=>play(currentUnit().items[itemIndex].audioUrl,'单词');$('playSentence').onclick=()=>play(currentUnit().items[itemIndex].sentenceAudioUrl,'例句');$('app').hidden=false;render()}catch(error){$('error').textContent=error.message;$('error').hidden=false}}
start();
</script>
</body></html>
