<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>教材配图审核</title>
<style>
:root{font-family:system-ui,sans-serif;color:#403426;background:#f6f3ec}*{box-sizing:border-box}body{margin:0}main{max-width:1160px;margin:auto;padding:28px 20px}h1{margin:0 0 8px;font-size:28px}p{line-height:1.6;color:#716755}button,select,input,textarea{font:inherit;color:inherit}button,select,input{padding:10px;border:1px solid #cfc4b2;border-radius:8px;background:#fffdf7;min-height:44px}button{cursor:pointer}button:disabled{opacity:.4}button:focus-visible,select:focus-visible{outline:3px solid #537c68}.tools,.actions,nav{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:18px 0}label{display:grid;gap:6px;font-size:14px}.tools label:first-child{flex:2;min-width:230px}.tools label:nth-child(2){flex:1;min-width:140px}.tools select{width:100%}.summary{font-size:14px;color:#72634f}article{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:26px;padding:22px;background:#fffdf8;border:1px solid #dfd5c5;border-radius:14px}figure{margin:0}figure img{display:block;width:100%;aspect-ratio:16/9;object-fit:contain;background:#eee9df;border-radius:9px}figcaption{font-size:12px;overflow-wrap:anywhere;margin-top:8px;color:#756a59}h2{font-size:30px;margin:8px 0}.meaning{font-size:18px}.status{font-size:14px;color:#586b5b}textarea{display:block;width:100%;min-height:88px;border:1px solid #cfc4b2;border-radius:8px;padding:10px;resize:vertical}.actions button[data-status=pass]{background:#e4eee4}.actions button[data-status=issue]{background:#fff0da}.actions button[aria-pressed=true]{outline:2px solid #755731}nav{justify-content:center}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.tile{padding:8px;text-align:left;min-width:0}.tile img{width:100%;aspect-ratio:16/9;object-fit:contain;display:block}.tile strong,.tile small{display:block;margin-top:5px;overflow-wrap:anywhere}.tile[aria-current=true]{outline:2px solid #537c68}.hint{font-size:13px}#notice{color:#9a3e24}body.narrow article{max-width:390px;margin:auto;grid-template-columns:1fr}@media(max-width:700px){article{grid-template-columns:1fr;padding:14px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}main{padding:18px 12px}}
.progress{padding:14px 18px;margin:16px 0;background:#fffdf8;border:1px solid #dfd5c5;border-radius:12px}.progress p{margin:0 0 10px;color:#403426}.progress summary{cursor:pointer;font-size:14px}.progress table{width:100%;border-collapse:collapse;margin-top:10px;font-size:14px;text-align:right}.progress th,.progress td{padding:8px 4px;border-top:1px solid #eee6d9}.progress th:first-child,.progress td:first-child{text-align:left}.progress button{padding:4px 8px;min-height:32px}.progress tr[aria-current=true]{background:#f0f4eb}
</style></head><body><main>
<h1>教材配图审核</h1><p>按教材和单元逐词审核，查看课程实际使用的压缩图。标记通过或需修改，备注后可下载审核记录。</p>
<div class="tools"><label>教材<select id="book"></select></label><label>单元<select id="unit"></select></label><label>筛选<select id="filter"><option value="all">全部</option><option value="pending">待审核</option><option value="issue">需修改</option><option value="pass">已通过</option></select></label><label>查找单词<input id="search" placeholder="输入单词或释义"></label></div>
<div class="tools"><button id="layout" aria-pressed="false">模拟手机显示</button><button id="download">下载审核记录</button><button id="save-snapshot">保存审核快照到项目</button><span id="summary" class="summary"></span></div>
<section class="progress" aria-label="当前教材审核进度"><p id="book-summary" aria-live="polite"></p><details open><summary>各单元审核进度（点击单元可切换）</summary><table><thead><tr><th>单元</th><th>总数</th><th>已通过</th><th>需修改</th><th>待审核</th></tr></thead><tbody id="unit-progress"></tbody></table></details></section>
<p id="notice" role="status"></p><div id="stage"></div>
<nav><button id="prev">上一条</button><span id="counter"></span><button id="next">下一条</button></nav>
<div id="grid" class="grid"></div><p class="hint">审核标记保存在此浏览器。请下载记录留档；下载文件包含教材、单元、单词、图片路径和问题备注。此页不发布课程。</p>
</main><script>
'use strict';
const $=id=>document.getElementById(id),key='textbook-image-review-v1';let books=[],records={},index=0,shown=[];
try{records=JSON.parse(localStorage.getItem(key)||'{}');}catch{$('notice').textContent='本机记录读取失败，请及时下载本次审核记录。';}
const book=()=>books.find(b=>b.id===$('book').value),unit=()=>book()?.units.find(u=>u.id===$('unit').value);
const recordKey=i=>book().id+'/'+i.unitId+'/'+i.id;
const status=i=>records[recordKey(i)]?.status||'pending';const names={pending:'待审核',pass:'已通过',issue:'需修改'};
function save(){try{localStorage.setItem(key,JSON.stringify(records));}catch{$('notice').textContent='浏览器无法保存标记，请下载审核记录留档。';}}
function option(value,label){const o=document.createElement('option');o.value=value;o.textContent=label;return o;}
function units(){ $('unit').replaceChildren(option('all','全部单元 · '+book().units.reduce((n,u)=>n+u.items.length,0)+' 条'),...book().units.map(u=>option(u.id,u.title+' · '+u.items.length+' 条')));index=0;render();}
function count(items,b=book()){const result={total:items.length,pass:0,issue:0,pending:0};for(const i of items)result[records[b.id+'/'+i.unitId+'/'+i.id]?.status||'pending']++;return result;}
function summary(){const all=books.map(b=>count(b.units.flatMap(u=>u.items),b));const total=all.reduce((n,c)=>n+c.total,0),pass=all.reduce((n,c)=>n+c.pass,0),issue=all.reduce((n,c)=>n+c.issue,0);$('summary').textContent=books.length+' 本教材 · '+total+' 条 · 已通过 '+pass+' · 需修改 '+issue+' · 待审核 '+(total-pass-issue);
 const b=book(),c=count(b.units.flatMap(u=>u.items));$('book-summary').textContent=b.title+' · 整册 '+c.total+' 条 · 已通过 '+c.pass+' · 需修改 '+c.issue+' · 待审核 '+c.pending;
 $('unit-progress').replaceChildren(...b.units.map(u=>{const c=count(u.items),row=document.createElement('tr'),cell=document.createElement('td'),btn=document.createElement('button');btn.textContent=u.title;btn.onclick=()=>{$('unit').value=u.id;index=0;render();};cell.append(btn);row.append(cell);row.setAttribute('aria-current',$('unit').value===u.id);for(const n of [c.total,c.pass,c.issue,c.pending]){const td=document.createElement('td');td.textContent=n;row.append(td);}return row;}));
}
function filteredItems(){const q=$('search').value.trim().toLowerCase(),f=$('filter').value;return ($('unit').value==='all'?book().units.flatMap(u=>u.items):(unit()?.items||[])).filter(i=>(f==='all'||status(i)===f)&&(!q||(i.word+' '+i.meaning).toLowerCase().includes(q)));}
function render(){
 shown=filteredItems();index=Math.max(0,Math.min(index,shown.length-1));
 $('stage').replaceChildren();$('grid').replaceChildren();summary();$('counter').textContent=shown.length?(index+1)+' / '+shown.length:'没有匹配词条';$('prev').disabled=index<=0;$('next').disabled=index>=shown.length-1;
 const item=shown[index];if(!item)return;
 const article=document.createElement('article'),figure=document.createElement('figure'),img=document.createElement('img'),caption=document.createElement('figcaption');img.src=item.image;img.alt=item.word+'：'+item.meaning;img.onerror=()=>{$('notice').textContent='图片加载失败：'+item.image;};caption.textContent=item.image+' · '+item.bytes.toLocaleString()+' bytes';figure.append(img,caption);
 const content=document.createElement('div'),label=document.createElement('p'),heading=document.createElement('h2'),meaning=document.createElement('p'),state=document.createElement('p');label.textContent=book().title+' · '+item.unitTitle;heading.textContent=item.word;meaning.textContent=item.meaning;meaning.className='meaning';state.className='status';state.textContent=names[status(item)];
 const actions=document.createElement('div');actions.className='actions';for(const s of ['pass','issue','pending']){const btn=document.createElement('button');btn.textContent=names[s];btn.dataset.status=s;btn.setAttribute('aria-pressed',status(item)===s);btn.onclick=()=>{const k=recordKey(item);records[k]={...records[k],status:s,updatedAt:new Date().toISOString()};save();render();};actions.append(btn);}
 const note=document.createElement('textarea');note.setAttribute('aria-label','问题备注');note.placeholder='问题备注，例如：多了一只手、词义不符、裁切不完整';note.value=records[recordKey(item)]?.note||'';note.oninput=()=>{const k=recordKey(item);records[k]={...records[k],status:records[k]?.status||'issue',note:note.value,updatedAt:new Date().toISOString()};save();state.textContent=names[records[k].status];summary();};content.append(label,heading,meaning,state,actions,note);article.append(figure,content);$('stage').append(article);
 const start=Math.floor(index/12)*12;shown.slice(start,start+12).forEach((i,n)=>{const btn=document.createElement('button'),thumb=document.createElement('img'),word=document.createElement('strong'),gloss=document.createElement('small');btn.className='tile';btn.setAttribute('aria-current',start+n===index);thumb.src=i.image;thumb.loading='lazy';thumb.alt=i.word;word.textContent=i.word+' · '+names[status(i)];gloss.textContent=i.meaning;btn.append(thumb,word,gloss);btn.onclick=()=>{index=start+n;render();};$('grid').append(btn);});
}
$('book').onchange=units;$('unit').onchange=()=>{index=0;render();};for(const id of ['filter','search'])$(id).addEventListener(id==='search'?'input':'change',()=>{index=0;render();});$('prev').onclick=()=>{index--;render();};$('next').onclick=()=>{index++;render();};$('layout').onclick=()=>{document.body.classList.toggle('narrow');$('layout').setAttribute('aria-pressed',document.body.classList.contains('narrow'));};
function reviewEntries(){return books.flatMap(b=>b.units.flatMap(u=>u.items.flatMap(i=>{const r=records[b.id+'/'+u.id+'/'+i.id];return r?[{bookId:b.id,book:b.title,unit:u.title,unitId:u.id,itemId:i.id,word:i.word,meaning:i.meaning,image:i.image,sha256:i.sha256,status:r.status||'pending',note:r.note||'',updatedAt:r.updatedAt}]:[];})));}
$('download').onclick=()=>{const url=URL.createObjectURL(new Blob([JSON.stringify({exportedAt:new Date().toISOString(),entries:reviewEntries()},null,2)],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download='textbook-image-review-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};
$('save-snapshot').onclick=async()=>{const btn=$('save-snapshot');btn.disabled=true;try{const response=await fetch('/review-snapshot',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({entries:reviewEntries()})}),result=await response.json();if(!response.ok)throw Error(result.error||response.status);$('notice').textContent='已保存 '+result.entries+' 条审核记录：'+result.path;}catch(error){$('notice').textContent='快照保存失败，本机标记保留：'+error.message;}finally{btn.disabled=false;}};
fetch('/review-data.json').then(r=>{if(!r.ok)throw Error(r.status);return r.json();}).then(data=>{books=data.books;for(const b of books)for(const u of b.units)for(const i of u.items){i.unitId=u.id;i.unitTitle=u.title;}$('book').replaceChildren(...books.map(b=>option(b.id,b.title+' · '+b.units.reduce((n,u)=>n+u.items.length,0)+' 条')));units();}).catch(e=>{$('notice').textContent='审核数据读取失败：'+e.message;});
</script></body></html>
