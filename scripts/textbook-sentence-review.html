<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>教材例句审阅</title>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#4c321f;background:#f4f6f2;font-synthesis:none}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(180deg,#e4f2f6 0,#f4f3e9 65%,#f8f3e5 100%)}header,main{width:min(100% - 32px,1040px);margin:auto}header{padding:24px 0 16px;display:flex;align-items:flex-start;justify-content:space-between;gap:16px}h1{font-size:clamp(22px,3vw,30px);margin:0}header p{margin:6px 0 0;color:#76583b;font-size:14px}.badge{border:1px solid #d9c28d;border-radius:999px;padding:7px 12px;background:#fffaf0;font-size:13px;white-space:nowrap}main{padding:8px 0 40px}.notice{padding:13px 16px;margin-bottom:16px;border:1px solid #e6d39e;border-radius:12px;background:#fff9e9;color:#674b27;font-size:14px;line-height:1.6}.toolbar{display:grid;grid-template-columns:minmax(230px,1.5fr) minmax(180px,1fr) minmax(220px,1.2fr);gap:12px;margin-bottom:14px}.field{display:grid;gap:5px;font-size:13px}.field select,.field input{height:42px;padding:0 12px;border:1px solid #d3b98d;border-radius:10px;background:#fffdf7;color:inherit;font:inherit;min-width:0}.summary{display:flex;justify-content:space-between;gap:12px;align-items:center;margin:12px 2px;color:#76583b;font-size:14px}.review-notes{display:none;margin:0 0 14px;padding:12px 16px;border-left:4px solid #d5a543;border-radius:0 10px 10px 0;background:#fff4d7;font-size:14px;line-height:1.55}.review-notes ul{margin:6px 0 0;padding-left:20px}.items{display:grid;gap:10px}.item{padding:15px 18px;border:1px solid #dfd1b4;border-radius:12px;background:#fffdf7;box-shadow:0 3px 12px #5036190a}.item-top{display:flex;align-items:baseline;flex-wrap:wrap;gap:8px 12px}.term{font-size:20px;font-weight:720}.meaning{color:#76583b}.item-id{margin-left:auto;color:#93816a;font-size:11px}.english{margin:10px 0 5px;font-size:19px;line-height:1.5;color:#392819}.chinese{margin:0;font-size:16px;line-height:1.5;color:#624a32}.pending{display:inline-block;margin-top:10px;border-radius:999px;background:#f8ebcc;color:#76551e;padding:3px 9px;font-size:11px}.empty,.error{padding:18px;border:1px solid #dfd1b4;border-radius:12px;background:#fffdf7;color:#76583b}.error{border-color:#cf9a83;background:#fff1ea;color:#713c2e}.bottom{margin-top:16px;color:#806d53;font-size:13px;line-height:1.6}.bottom code{background:#fff9eb;padding:2px 5px;border-radius:4px}@media(max-width:700px){.toolbar{grid-template-columns:1fr}.summary{align-items:flex-start;flex-direction:column}.item-id{width:100%;margin-left:0}header{align-items:flex-start}.badge{font-size:12px}}
</style>
<style>
.review-state{display:inline-block;margin:10px 8px 0 0;border-radius:999px;padding:4px 10px;font-size:12px;background:#f4e8c9;color:#76551e}
.review-state.approved{background:#e3f1df;color:#35613b}.review-state.changes-requested{background:#f9e0d9;color:#873d2c}
.decision-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:10px}
.decision-row button{min-height:38px;padding:6px 13px;border:1px solid #c9ad7b;border-radius:9px;background:#fffaf0;color:#563b22;font:inherit;cursor:pointer}
.decision-row button:hover{background:#fff0cb}.decision-row button[aria-pressed="true"]{border-color:#80602f;background:#f6d786;font-weight:700}
.decision-row button.approve{background:#e7f2e4;border-color:#a8c39f}.decision-row button.reject{background:#fff0eb;border-color:#d9aa9b}
.decision-row button:disabled{opacity:.55;cursor:wait}
.decision-note{width:min(100%,480px);min-height:38px;padding:8px 10px;border:1px solid #d3b98d;border-radius:8px;background:#fffdf7;color:inherit;font:inherit}
.save-state{color:#6e5c43;font-size:12px}.save-state.error{color:#8a3027}
.stale-note{margin:8px 0 0;color:#9a4b27;font-size:13px}
.toolbar{grid-template-columns:minmax(200px,1.4fr) minmax(140px,1fr) minmax(110px,.7fr) minmax(160px,1fr)}.field{min-width:0}.summary{flex-wrap:wrap}select:focus-visible,input:focus-visible,button:focus-visible{outline:3px solid #96652b;outline-offset:2px}@media(max-width:700px){.toolbar{grid-template-columns:1fr 1fr}.field:first-child,.field:last-child{grid-column:1/-1}}
</style>
</head>
<body>
<header><div><h1>教材例句审阅</h1><p>按教材和单元查看原创英文例句、中文译文及目标词绑定</p></div><span class="badge">本机审核 · 不改草稿</span></header>
<main>
  <div class="notice">所有内容均为新写例句，不是教材原句。请在每条下标记“通过”或“需修改”，修改意见会和审核记录分开保存，不会改动原稿或账号课程。只有当前文本被标记通过后，后续句子音频流程才可使用。</div>
  <div id="error" class="error" hidden></div>
  <div id="app" hidden>
    <div class="toolbar">
      <label class="field">教材<select id="book"></select></label>
      <label class="field">单元<select id="unit"></select></label>
      <label class="field">审核状态<select id="review-filter"><option value="pending">待审核</option><option value="approved">已通过</option><option value="changes-requested">需修改</option><option value="all">全部状态</option></select></label>
      <label class="field">查找词条或例句<input id="search" type="search" placeholder="输入词头、释义、英文或中文"></label>
    </div>
    <div class="summary"><span id="courseProgress"></span><span id="reviewProgress"></span><span id="visibleCount"></span></div>
    <section id="reviewNotes" class="review-notes"></section>
    <section id="items" class="items" aria-live="polite"></section>
    <p class="bottom">“需修改”可填写具体意见；“撤销结论”会恢复待审但保留历史。审核结论独立保存在本机，不修改句子草稿、音频队列、课程发布状态或学习记录。</p>
  </div>
</main>
<script>
'use strict';
const $=id=>document.getElementById(id);let books=[],unitData=null,loadRevision=0;
function currentBook(){return books.find(book=>book.id===$('book').value)}
function countsOf(items){return items.reduce((sum,item)=>{sum[item.reviewStatus==='approved'?'approved':item.reviewStatus==='changes-requested'?'changesRequested':'pending']++;return sum},{approved:0,changesRequested:0,pending:0})}
function matchesFilter(item){const status=$('review-filter').value,query=$('search').value.trim().toLocaleLowerCase();return (status==='all'||item.reviewStatus===status)&&(!query||[item.term,item.meaning,item.english,item.chinese,item.itemId,item.reviewNote,item.decisionNote].some(value=>(value||'').toLocaleLowerCase().includes(query)))}
function updateVisibleCount(){const count=unitData.items.filter(matchesFilter).length;$('visibleCount').textContent=`显示 ${count} / ${unitData.items.length} 条`;if(!count&&!$('items').querySelector('.empty')){const empty=document.createElement('p');empty.className='empty';empty.textContent=$('search').value.trim()?'没有匹配的例句，请调整搜索或审核状态。':`当前范围没有${$('review-filter').value==='all'?'':$('review-filter').selectedOptions[0].textContent}的例句。`;$('items').append(empty)}}
function statusLabel(status){return status==='approved'?'已通过':status==='changes-requested'?'需修改':'待审'}
function updateProgress(){if(!unitData)return;const current=currentBook();for(const unit of current.units){if(unitData.unitId==='all'||unit.id===unitData.unitId)unit.reviewSummary=countsOf(unitData.items.filter(item=>item.unitId===unit.id));const option=[...$('unit').options].find(row=>row.value===unit.id);if(option)option.textContent=`${unit.title} · ${unit.reviewSummary.pending} 待审`}unitData.reviewSummary=countsOf(unitData.items);const c=unitData.reviewSummary;$('reviewProgress').textContent=`${unitData.unitId==='all'?'所有单元':'本单元'}：通过 ${c.approved} · 需修改 ${c.changesRequested} · 待审 ${c.pending}`;current.reviewSummary=current.units.reduce((sum,unit)=>{for(const key of Object.keys(sum))sum[key]+=unit.reviewSummary[key];return sum},{approved:0,changesRequested:0,pending:0});const summary=current.reviewSummary;$('courseProgress').textContent=`${current.label} · 全册通过 ${summary.approved} / ${current.taskCount}，需修改 ${summary.changesRequested}，待审 ${summary.pending}`;const option=[...$('book').options].find(row=>row.value===current.id);if(option)option.textContent=`${current.label} · 通过${summary.approved} · 修改${summary.changesRequested} · 待审${summary.pending}`}
function makeButton(label,decision,className,item,noteField,card){const button=document.createElement('button');button.type='button';button.textContent=label;button.className=className;button.setAttribute('aria-pressed',String((decision==='reset'?'pending':decision)===item.reviewStatus));button.onclick=()=>saveDecision(item,decision,noteField,card);return button}
async function saveDecision(item,decision,noteField,card){const bookId=unitData.bookId,controls=card.querySelectorAll('button');controls.forEach(button=>button.disabled=true);const saveState=card.querySelector('.save-state');saveState.className='save-state';saveState.textContent='保存中…';try{const response=await fetch('/api/review',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({bookId,unitId:item.unitId,itemId:item.itemId,decision,note:noteField.value,baseItemRevision:item.reviewRevision})});const result=await response.json();if(!response.ok){if(response.status===409){item.reviewRevision=result.currentReviewRevision;saveState.textContent='此条在其他标签页有新审核记录，请重新确认后再点一次。'}else throw Error(result.error||`保存失败（${response.status}）`);return}item.reviewStatus=result.reviewStatus;item.decisionNote=result.decisionNote;item.reviewRevision=result.reviewRevision;item.staleReview=result.staleReview;if(!unitData||unitData.bookId!==bookId||!unitData.items.includes(item))return;const state=card.querySelector('.review-state');state.className=`review-state ${item.reviewStatus}`;state.textContent=statusLabel(item.reviewStatus);card.querySelectorAll('.decision-row button').forEach(button=>{const selected=button.dataset.decision===item.reviewStatus||(button.dataset.decision==='reset'&&item.reviewStatus==='pending');button.setAttribute('aria-pressed',String(selected))});noteField.value=item.decisionNote;saveState.textContent='已保存';if(!matchesFilter(item))card.remove();updateVisibleCount();updateProgress()}catch(error){saveState.className='save-state error';saveState.textContent=`保存失败：${error.message}`}finally{controls.forEach(button=>button.disabled=false)}}
function render(){if(!unitData)return;const rows=unitData.items.filter(matchesFilter);const container=$('items');container.replaceChildren();for(const item of rows){const card=document.createElement('article');card.className='item';const top=document.createElement('div');top.className='item-top';const term=document.createElement('span');term.className='term';term.textContent=item.term;const meaning=document.createElement('span');meaning.className='meaning';meaning.textContent=item.meaning;const id=document.createElement('span');id.className='item-id';id.textContent=(unitData.unitId==='all'?item.unitTitle+' · ':'')+item.itemId;top.append(term,meaning,id);const english=document.createElement('p');english.className='english';english.textContent=item.english;const chinese=document.createElement('p');chinese.className='chinese';chinese.textContent=item.chinese;const status=document.createElement('span');status.className=`review-state ${item.reviewStatus}`;status.textContent=statusLabel(item.reviewStatus);card.append(top,english,chinese,status);if(item.staleReview){const stale=document.createElement('p');stale.className='stale-note';stale.textContent='句子或来源版本有变化，旧审核结论已失效，请重新审阅。';card.append(stale)}if(item.reviewNote){const note=document.createElement('p');note.className='item-note';note.textContent=`来源/审阅提示：${item.reviewNote}`;card.append(note)}const row=document.createElement('div');row.className='decision-row';row.dataset.itemId=item.itemId;row.dataset.unitId=item.unitId;const noteField=document.createElement('input');noteField.className='decision-note';noteField.type='text';noteField.maxLength=2000;noteField.placeholder='需修改时写明原因（可选）';noteField.value=item.decisionNote||'';noteField.setAttribute('aria-label',`${item.term} 审核意见`);const pass=makeButton('通过','approved','approve',item,noteField,card);pass.dataset.decision='approved';const revise=makeButton('需修改','changes-requested','reject',item,noteField,card);revise.dataset.decision='changes-requested';const reset=makeButton('撤销结论','reset','',item,noteField,card);reset.dataset.decision='reset';const saveState=document.createElement('span');saveState.className='save-state';saveState.setAttribute('role','status');row.append(pass,revise,reset,noteField,saveState);card.append(row);container.append(card)}updateVisibleCount();$('reviewNotes').style.display=unitData.reviewNotes.length?'block':'none';if(unitData.reviewNotes.length){const notes=$('reviewNotes');notes.replaceChildren();const title=document.createElement('strong');title.textContent='单元审阅提示';const list=document.createElement('ul');for(const note of unitData.reviewNotes){const li=document.createElement('li');li.textContent=`${note.itemId}：${note.note}`;list.append(li)}notes.append(title,list)}updateProgress()}
async function loadUnit(){const revision=++loadRevision,book=currentBook(),unitId=$('unit').value;unitData=null;$('items').textContent='正在读取例句…';$('error').hidden=true;try{const units=unitId==='all'?book.units:book.units.filter(unit=>unit.id===unitId);const loaded=await Promise.all(units.map(async unit=>{const query=new URLSearchParams({bookId:book.id,unitId:unit.id});const response=await fetch(`/api/unit?${query}`);if(!response.ok)throw Error(`读取单元失败（${response.status}）`);return response.json()}));if(revision!==loadRevision)return;unitData={bookId:book.id,unitId,items:loaded.flatMap(unit=>unit.items.map(item=>({...item,unitId:unit.unitId,unitTitle:unit.title}))),reviewNotes:loaded.flatMap(unit=>unit.reviewNotes)};render()}catch(error){if(revision!==loadRevision)return;$('items').replaceChildren();$('error').hidden=false;$('error').textContent=error.message}}
async function start(){try{const response=await fetch('/api/books');if(!response.ok)throw Error(`课程目录读取失败（${response.status}）`);books=await response.json();if(!books.length)throw Error('没有找到带有句子草稿的教材');for(const entry of books){const option=document.createElement('option');option.value=entry.id;option.textContent=`${entry.label} · 待审 ${entry.reviewSummary.pending}`;$('book').append(option)}const query=new URLSearchParams(location.search);if(books.some(book=>book.id===query.get('bookId')))$('book').value=query.get('bookId');$('book').onchange=()=>fillUnits();$('unit').onchange=loadUnit;$('review-filter').onchange=render;$('search').oninput=render;$('app').hidden=false;fillUnits(query.get('unitId'))}catch(error){$('error').hidden=false;$('error').textContent=error.message}}
function fillUnits(requestedUnit){const book=currentBook();$('unit').replaceChildren();const all=document.createElement('option');all.value='all';all.textContent='所有单元';$('unit').append(all);for(const unit of book.units){const option=document.createElement('option');option.value=unit.id;option.textContent=`${unit.title} · ${unit.reviewSummary.pending} 待审`;$('unit').append(option)}if(book.units.some(unit=>unit.id===requestedUnit))$('unit').value=requestedUnit;loadUnit()}
start();
</script>
</body>
</html>
