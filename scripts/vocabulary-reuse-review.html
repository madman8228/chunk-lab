<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>跨课程配图复用审核</title>
<style>
:root{font-family:system-ui,"Microsoft YaHei",sans-serif;color:#3e3024;background:#e8f3f6}*{box-sizing:border-box}body{margin:0}main{max-width:1400px;margin:auto;padding:24px}h1{margin:0 0 6px;font-size:28px}p{line-height:1.55}.muted{color:#756958;font-size:14px}.notice{padding:12px 16px;background:#fff4d9;border-left:4px solid #d99a2b;border-radius:8px;margin:16px 0}.layout{display:grid;grid-template-columns:minmax(230px,300px) minmax(0,1fr);gap:16px}.panel{background:#fffdf7;border:1px solid #dcc9a9;border-radius:12px;padding:16px}.filters{display:flex;gap:8px;margin-bottom:12px}button,select,textarea{font:inherit;color:inherit}button,select{border:1px solid #cdbb9c;background:#fff;border-radius:8px;padding:8px 10px;cursor:pointer}button:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #4382a2}.list{max-height:72vh;overflow:auto;display:grid;gap:6px}.group-button{width:100%;text-align:left;display:grid;gap:2px}.group-button[aria-current=true]{background:#e8f2e6;border-color:#72906b}.group-button small{color:#706455}.counts{font-size:13px;margin:10px 0}.workspace h2{margin:2px 0 0;font-size:24px}.candidate-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr));gap:14px;margin-top:14px}.candidate{border:1px solid #ded2bd;border-radius:10px;padding:12px;background:#fff}.candidate img{display:block;width:100%;aspect-ratio:16/9;object-fit:contain;background:#ede9df;border-radius:8px}.candidate h3{font-size:16px;margin:10px 0 4px}.candidate .sources{font-size:13px;color:#6e6253;max-height:130px;overflow:auto}.candidate button{margin-top:10px;width:100%;background:#e5f0e4;border-color:#87a07c;font-weight:600}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.actions button{background:#fff0dc}.actions button.secondary{background:#fff}.note{width:100%;min-height:76px;border:1px solid #cdbb9c;border-radius:8px;padding:10px}.status{font-weight:600}.ok{color:#2c6b3f}.warn{color:#9a6220}#message{min-height:24px;color:#8f3b24}.empty{padding:20px;color:#766b5e;text-align:center}@media(max-width:800px){main{padding:12px}.layout{grid-template-columns:1fr}.list{max-height:28vh}.panel{padding:12px}}
 .candidate .hash{overflow-wrap:anywhere;word-break:break-word}.review-tools{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}.review-tools input,.review-tools select{min-width:0;width:100%;font:inherit;padding:8px;border:1px solid #cdbb9c;border-radius:8px;background:#fff}.review-tools input,.review-tools button{grid-column:1/-1}.review-tools button:disabled{opacity:.55;cursor:not-allowed}
 </style></head><body><main>
<header><h1>跨课程配图复用审核</h1><p class="muted">按相同词头和释义汇总候选；不同学段或画风只作人工审核候选，不会自动合并。</p></header>
<div class="notice">这里仅保存独立审核结论，不会改课程草稿或发布状态。点击“选此图，批准本组共用”即表示你已检查候选图的词义、画风和年龄适配，并确认它适用于本组列出的所有课程；批准后会自动进入下一组待审。</div>
<div class="layout"><aside class="panel"><div class="review-tools"><label>审核状态<select id="filter"><option value="pending">待审核</option><option value="all">全部</option><option value="reuse">已批准共用</option><option value="keep-distinct">不共用</option></select></label><label>匹配范围<select id="scope"><option value="all">所有候选</option><option value="cross-stage">跨学段</option><option value="cross-style">跨画风</option><option value="same-stage-style">同学段同画风</option></select></label><input id="search" type="search" placeholder="搜索英文词头或中文释义" aria-label="搜索英文词头或中文释义"><button id="next-pending" type="button">跳到下一组待审</button></div><p id="counts" class="counts"></p><div id="group-list" class="list"></div></aside>
<section class="panel workspace"><div id="detail" class="empty">正在加载审核候选…</div><div id="message" role="status"></div></section></div>
</main><script>
'use strict';
const $=id=>document.getElementById(id);let summaries=[],active=null,detail=null;
const statusName={pending:'待审核',reuse:'已批准共用', 'keep-distinct':'不共用'};
async function json(url,options){const response=await fetch(url,options);const body=await response.json();if(!response.ok)throw new Error(body.error||response.status);return body;}
function filteredGroups(){const status=$('filter').value,scope=$('scope').value,query=$('search').value.trim().toLocaleLowerCase();return summaries.filter(row=>(status==='all'||row.status===status)&&(scope==='all'||scope==='cross-stage'&&row.crossStage||scope==='cross-style'&&row.crossStyle||scope==='same-stage-style'&&!row.crossStage&&!row.crossStyle)&&(!query||`${row.word} ${row.meaning}`.toLocaleLowerCase().includes(query)));}
function refreshList(){const rows=filteredGroups();$('counts').textContent=`候选 ${summaries.length} 组 · 待审 ${summaries.filter(x=>x.status==='pending').length} · 已批准共用 ${summaries.filter(x=>x.status==='reuse').length} · 不共用 ${summaries.filter(x=>x.status==='keep-distinct').length} · 当前筛选 ${rows.length} 组`;$('group-list').replaceChildren(...rows.map(row=>{const b=document.createElement('button');b.className='group-button';b.setAttribute('aria-current',row.groupId===active);const word=document.createElement('strong'),gloss=document.createElement('span'),meta=document.createElement('small');word.textContent=row.word;gloss.textContent=row.meaning;meta.textContent=`${row.entryCount} 条 · ${row.assetCount} 种图 · ${[row.crossStage?'跨学段':'',row.crossStyle?'跨画风':''].filter(Boolean).join('、')||'同学段同画风'} · ${statusName[row.status]}${row.stale?' · 旧结论':''}`;b.append(word,gloss,meta);b.onclick=()=>loadGroup(row.groupId);return b;}));if(!rows.length){$('group-list').innerHTML='<div class="empty">当前筛选没有词条</div>';}$('next-pending').disabled=!rows.some(row=>row.status==='pending');}
function render(){if(!detail)return;const root=$('detail');root.className='';root.replaceChildren();const title=document.createElement('h2'),meta=document.createElement('p'),message=document.createElement('p');title.textContent=detail.word;meta.className='muted';meta.textContent=`${detail.meaning} · ${detail.entries.length} 条跨课程绑定 · ${detail.candidates.length} 个不同图片 · ${detail.stages.map(x=>x==='primary'?'小学':'初中').join('、')}`;message.className='muted';message.textContent=`风格参考：${detail.styleReferences.join('；')}`;root.append(title,meta,message);
 if(detail.stale){const stale=document.createElement('p');stale.className='warn';stale.textContent='目录或图片哈希已有变化：旧结论已失效，请重新审核。';root.append(stale);}
 const grid=document.createElement('div');grid.className='candidate-grid';for(const candidate of detail.candidates){const card=document.createElement('article');card.className='candidate';const img=document.createElement('img');img.src='/'+candidate.path;img.alt=detail.word+'：'+detail.meaning;img.loading='lazy';const label=document.createElement('h3');label.textContent=`候选图 · ${candidate.bindings.length} 条绑定`;
 const hashText=document.createElement('p');hashText.className='muted hash';hashText.textContent=candidate.assetId;
 const sources=document.createElement('div');sources.className='sources';sources.textContent=candidate.bindings.map(x=>`${x.course} / ${x.unit} / ${x.itemId}`).join('\n');
 const choose=document.createElement('button');choose.textContent='选此图，批准本组共用';choose.onclick=()=>save('reuse',candidate.assetId);card.append(img,label,hashText,sources,choose);grid.append(card);}
 root.append(grid);const note=document.createElement('textarea');note.className='note';note.setAttribute('aria-label','本组审核意见');note.placeholder='可填写不共用原因或复用注意事项';note.value=detail.note||'';root.append(note);
 const actions=document.createElement('div');actions.className='actions';const reject=document.createElement('button');reject.textContent='本组不适合共用';reject.onclick=()=>save('keep-distinct','',note.value);actions.append(reject);const reset=document.createElement('button');reset.className='secondary';reset.textContent='撤销审核结论';reset.onclick=()=>save('reset','',note.value);actions.append(reset);root.append(actions);
 const state=document.createElement('p');state.className='status '+(detail.status==='reuse'?'ok':detail.status==='keep-distinct'?'warn':'');state.textContent=`当前：${statusName[detail.status]||statusName.pending}${detail.assetId?' · '+detail.assetId:''}`;root.append(state);
}
async function loadGroup(id){active=id;detail=await json('/api/group?id='+encodeURIComponent(id));render();refreshList();}
async function save(decision,assetId='',note){try{$('message').textContent='保存中…';const approvedWord=detail.word;await json('/api/review',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({groupId:detail.groupId,decision,assetId,note:note??$('detail').querySelector('textarea')?.value??'',sceneReviewed:decision==='reuse',baseRevision:detail.revision})});summaries=await json('/api/groups').then(x=>x.groups);if(decision==='reuse'){const query=$('search').value.trim().toLocaleLowerCase(),scope=$('scope').value,pending=summaries.filter(row=>row.status==='pending'&&(scope==='all'||scope==='cross-stage'&&row.crossStage||scope==='cross-style'&&row.crossStyle||scope==='same-stage-style'&&!row.crossStage&&!row.crossStyle)&&(!query||`${row.word} ${row.meaning}`.toLocaleLowerCase().includes(query)));$('filter').value='pending';refreshList();if(pending.length){$('message').textContent=`已批准“${approvedWord}”，选定图片已记录为本组共用图。正在进入下一组待审。`;await loadGroup(pending[0].groupId);}else{await loadGroup(detail.groupId);$('message').textContent=`已批准“${approvedWord}”，选定图片已记录为本组共用图。当前筛选下已无待审组。`;}}else{$('message').textContent='审核结论已保存；课程引用未改动。';await loadGroup(detail.groupId);}}catch(error){$('message').textContent='保存失败：'+error.message;}}
async function init(){try{summaries=(await json('/api/groups')).groups;$('filter').onchange=refreshList;$('scope').onchange=refreshList;$('search').oninput=refreshList;$('next-pending').onclick=()=>{const rows=filteredGroups().filter(row=>row.status==='pending');if(!rows.length)return;const current=rows.findIndex(row=>row.groupId===active);loadGroup(rows[(current+1)%rows.length].groupId);};refreshList();if(summaries.length)await loadGroup(summaries[0].groupId);else $('detail').textContent='没有跨课程重复图片候选。';}catch(error){$('detail').textContent='无法载入候选：'+error.message;}}
init();
</script></body></html>
