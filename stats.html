<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="icon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<title>学习档案 · Chunk Lab</title>
<style>
:root{--bg:#f4f2ee;--surface:#fffdfa;--surface-2:#f9f7f3;--surface-stat:#f7f4ef;--border:#dedbd4;--border-strong:#c8c2b8;--text:#202326;--muted:#5f5c55;--faint:#6b6861;--accent:#2c62c9;--accent-soft:#e8efff;--ok:#1c7050;--ok-soft:#e8f5ee;--bad:#b6483e;--bad-soft:#f7eae8;--warn:#965a06;--warn-soft:#f3e8c9;--shadow:0 1px 2px rgba(46,43,37,.06),0 6px 24px -12px rgba(46,43,37,.18)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent} /* 触摸高亮关默认（方角色块），按压反馈统一由 :active 提供 */
html,body{margin:0;padding:0;color:var(--text);font:13.5px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
html{background:var(--bg)}
body{background:radial-gradient(900px 420px at 12% -8%,#e8efff 0%,rgba(232,239,255,0) 62%),radial-gradient(760px 380px at 92% 0%,#e8f5ee 0%,rgba(232,245,238,0) 58%),var(--bg)}
/* 页面底色与主页同源（main.html body）：顶部两团淡色光晕 + 底色。
   ⚠️ 这段注释必须留在 body 规则【之后】：scripts/check-contrast.js 用 /([^{}]+)\{/ 抓选择器名，
      注释若插在 html 与 body 中间，body 会被判成「注释+body」而整条跳过 → 渐变背景漏检，
      护栏会退回更亮的 --bg 当背景、算出偏乐观的比值（等于这道闸对本站失效）。
   ⚠️ 渐变也不得改深：护栏把 #e8efff 当最暗背景候选。 */
.wrap{max-width:880px;margin:0 auto;padding:14px 18px 32px;min-width:0}
.page-head{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.page-head h2{margin:0;font-size:18px;font-weight:700}
.spacer{flex:1}
.btn{border:1px solid var(--border-strong);background:var(--surface);border-radius:8px;padding:5px 12px;font-size:13px;color:var(--text);cursor:pointer;transition:background .15s}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.primary:hover{background:#1e4fa3}
.btn.sm{padding:3px 10px;font-size:12.5px}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.hidden{display:none !important}

.stats-cards{display:block;margin-bottom:14px}

.stats-tabs{display:flex;gap:6px;margin-bottom:10px}
.stats-tabs .tab{border:1px solid var(--border);background:var(--surface);border-radius:8px;padding:5px 14px;font-size:13px;color:var(--text);cursor:pointer}
.stats-tabs .tab.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}
.stats-filter{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.stats-filter .f{border:1px solid var(--border);background:var(--surface);border-radius:6px;padding:2px 10px;font-size:12px;color:var(--muted);cursor:pointer}
.stats-filter .f.on{border-color:var(--accent);background:var(--accent);color:#fff}

.stats-list{display:flex;flex-direction:column;gap:6px}
.srow{display:flex;align-items:center;gap:10px;padding:8px 12px;border:1px solid var(--border);border-radius:10px;background:var(--surface)}
.srow .row-num{align-self:flex-start;flex-shrink:0;width:32px;margin-top:2px;font-size:12px;font-weight:700;color:var(--accent);text-align:right;font-variant-numeric:tabular-nums}
.srow .sen{flex:1;min-width:0}
.srow .en{font-size:13.5px;font-weight:600;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srow .cn{font-size:11.5px;color:var(--faint);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srow .meta{flex-shrink:0;text-align:right;font-size:11.5px;color:var(--muted)}
.stats-detail-row .meta-correct{color:var(--ok)}
.stats-detail-row .meta-wrong{color:var(--bad)}
.stats-detail-row .meta-time{display:inline-block;width:4.4em;text-align:right;white-space:nowrap}
.stats-state-cell{display:flex;align-items:center;flex:0 0 56px}
.row-detail-toggle{display:none;flex-shrink:0;width:24px;height:24px;border:0;border-radius:50%;background:transparent;position:relative;cursor:pointer}
.row-detail-toggle::before{content:"";position:absolute;left:8px;top:7px;width:7px;height:7px;border-right:1.5px solid var(--muted);border-bottom:1.5px solid var(--muted);transform:rotate(45deg);transition:transform .15s ease}
.stats-detail-row.is-expanded .row-detail-toggle::before{transform:rotate(225deg);top:10px}
.badge{font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:999px;flex-shrink:0}
.badge.master{background:var(--ok-soft);color:var(--ok)}
.badge.weak{background:var(--bad-soft);color:var(--bad)}
.badge.new{background:#eef1f6;color:var(--muted)}
.badge.learn{background:var(--accent-soft);color:var(--accent)}

.wrong-row{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-top:1px solid var(--border);background:transparent}
.wrong-row .sen{flex:1;min-width:0}
.wrong-row .en{font-size:13.5px;font-weight:600;line-height:1.3}
.wrong-row .cn{font-size:11.5px;color:var(--faint);margin-top:1px}
.wrong-row .wrong-detail{font-size:11.5px;margin-top:4px;color:var(--bad)}
.wrong-row .wrong-detail b{color:var(--ok);font-weight:600}
.wrong-del{flex-shrink:0;border:none;background:transparent;color:var(--faint);width:24px;height:24px;border-radius:50%;cursor:pointer;line-height:1;padding:0;display:grid;place-items:center}
.wrong-del .icon{width:14px;height:14px}
.wrong-del:hover{background:var(--bad-soft);color:var(--bad)}
.wrong-filter #btnClearWrongBook{margin-left:auto;color:var(--bad)}
.wrong-row .wrong-actions{display:flex;align-items:center;gap:4px;flex-shrink:0}
.muted{color:var(--muted);font-size:12px}
.mistake-export-panel{min-width:0;margin:0 0 4px;padding:5px 10px;border:1px solid #bfd0f7;border-radius:10px;background:var(--surface);box-shadow:var(--shadow)}
.export-progress{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0}.export-progress .export-close{margin-left:auto}
.mistake-export-panel textarea{display:block;width:100%;min-height:180px;max-height:55vh;resize:vertical;margin-top:8px;border:1px solid var(--border-strong);border-radius:8px;padding:9px;background:var(--surface-2);color:var(--text);font:12px/1.5 ui-monospace,Consolas,monospace;overflow:auto}
.export-warning{color:var(--warn);background:var(--warn-soft);border-radius:7px;padding:7px 9px;font-size:12px;margin:0 0 8px}.export-message{color:var(--ok);font-size:12px;line-height:1.3;margin:0;flex:1;min-width:160px}
/* 触摸按压反馈（2026-09-10）：tap-highlight 已全局关闭，按压态由 :active 提供 */
.btn:active{transform:translateY(1px)}
.wrong-del:active{background:var(--bad-soft);color:var(--bad)}
.stat-card .start-btn:active{opacity:.6}

.empty-tip{padding:26px;text-align:center;color:var(--faint);font-size:13px;border:1px dashed var(--border);border-radius:12px}

/* 练习临时题库按钮（在 stats 内可触发进入复习队列） */
.review-row{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--border);border-radius:10px;background:var(--surface)}
.review-row .review-info{flex:1;min-width:0}
.review-row .nm{font-size:13.5px;font-weight:600}
.review-preview{margin-top:3px;color:var(--muted);font-size:12px;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* 跨页跳转消息 */
.cross-page-hint{font-size:12px;color:var(--faint);text-align:center;padding:8px 12px;background:var(--surface-2);border-radius:8px;margin-top:14px}
/* 宪法 SVG icon 尺寸（main.html 已定义，stats.html 缺失导致 SVG 占满父容器） */
.icon{width:1em;height:1em;vertical-align:-0.15em;display:inline-block;flex-shrink:0}
.icon-spin{animation:iconSpin 1.2s linear infinite}
@keyframes iconSpin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
/* 移动端：以扫描效率为优先，减少重复卡片留白但保留完整数据 */
@media (max-width:600px){
  html,body{font-size:13px}
  .wrap{padding:10px 8px 20px}
  .page-head{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:6px;margin-bottom:8px}
  .page-head .spacer{display:none}
  .page-head h2{font-size:17px;white-space:nowrap}
  .stats-cards{margin-bottom:8px}
  .stats-cards .kpi-row{grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin-bottom:6px}
  .stats-cards .kpi-rounds{display:none}
  .stat-card{padding:7px 9px;border-radius:10px}
  .stat-card .k{font-size:10.5px}
  .stat-card .v{font-size:20px;margin-top:1px}
  .stat-card .start-btn{margin-top:3px;font-size:11px}
  .stats-cards .pair-row{gap:6px}
  .stat-card.dist-card{padding:7px 8px}
  .bar-chart{gap:4px;margin-top:4px}
  .bar-row{gap:5px}
  .bar-lbl{width:42px;font-size:10px}
  .bar-track{height:12px}
  .bar-cnt{width:24px;font-size:11px}
  .mastery-donut{flex-direction:column;gap:4px;margin-top:1px}
  .mastery-donut .donut{width:62px;height:62px}
  .mastery-donut .donut-legend{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px 4px;width:100%}
  .mastery-donut .donut-row{gap:3px}
  .mastery-donut .donut-row.extra{grid-column:1 / -1;margin-top:2px;padding-top:3px}
  .mastery-donut .dot{width:6px;height:6px}
  .mastery-donut .lbl{width:auto;font-size:10px;white-space:nowrap}
  .mastery-donut .cnt{width:18px;font-size:11px}
  .mastery-donut .pct{width:25px;font-size:9px}
  .stats-tabs{gap:4px;margin-bottom:6px}
  .stats-tabs .tab{padding:4px 10px;font-size:12px}
  .stats-filter{gap:4px;margin-bottom:8px}
  .stats-filter .f{padding:2px 10px;font-size:11px}
  .stats-list{gap:4px}
  .srow{gap:6px;padding:6px;border-radius:9px}
  .srow .row-num{width:24px;font-size:11px}
  .srow .en{font-size:12px}
  .srow .cn{font-size:10.5px}
  .stats-detail-row{display:grid;grid-template-columns:24px minmax(0,1fr) 56px 24px;grid-template-areas:"num sen badge toggle" "detail detail detail detail";column-gap:6px;row-gap:3px;align-items:center;cursor:pointer}
  .stats-detail-row .row-num{grid-area:num}
  .stats-detail-row .sen{grid-area:sen}
  .stats-detail-row .stats-state-cell{grid-area:badge}
  .stats-detail-row .row-detail-toggle{grid-area:toggle}
  .stats-detail-row .meta{display:none;grid-area:detail;font-size:10px;width:auto;margin:0;padding-top:5px;border-top:1px solid var(--border);text-align:left}
  .stats-detail-row.is-expanded .meta{display:block}
  .stats-detail-row .row-detail-toggle{display:block}
  .cross-page-hint{display:none}
}
/* 超窄屏：图表卡片改为上下排列，保证环形图图例与柱状图标签可读 */
@media (max-width:380px){
  .stats-cards .pair-row{flex-direction:column;gap:6px}
  .stat-card.dist-card{padding:8px 10px}
  .mastery-donut{flex-direction:row;align-items:center;gap:12px}
  .mastery-donut .donut{width:72px;height:72px}
  .mastery-donut .donut-legend{grid-template-columns:repeat(2,minmax(0,1fr));gap:3px 8px}
  .mastery-donut .donut-row{gap:5px}
  .mastery-donut .lbl{font-size:11px}
  .mastery-donut .cnt{font-size:12px}
  .mastery-donut .pct{font-size:10px}
  .srow .en,.srow .cn{white-space:normal;overflow:visible;text-overflow:clip;display:-webkit-box;-webkit-box-orient:vertical}
  .srow .en{-webkit-line-clamp:2}
  .srow .cn{-webkit-line-clamp:2}
}
/* 概览分两层：状态（只能看）→ 时间（月度汇总 + 打卡日历）。
   待复习与错题本保留在顶部页签中作为清单入口，概览不再重复显示可点击卡片。 */
[hidden]{display:none!important}
.overview-status{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-bottom:16px}
.ov-stat{min-width:0;padding:10px 12px;border:1px solid var(--border);border-radius:10px;background:var(--surface-stat)}
.ov-stat .l{display:block;font-size:11.5px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ov-stat .n{display:block;margin-top:2px;font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.ov-stat.is-warn .n{color:var(--warn)}
.overview-time{padding:14px 16px 12px;border:1px solid var(--border);border-radius:12px;background:var(--surface)}
.activity-section{padding:14px 0 2px}
.activity-section h3{display:flex;align-items:baseline;gap:8px;font-size:13px;margin:0 0 12px}
.overview-note{font-size:12px;color:var(--muted);margin:10px 0 0}
.stats-loading{min-height:72px;display:flex;align-items:center;justify-content:center;color:var(--faint);font-size:13px}
.stats-sync-status{margin:0 0 10px;padding:5px 9px;border-radius:7px;background:var(--warn-soft);color:var(--warn);font-size:12px;text-align:center}
.overview-month-summary{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:0 0 12px;border-bottom:1px solid var(--border);font-size:12px;color:var(--muted)}
.overview-month-summary .period-label{font-weight:700;color:var(--text)}
.overview-month-summary b{color:var(--text);font-variant-numeric:tabular-nums}
/* 异常项（没带日期的答题）从句子流里独立出来：只靠文字变色区分度太弱。 */
.overview-month-summary .undated{padding:1px 9px;border-radius:999px;background:var(--warn-soft);color:var(--warn)}
.overview-month-summary .undated b{color:var(--warn)}
.month-calendar-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;max-width:378px;margin:0 auto}
.month-calendar-weekday{text-align:center;padding:2px 0;font-size:10.5px;color:var(--faint)}
.month-calendar-day{aspect-ratio:1;display:flex;align-items:center;justify-content:center;min-width:0;border-radius:7px;
  color:var(--text);font-size:11px;font-variant-numeric:tabular-nums}
.month-calendar-day.l0{background:var(--surface-2);color:var(--faint)}
.month-calendar-day.l1{background:rgba(200,90,30,.22)}
.month-calendar-day.l2{background:rgba(200,90,30,.42)}
.month-calendar-day.l3{background:rgba(200,90,30,.68);color:#fff}
.month-calendar-day.l4{background:#c05a1d;color:#fff}
.month-calendar-day.future{background:transparent;color:var(--faint);opacity:.5}
.month-calendar-day.today{font-weight:800;outline:1px solid var(--text);outline-offset:-1px}
.month-calendar-day.pad{visibility:hidden}
.month-calendar-section{padding-bottom:0}
.stats-tabs{border-bottom:1px solid var(--border);gap:6px;margin:0 0 12px}
.stats-tabs .tab{border:0;border-radius:0;background:transparent;min-height:44px;padding:8px 12px}
.stats-tabs .tab.on{background:transparent;border-bottom:2px solid var(--accent)}
.stats-tabs .tab-count{margin-left:3px;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.stats-tabs .tab.on .tab-count{color:var(--accent)}
.stats-record-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:0 0 8px}
.stats-search{display:flex;align-items:center;gap:8px;flex:1 1 240px;min-width:220px}
.stats-search label{font-size:12px;color:var(--muted);white-space:nowrap}
.stats-search input{width:100%;max-width:140px;height:32px;border:1px solid var(--border-strong);border-radius:7px;background:var(--surface);color:var(--text);padding:5px 9px;font:inherit;outline:none}
.stats-search input::placeholder{color:var(--faint)}
.stats-search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.stats-search-clear{padding-left:7px;padding-right:7px;color:var(--muted)}
.stats-record-toolbar .stats-filter{flex:0 0 auto;margin:0}
.records-summary{display:flex;align-items:center;gap:8px;min-height:24px;margin:0 0 2px;color:var(--muted);font-size:12px}
.records-summary strong{color:var(--text);font-variant-numeric:tabular-nums}
.records-summary .query{max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stats-list{gap:0}
.srow,.review-row{border:0;border-bottom:1px solid var(--border);border-radius:0;background:transparent;padding:8px 0}
/* 桌面端以信息密度优先；移动端在下方媒体查询中恢复触控尺寸。 */
.btn,.stats-filter .f,.wrong-del,.row-detail-toggle{min-height:0}
.wrong-del,.row-detail-toggle{min-width:0}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media(min-width:601px){
  .stats-body .srow{padding:6px 0}
  .activity-track{max-width:40px}
}
@media(max-width:600px){
  .wrap{padding:12px 14px 24px}
  .overview-status{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:12px}
  .ov-stat{padding:8px 10px}
  .ov-stat .n{font-size:18px}
  .overview-time{padding:12px 12px 10px}
  .overview-month-summary{gap:8px;font-size:11.5px}
  .stats-tabs .tab{padding:8px;font-size:12px}
  .stats-record-toolbar{display:block;margin-bottom:6px}
  .stats-search{width:100%;min-width:0;margin-bottom:4px}
  .stats-search input{max-width:none}
  .stats-record-toolbar .stats-filter{width:100%}
  .records-summary{min-height:22px}
  .btn,.stats-filter .f,.wrong-del,.row-detail-toggle{min-height:44px}
  .wrong-del,.row-detail-toggle{min-width:44px}
  .mistake-export-panel{padding:5px 8px}.export-progress .btn{flex:0 0 auto}
  .srow,.review-row{padding:8px 0}
  .stats-detail-row{grid-template-columns:24px minmax(0,1fr) 56px 44px}
}
</style>
</head>
<body>

<div class="wrap">
  <div class="page-head">
    <button class="btn sm ghost" id="statsBack" title="返回主页"><span data-icon="arrowL"></span>返回</button>
    <h2><span data-icon="stats"></span> 学习档案</h2>
  </div>

  <div class="stats-tabs" id="statsTabs">
    <button class="tab on" data-tab="overview">概览</button>
    <button class="tab" data-tab="review">待复习<span class="tab-count" id="reviewTabCount"></span></button>
    <button class="tab" data-tab="wrong">错题本<span class="tab-count" id="wrongTabCount"></span></button>
    <button class="tab" data-tab="sent">学习记录</button>
  </div>

  <div class="stats-sync-status" id="statsSyncStatus" role="status" aria-live="polite" hidden></div>

  <div class="stats-cards" id="statsCards"></div>
  <div class="stats-record-toolbar" id="statsRecordToolbar" aria-label="学习记录筛选" hidden>
    <div class="stats-search">
      <label for="statsSentenceSearch">查找</label>
      <input id="statsSentenceSearch" type="search" autocomplete="off" placeholder="搜索句子或翻译" aria-label="搜索句子或翻译">
      <button class="btn sm ghost stats-search-clear" id="statsSearchClear" type="button" hidden>清除</button>
    </div>
    <div class="stats-filter" id="statsFilter">
      <button class="f on" data-f="all">全部</button>
      <button class="f" data-f="familiar">已熟悉</button>
      <button class="f" data-f="initialPassed">初测通过</button>
      <button class="f" data-f="mastered">已掌握</button>
      <button class="f" data-f="reinforce">需再验证</button>
      <button class="f" data-f="weak">需巩固</button>
      <button class="f" data-f="unseen">未练过</button>
    </div>
  </div>

  <div class="stats-body" id="statsBody"></div>

</div>

<script src="js/account-storage.js"></script>
<script>var businessStorage=window.AccountStorage.storage;</script>
<script src="builtins.js"></script>
<script src="js/course-catalog.js"></script>
<script src="js/course-progress.js"></script>

<script>
/* 宪法：UI 禁用字符 icon —— 初始 data-icon 元素替换为内联 SVG（icons.js） */
if(window.Icons) Icons.install();
/* ===== 学习档案 独立页面（stats.html）=====
   - 共享 core.js（CL 命名空间）：存储/工具/领域判定/事件总线
   - 数据通过浏览器本地存储与主页共享（同源） */

var mem = { decks:[], best:{}, mastered:{}, stats:{ totalRounds:0, totalAnswered:0, bySentence:{}, events:[] }, settings:{} };
var _statsDecks = null; /* 内置题库使用轻量 index；完整详情只在开始练习时取 */
/* CL 桥接：页面内沿用局部函数名（实现收敛到 core.js，调用点零改动） */
function loadMem(){ mem = CL.loadMem(); _statsDecks = null; }
function refreshConfirmedStatsProjection(){
  if(!statsProtocol3Active() || !CL.serverPersistenceReady || !CL.serverPersistenceReady() ||
     !window.ServerStore || !window.ServerCache) return Promise.resolve(false);
  var account=window.AccountStorage, owner=account&&account.owner;
  if(!owner) return Promise.resolve(false);
  return Promise.all([ServerStore.pending(),ServerCache.read()]).then(function(result){
    var pending=result[0], row=result[1];
    if(pending.length || !row || row.owner!==owner || !row.snapshot || !row.snapshot.mem ||
       !window.AccountStorage || window.AccountStorage.owner!==owner || !CL.serverPersistenceReady()) return false;
    /* Never project a possibly stale confirmed snapshot over unsent local work. */
    var local=CL.loadMem(), confirmed=row.snapshot.mem;
    mem=Object.assign({},local,confirmed);
    mem.settings=Object.assign({},local.settings||{},confirmed.settings||{});
    mem.progress=local.progress||{};
    _statsDecks=null;
    return true;
  }).catch(function(error){
    console.warn('[stats] confirmed projection unavailable; keeping local view:',error&&error.message||error);
    return false;
  });
}
function statsProtocol3Active(){
  var config = CL && CL.getCloudConfig ? CL.getCloudConfig() : null;
  return !!(config && config.persistenceMode === 'server-authoritative' && Number(config.writeProtocol) === 3);
}
function saveStore(syncMode){ return CL.saveAndNotify(mem, syncMode); }
function $(id){ return CL.$(id); }
function esc(s){ return CL.esc(s); }
function normSent(s){ return CL.normSent(s); }
function displayDeckName(name){
  var text = String(name || '').trim();
  var first = text.split(/\s*[·•]\s*/)[0].trim();
  return first || text;
}
function masteredKey(deckId, it){ return CL.masteredKey(deckId, it); }
function findDeck(deckId){
  var all = allDecks();
  for(var i=0;i<all.length;i++) if(all[i].id === deckId) return all[i];
  return null;
}
function allDecks(){
  /* 内置扩展题库优先使用 index；用户导入题库仍走 CL 的只读视图。 */
  return _statsDecks || CL.allDecksView(mem);
}
function timeAgo(t){ return CL.timeAgo(t); }
function classifyStat(s){ return CL.classifyStat(s); }
function isFluencyByDeck(deckId, it){ return CL.isFluencyByDeck(mem, deckId, it); }
function isMarkedForDeck(deckId, it){ return CL.isMarkedForDeck(mem, deckId, it); }
function withStatsSource(it, deckId){
  var copy = {};
  Object.keys(it || {}).forEach(function(k){ copy[k] = it[k]; });
  copy._statsDeckId = deckId || '';
  return copy;
}

/* 与主页一致：旧版本临时复习 ID 能唯一对应题库时自动并回稳定统计键。 */
function migrateLegacyStatKeys(){
  if(!mem.stats || !mem.stats.bySentence) return false;
  if(statsProtocol3Active()){
    if(!window.ServerCache||!window.ServerStatKeyMigration||!window.MainLegacyStats) return Promise.resolve(false);
    var owner=window.AccountStorage&&window.AccountStorage.owner;
    return ServerCache.read().then(function(row){
      if(!row||row.owner!==owner||!row.snapshot||!row.snapshot.mem) return false;
      var migration=MainLegacyStats.migrateLegacyStatKeys(mem.stats.bySentence,allDecks(),{
        normalizeSentence:normSent,hash:CL.fnv8
      });
      return ServerStatKeyMigration.run(migration.migrations,function(){return mem;});
    }).catch(function(error){
      console.warn('[stats] server-confirmed legacy migration unavailable:',error&&error.message||error);
      return false;
    });
  }
  var migration = MainLegacyStats.migrateLegacyStatKeys(mem.stats.bySentence, allDecks(), {
    normalizeSentence: normSent, hash: CL.fnv8
  });
  if(!migration.changed) return false;
  var by=mem.stats.bySentence;
  Object.keys(by).forEach(function(key){if(!(key in migration.by))delete by[key];});
  Object.keys(migration.by).forEach(function(key){by[key]=migration.by[key];});
  saveStore();
  return true;
}

/* ===== 渲染 ===== */
var _statsTab = 'overview';
var _statsFilter = 'all';
var _statsSearch = '';
var _wrongBookFilter = 'all';
var _mistakeExport = { open:false, snapshot:null, sourceRows:null, accountScope:'', batchIndex:0, lastCopiedIndex:-1, prompt:'', manualFallback:false, message:'', generating:false, stale:false };
var _mistakeExportGeneration = 0;
var _statsReinforceSaveFailed = false;
var _statsSaveFailureShown = false;
function saveWrongBookFromStats(){
  var result=statsProtocol3Active() ? CL.saveAndNotify(mem, 'local') : saveStore();
  if(result===false){_statsReinforceSaveFailed=true;if(!_statsSaveFailureShown){_statsSaveFailureShown=true;alert('错题未确认保存；当前页面仍可导出，刷新后可能无法恢复。');}return;}
  Promise.resolve(result).then(function(ok){
    _statsReinforceSaveFailed=ok===false;
    if(ok===false&&!_statsSaveFailureShown){_statsSaveFailureShown=true;alert('错题未确认保存；当前页面仍可导出，刷新后可能无法恢复。');}
    if(ok===true)_statsSaveFailureShown=false;
    renderStats();
  });
}
/* Deletion requires a server receipt; offline clicks leave the authoritative row untouched. */
var _listPages = {}, LIST_PAGE_SIZE = 50;
function listPage(rows, key){
  var page = Math.min(_listPages[key] || 0, Math.max(0, Math.ceil(rows.length / LIST_PAGE_SIZE)-1));
  _listPages[key] = page;
  return rows.slice(page * LIST_PAGE_SIZE, (page+1) * LIST_PAGE_SIZE);
}
function listPager(total, key){
  if(total <= LIST_PAGE_SIZE) return '';
  var page = _listPages[key] || 0, count = Math.ceil(total / LIST_PAGE_SIZE);
  return '<div style="display:flex;align-items:center;justify-content:center;gap:8px;margin:12px 0;flex-wrap:wrap">'+
    '<button class="btn sm" data-list-key="'+key+'" data-list-page="'+(page-1)+'"'+(page===0?' disabled':'')+'>上一页</button>'+
    '<span>'+(page+1)+' / '+count+' 页 · '+total+' 条</span>'+
    '<button class="btn sm" data-list-key="'+key+'" data-list-page="'+(page+1)+'"'+(page+1>=count?' disabled':'')+'>下一页</button></div>';
}
function mistakeExportAccountScope(){
  var account=window.AccountStorage;
  return account ? [account.owner||'',account.sessionEpoch||'',account.databaseName||''].join('|') : 'unknown-scope';
}
function recordSearchText(value){
  return String(value || '').toLocaleLowerCase().replace(/\s+/g, ' ').trim();
}

function monthActivitySummary(mem){
  var activity = CL.dailyActivity(mem), now = new Date();
  var prefix = CL.ymd(new Date(now.getFullYear(), now.getMonth(), 1)).slice(0,7) + '-';
  var days = 0, rounds = 0, monthAnswered = 0;
  Object.keys(activity).forEach(function(key){
    if(key.indexOf(prefix) !== 0) return;
    var item = activity[key] || {}, dayAnswered = Number(item.answered) || 0, done = Number(item.rounds) || 0;
    if(dayAnswered > 0 || done > 0) days++;
    rounds += done;
    monthAnswered += dayAnswered;
  });
  var audit = CL.answerStatsAudit(mem);
  return { days: days, rounds: rounds, answered: monthAnswered, totalAnswered: audit.totalAnswered };
}

function monthCalendarMarkup(activity, now){
  var year = now.getFullYear(), month = now.getMonth();
  var daysInMonth = new Date(year, month + 1, 0).getDate();
  var leading = (new Date(year, month, 1).getDay() + 6) % 7;
  var today = now.getDate();
  var cells = ['一','二','三','四','五','六','日'].map(function(label){
    return '<span class="month-calendar-weekday" aria-hidden="true">'+label+'</span>';
  }).join('');
  for(var pad=0; pad<leading; pad++) cells += '<span class="month-calendar-day pad" aria-hidden="true"></span>';
  for(var day=1; day<=daysInMonth; day++){
    var key = CL.ymd(new Date(year, month, day));
    var record = activity[key] || {answered:0,rounds:0};
    var answered = Number(record.answered) || 0, rounds = Number(record.rounds) || 0;
    var level = answered >= 40 ? 4 : answered >= 20 ? 3 : answered >= 10 ? 2 : (answered || rounds) ? 1 : 0;
    var future = day > today;
    var label = key+'：答题 '+answered+' 句，完成练习 '+rounds+' 轮';
    cells += '<time class="month-calendar-day '+(future?'future':'l'+level)+(day===today?' today':'')+'" datetime="'+key+'" data-day="'+key+'" data-answered="'+answered+'" data-rounds="'+rounds+'" aria-label="'+label+'" title="'+label+'">'+day+'</time>';
  }
  var monthLabel = year+'年'+(month+1)+'月';
  return '<section class="activity-section month-calendar-section" aria-label="'+monthLabel+'打卡日历">'+
    '<h3>本月打卡</h3><div class="month-calendar-grid">'+cells+'</div></section>';
}

/* Overview uses dated activity records for the monthly calendar. */
var _statsInitialSync = true;
var _statsSyncState = 'waiting';
var _statsSyncTimer = null;
var STATS_SYNC_TIMEOUT = 3000;
function setStatsSyncState(state){
  _statsSyncState = state;
  var status = $('statsSyncStatus');
  if(!status) return;
  status.hidden = state !== 'local';
  status.textContent = state === 'local' ? '本地记录 · 正在同步，完成后自动更新' : '';
}
function showLocalStatsFallback(){
  if(_statsSyncState !== 'waiting') return;
  _statsInitialSync = false;
  setStatsSyncState('local');
  loadMem();
  renderStats();
}
function renderStats(){
  var cards = $('statsCards'), body = $('statsBody');
  if(_statsInitialSync){
    cards.innerHTML = _statsTab === 'overview' ? '<div class="stats-loading" role="status" aria-live="polite">正在同步学习档案…</div>' : '';
    cards.hidden = _statsTab !== 'overview';
    body.innerHTML = _statsTab === 'overview' ? '' : '<div class="stats-loading" role="status" aria-live="polite">正在同步学习档案…</div>';
    Array.prototype.forEach.call($('statsTabs').children,function(b){
      b.classList.toggle('on',b.dataset.tab===_statsTab);
      b.setAttribute('aria-pressed',String(b.dataset.tab===_statsTab));
    });
    $('reviewTabCount').textContent = '';
    $('wrongTabCount').textContent = '';
    $('statsRecordToolbar').hidden = true;
    return;
  }
  if(!mem.stats) mem.stats = {totalRounds:0,totalAnswered:0,bySentence:{},events:[]};
  var by = mem.stats.bySentence || {};
  var keys = Object.keys(by).filter(function(k){ return !CL.isItemDeletedByKey(mem, k); });
  /* 已掌握只计当前内容版本的延迟测评证据；熟悉自评单独计数。 */
  var masteredCnt = CL.masteredSentenceCount(mem,_statsDecks || allDecks());
  var familiarCnt = CL.familiaritySentenceCount(mem);
  var weakCnt = keys.filter(function(k){ return classifyStat(by[k]) === 'weak'; }).length;
  var wrongCnt = getReinforceBook().length;
  var days = CL.dailyActivity(mem), now = new Date(), today = days[CL.ymd(now)] || {answered:0};
  var audit = CL.answerStatsAudit(mem);
  var month = monthActivitySummary(mem);
  var dueCnt = dueSentences().length;
  var statCell = function(label,value,opt){
    opt = opt || {};
    return '<div class="ov-stat'+(opt.warn?' is-warn':'')+'">'+
      '<span class="l">'+label+'</span>'+
      '<strong class="n"'+(opt.id?' id="'+opt.id+'"':'')+'>'+value+'</strong></div>';
  };
  var html = '<div class="overview-status">'+
    statCell('今日答题',today.answered,{id:'todayAnswered'})+
    statCell('已掌握',masteredCnt,{id:'masteredCount'})+
    statCell('已熟悉',familiarCnt,{id:'familiarCount'})+
    statCell('需巩固',weakCnt,{warn:true})+
    statCell('累计答题',audit.totalAnswered)+'</div>';
  html += '<div class="overview-time">';
  html += '<div class="overview-month-summary"><span class="period-label">本月</span>'+
    '<span>学习 <b>'+month.days+'</b> 天</span><span>完成 <b>'+month.rounds+'</b> 轮</span><span>答题 <b id="monthAnswered">'+month.answered+'</b> 句</span></div>';
  if(month.totalAnswered || Number(mem.stats.totalRounds)) html += monthCalendarMarkup(days, now);
  html += '<p class="overview-note">每完整练完一批计 1 轮</p>';
  html += '</div>'; /* /overview-time */
  if(!keys.length && !mem.stats.totalAnswered){
    html += '<div class="empty-tip">还没有学习记录。<a href="./main.html">开始练习</a></div>';
  }
  $('statsCards').innerHTML=html;
  $('statsCards').hidden=_statsTab!=='overview';
  Array.prototype.forEach.call($('statsTabs').children,function(b){
    b.classList.toggle('on',b.dataset.tab===_statsTab);
    b.setAttribute('aria-pressed',String(b.dataset.tab===_statsTab));
  });
  var reviewTabCount = $('reviewTabCount');
  if(reviewTabCount) reviewTabCount.textContent = '('+dueCnt+')';
  var wrongTabCount = $('wrongTabCount');
  if(wrongTabCount) wrongTabCount.textContent = '('+wrongCnt+')';
  var recordToolbar = $('statsRecordToolbar');
  if(recordToolbar) recordToolbar.hidden = _statsTab !== 'sent';
  var searchInput = $('statsSentenceSearch');
  if(searchInput && searchInput.value !== _statsSearch) searchInput.value = _statsSearch;
  var searchClear = $('statsSearchClear');
  if(searchClear) searchClear.hidden = !recordSearchText(_statsSearch);
  Array.prototype.forEach.call($('statsFilter').children,function(b){b.classList.toggle('on',b.dataset.f===_statsFilter);});
  var body=$('statsBody');
  if(_statsTab==='wrong') renderWrongBook(body);
  else if(_statsTab==='review') renderReviewList(body);
  else if(_statsTab==='sent') renderSentenceList(body);
  else body.innerHTML='';
}


function renderSentenceList(body){
  var by = mem.stats.bySentence || {};
  var rows = [];

  /* ★ 关键修复（v2）：rows 从「bySentence + mastered」改为「allDecks() 全集」（已过滤 deletedItems）。
     旧版只有"已练过 + 标熟"两类，导致：
       1. 「未练过」tab 永远为空——classifyStat 返回 'unseen' 的条件是 times===0，但 rows 压根没装这些条目
       2. 「全部」tab 也只显示已练过的，不符合字面意思
     圆环大字"60 / 339 句" 用的是 seg.unseen = totalInDecks - keys.length（基于 allDecks() 全集），
     跟 sentence list 不同源 → 用户看到圆环说"未练过 279"但 tab 空白，体感像 bug。 */
  var decks = allDecks();
  var seen = {};
  decks.forEach(function(d){
    var dId = d.id;
    (d.items || []).forEach(function(it){
      if(CL.isItemDeleted(mem, dId, it)) return;
      var cid = it.cid || CL.fnv8(it.sentence || '');
      var key = dId + '#' + cid;
      if(seen[key]) return;          /* deck 内同 cid 重复句去重 */
      seen[key] = true;
      var st = by[key];
      if(st && st.times){
        /* 已练过：用 stats 数据（spread 防 mutate）+ 叠加 item 的 translation */
        rows.push(Object.assign({}, st, { sentence:it.sentence||it.en||st.sentence||'', translation: it.translation || '', _key:key, _item:it, _familiar:!!(mem.mastered&&mem.mastered[key]) }));
      } else {
        /* 未练过：构造伪 stat，classifyStat 会返回 'unseen' */
        rows.push({
          deckId: dId,
          sentence: it.sentence || '',
          translation: it.translation || '',
          times: 0, okTimes: 0, wrongTimes: 0, streak: 0, maxStreak: 0,
          lastAt: 0, interval: 1, ease: 2.5, dueAt: 0,
          _masteredOnly: !!(mem.mastered && mem.mastered[key]), _key:key, _item:it, _familiar:!!(mem.mastered&&mem.mastered[key])
        });
      }
    });
  });

  /* mem.mastered 中"只标熟未练过"的句子（item 已不在 decks）：仍要显示在「已熟」tab
     ★ 但 deletedItems 标删的 item 不能从 mastered 复活（用户已经删除） */
  if(mem.mastered){
    Object.keys(mem.mastered).forEach(function(key){
      if(seen[key]) return;
      var m = mem.mastered[key];
      var _kp = CL.splitItemKey(key);
      var dId = _kp.deckId, cid = _kp.cid;
      if(CL.isItemDeleted(mem, dId, { cid: cid })) return;  /* 已被删 → 跳过 */
      seen[key] = true;
      rows.push({
        deckId: dId, sentence: m.sentence || '', translation: '',
        times: 0, okTimes: 0, wrongTimes: 0, streak: 0, maxStreak: 0,
        lastAt: m.markedAt || 0, interval: 1, ease: 2.5, dueAt: 0,
        _masteredOnly: true, _key:key, _familiar:true
      });
    });
  }

  /* 给每个 row 算 _practiceState（master/learn/weak/unseen），filter 统一判断 */
  rows.forEach(function(r){ r._practiceState = classifyStat(r); });
  rows.forEach(function(r){
    if(r._item && window.LearningEngine){
      var status = LearningEngine.resolveLearningState({stat:r, familiarity:r._familiar?mem.mastered[r._key]:null,
        contentFingerprint:LearningEngine.fingerprintAssessmentItem(r._item),now:Date.now()});
      r._learningPrimary = status.primary;
    }else r._learningPrimary = r._familiar ? 'familiar' : r._practiceState;
  });

  /* 排序：先按学习状态优先级，再按 lastAt desc；
     unseen 桶内按 deckId + sentence 字典序（首次接触顺序无意义，给个稳定排序即可） */
  var stateOrder = { reinforce: 0, mastered: 1, initialPassed: 2, familiar: 3, weak: 4, learning: 5, learn: 6, unseen: 7 };
  rows.sort(function(a, b){
    var sa = stateOrder[a._learningPrimary]; if(sa === undefined) sa = stateOrder[a._practiceState]; if(sa === undefined) sa = 99;
    var sb = stateOrder[b._learningPrimary]; if(sb === undefined) sb = stateOrder[b._practiceState]; if(sb === undefined) sb = 99;
    if(sa !== sb) return sa - sb;
    if(a._learningPrimary === 'unseen') return (a.deckId + '\u0001' + a.sentence).localeCompare(b.deckId + '\u0001' + b.sentence);
    return (b.lastAt || 0) - (a.lastAt || 0);
  });

  var query = recordSearchText(_statsSearch);
  var out = rows.filter(function(s){
    /* 只标熟未练过的句子（_masteredOnly=true）只出现在「已熟」tab，不出现在其它 tab */
    var matchesFilter;
    if(_statsFilter === 'all') matchesFilter = true;
    else if(_statsFilter === 'mastered') matchesFilter = s._learningPrimary === 'mastered';
    else if(_statsFilter === 'familiar') matchesFilter = !!s._familiar;
    else if(_statsFilter === 'initialPassed') matchesFilter = s._learningPrimary === 'initialPassed';
    else if(_statsFilter === 'reinforce') matchesFilter = s._learningPrimary === 'reinforce' || s._learningPrimary === 'needsRevalidation';
    else matchesFilter = s._practiceState === _statsFilter;
    if(!matchesFilter) return false;
    if(!query) return true;
    return recordSearchText(s.sentence).indexOf(query) >= 0 || recordSearchText(s.translation).indexOf(query) >= 0;
  });
  if(!out.length){
    body.innerHTML = '<div class="empty-tip">'+
      (rows.length === 0 ? '课程里还没有任何句子，去练习页导入或启用内置课程吧' :
       _statsFilter==='all' ? '还没有练习记录，先去练几题吧' :
       query ? '没有找到与“'+esc(_statsSearch.trim())+'”相关的句子' : '没有符合条件的句子')+'</div>';
    return;
  }
  var pageKey = 'sent-' + _statsFilter;
  var pageRows = listPage(out, pageKey);
  var pageStart = _listPages[pageKey] * LIST_PAGE_SIZE + 1;
  var pageEnd = pageStart + pageRows.length - 1;
  var summary = '<div class="records-summary"><span>'+(query ? '匹配' : '共')+' <strong>'+out.length+'</strong> 句</span>'+
    (query ? '<span class="query">“'+esc(_statsSearch.trim())+'”</span>' : '')+
    (out.length > LIST_PAGE_SIZE ? '<span>· 显示 '+pageStart+'–'+pageEnd+'</span>' : '')+'</div>';
  var html = summary + '<div class="stats-list">';
  pageRows.forEach(function(s, idx){
    var assessment = s._item && window.LearningEngine
      ? LearningEngine.getAssessmentEligibility({key:s._key,zh:s.translation,chunks:s._item.chunks,alts:s._item.alts,stat:s,familiarity:s._familiar?mem.mastered[s._key]:null},{now:Date.now()})
      : {eligible:false,eligibleAt:0};
    var assessmentAction = s._item && (s.times || s._familiar)
      ? (assessment.eligible
        ? '<a class="btn sm primary assessment-launch" href="./main.html?direct=1&amp;assessmentKey='+encodeURIComponent(s._key)+'">测这一句</a>'
        : '<span class="assessment-wait" title="达到复测周期后开放">'+(assessment.eligibleAt?('可测 '+new Date(assessment.eligibleAt).toLocaleDateString()):'暂不可测')+'</span>')
      : '';
    var badgeHtml =
      s._learningPrimary==='mastered' ? '<span class="badge master">已掌握</span>' :
      s._learningPrimary==='initialPassed' ? '<span class="badge learn">初测通过</span>' :

function mistakeOperationId(){
  var token=window.crypto&&typeof window.crypto.randomUUID==='function'
    ? window.crypto.randomUUID().replace(/-/g,'')
    : Date.now().toString(36)+Math.random().toString(36).slice(2)+Math.random().toString(36).slice(2);
  return 'mistake_remove_'+token;
}
async function removeMistakeRows(keys){
  var unique=Array.from(new Set((keys||[]).filter(function(key){return typeof key==='string'&&key.length>0;})));
  if(!unique.length) return;
  if(!statsProtocol3Active()){
    mem.reinforceBook=(mem.reinforceBook||[]).filter(function(item){return unique.indexOf(item._key)<0;});
    saveWrongBookFromStats();
    renderStats();
    return;
  }
  if(!window.ServerStore||typeof ServerStore.submitCommitted!=='function') throw new Error('保存服务暂不可用，错题仍保留在列表中。');
  if(navigator.onLine===false) throw new Error('请联网后再删除错题；当前记录尚未改变。');
  var completed=0;
  for(var i=0;i<unique.length;i++){
    var eventId=mistakeOperationId();
    await ServerStore.submitCommitted('mistake.remove',{eventId:eventId,key:unique[i]},{requestId:eventId});
    mem.reinforceBook=(mem.reinforceBook||[]).filter(function(item){return item._key!==unique[i];});
    completed++;
    var projected=await CL.saveAndNotify(mem,'local');
    if(projected===false) throw new Error('已安排删除 '+completed+' 条；本机显示状态未能更新，请刷新后核对其余错题。');
    if(projected&&typeof projected.then==='function'&&await projected===false){
      throw new Error('已安排删除 '+completed+' 条；本机显示状态未能更新，请刷新后核对其余错题。');
    }
  }
  renderStats();
}

function resolveMistakeBatchSources(snapshot,index){
  var entries=snapshot.records.slice(index*200,index*200+200), wanted=new Set();
  entries.forEach(function(entry){var row=entry.row||{};if(!row.sentence||!row.translation){if(row.deckId)wanted.add(String(row.deckId));}});
  if(!wanted.size)return null;
  var byCid=new Map(),bySentence=new Map();
  allDecks().forEach(function(deck){if(!wanted.has(String(deck.id)))return;(Array.isArray(deck.items)?deck.items:[]).forEach(function(item){if(item.cid)byCid.set(String(deck.id)+'#'+String(item.cid),item);if(item.sentence)bySentence.set(String(deck.id)+'#'+normSent(item.sentence),item);});});
  return function(row){return (row.cid&&byCid.get(String(row.deckId)+'#'+String(row.cid)))||bySentence.get(String(row.deckId)+'#'+normSent(row.sentence))||null;};
}

async function startMistakeBatchExport(rows){
  var token=++_mistakeExportGeneration, sourceMem=mem, accountScope=mistakeExportAccountScope();
  _mistakeExport.open=true;_mistakeExport.snapshot=null;_mistakeExport.sourceRows=rows;_mistakeExport.accountScope=accountScope;_mistakeExport.batchIndex=0;_mistakeExport.lastCopiedIndex=-1;_mistakeExport.prompt='';_mistakeExport.manualFallback=false;_mistakeExport.stale=false;_mistakeExport.generating=true;_mistakeExport.message='正在准备并复制第 1 批…';renderStats();
  function stillCurrent(){try{if(window.AccountStorage){AccountStorage.assertCurrent();if(AccountStorage.credentialsChanged())return false;}}catch(_){return false;}return token===_mistakeExportGeneration&&sourceMem===mem&&accountScope===mistakeExportAccountScope();}
  try{
    var snapshot=await MistakeReview.createExportSnapshotAsync({rows:rows,scopeLabel:'全部错题'},{shouldContinue:stillCurrent});
    if(!stillCurrent())return;
    _mistakeExport.snapshot=snapshot;_mistakeExport.generating=false;
    await copyMistakeBatch(0,token);
  }catch(error){if(stillCurrent())_mistakeExport.message=error.message||'复制失败，请重试。';}
  finally{if(token===_mistakeExportGeneration){_mistakeExport.generating=false;renderStats();}}
}

async function copyMistakeBatch(index,token){
  var snapshot=_mistakeExport.snapshot, accountScope=_mistakeExport.accountScope;
  if(_mistakeExport.generating||!snapshot||!snapshot.batchCount||token!==_mistakeExportGeneration)return;
  index=Math.max(0,Math.min(snapshot.batchCount-1,index));
  function stillCurrent(){try{if(window.AccountStorage){AccountStorage.assertCurrent();if(AccountStorage.credentialsChanged())return false;}}catch(_){return false;}return snapshot===_mistakeExport.snapshot&&token===_mistakeExportGeneration&&accountScope===mistakeExportAccountScope();}
  _mistakeExport.batchIndex=index;_mistakeExport.generating=true;_mistakeExport.manualFallback=false;_mistakeExport.message='正在复制第 '+(index+1)+' 批…';
  renderStats();
  try{
    var built=MistakeReview.buildBatchExport(snapshot,index,resolveMistakeBatchSources(snapshot,index));
    var prompt=MistakeReview.composeBatchSummaryPrompt(built);
    _mistakeExport.prompt=prompt;
    if(!stillCurrent())return;
    await navigator.clipboard.writeText(prompt);
    if(!stillCurrent())return;
    _mistakeExport.lastCopiedIndex=index;_mistakeExport.message='';
  }catch(error){
    if(!stillCurrent())return;
    _mistakeExport.manualFallback=true;_mistakeExport.message='复制失败，请手动复制下方内容。';
  }finally{if(token===_mistakeExportGeneration){_mistakeExport.generating=false;renderStats();}}
}

  if(!mem.reinforceBook) mem.reinforceBook = [];

/* 错题本是事实记录；“需巩固”只做派生筛选，不再另存一份句子清单。 */
function reinforceNeedsReview(b){
  if(b && b.needsReview) return true;
  var by = (mem.stats && mem.stats.bySentence) || {};
  if(!b || !b.deckId) return false;
  var cid = b.cid || (b.sentence ? CL.fnv8(b.sentence) : '');
  var stat = cid ? by[b.deckId + '#' + cid] : null;
  return !!(stat && classifyStat(stat) === 'weak');
}

/* ===== SRS 复习 ===== */
function dueSentences(){
  if(!mem.stats || !mem.stats.bySentence) return [];
  var out = [];
  var seen = {};
  var sources = new Map();
  allDecks().forEach(function(deck){
    var cids = new Map(), sentences = new Map();
    (deck.items || []).forEach(function(it){
      var cid = it.cid || CL.fnv8(it.sentence || '');
      if(!cids.has(cid)) cids.set(cid,it);
      if(!sentences.has(it.sentence)) sentences.set(it.sentence,it);
    });
    sources.set(deck.id,{deck:deck,cids:cids,sentences:sentences});
  });
  Object.keys(mem.stats.bySentence).forEach(function(k){
    var st = mem.stats.bySentence[k];
    if(typeof st.dueAt !== 'number' || !st.dueAt || st.dueAt > Date.now()) return;
    var source = sources.get(st.deckId);
    if(!source) return;
    var deck = source.deck;
    var sep = k.indexOf('#');
    var cid = sep > 0 ? k.substring(sep + 1) : '';
    var it = source.cids.get(cid) || source.sentences.get(st.sentence);
    if(!it) return;
    var key = st.deckId + '#' + normSent(it.sentence);
    if(seen[key]) return;
    seen[key] = true;
    out.push({ it:withStatsSource(it, st.deckId), st:st, deck:deck });
  });
  return out;
}

function practiceReviewDeck(deck){
  var items = (deck.items || []).filter(function(it){
    return isMarkedForDeck(deck.id, it) || isFluencyByDeck(deck.id, it);
  }).map(function(it){ return withStatsSource(it, deck.id); });
  if(!items.length){ alert('该课程没有已标熟/已掌握的句子'); return; }
  launchReviewItems({ id:'rev-'+deck.id+'-'+Date.now().toString(36), name:'复习 · '+displayDeckName(deck.name), items:items });
}
function practiceWrongBook(){
  var book = getReinforceBook().filter(function(b){ return _wrongBookFilter === 'focus' ? reinforceNeedsReview(b) : true; });
  var seen = {};
  var items = [];
  book.forEach(function(b){
    var key = b.deckId + '#' + normSent(b.sentence);
    if(seen[key]) return;
    seen[key] = true;
    var deck = findDeck(b.deckId);
    if(!deck) return;
    var it = (deck.items||[]).find(function(x){ return x.sentence === b.sentence; });
    if(it) items.push(withStatsSource(it, b.deckId));
  });
  if(!items.length){ alert('错题本中的句子已全部删除或找不到对应课程'); return; }
  launchReviewItems({ id:'book-'+Date.now().toString(36), name:'错题', items:items });
}

if(searchClear) searchClear.onclick = function(){
  _statsSearch = '';
  _listPages['sent-' + _statsFilter] = 0;
  renderStats();
  if(sentenceSearch) sentenceSearch.focus();
};
$('statsBody').addEventListener('click', function(ev){
  var pager = ev.target.closest('[data-list-page]');
  if(pager && !pager.disabled){
    _listPages[pager.dataset.listKey] = Math.max(0, Number(pager.dataset.listPage) || 0);
    renderStats(); $('statsBody').scrollIntoView({block:'start'}); return;
  }
  if(!window.matchMedia || !window.matchMedia('(max-width:600px)').matches) return;
  var row = ev.target.closest && ev.target.closest('.stats-detail-row');
  if(row) toggleSentenceDetail(row);
});
function discardMistakeExportSnapshot(){
  _mistakeExportGeneration++;
  _mistakeExport.stale=!!_mistakeExport.snapshot;_mistakeExport.generating=false;_mistakeExport.message='学习数据已刷新；当前快照仍保留原始范围，重新生成可纳入最新错题。';
}
/* ★ 返回主页（独立窗口场景通用） */
$('statsBack').onclick = function(){ window.location.href = './main.html'; };

/* 接收主页面消息：刷新数据 */
window.addEventListener('message', function(ev){
  if(ev.data && ev.data.type === 'memUpdated'){
    discardMistakeExportSnapshot();
    loadMem();
    var p = window.ContentRepo && ContentRepo.ensureIndexAll ? ContentRepo.ensureIndexAll(mem).then(function(decks){ _statsDecks = decks; }) : Promise.resolve();
    p.then(renderStats);
  }
});

/* ★ 多标签页旧快照防护（P0）：其他标签页有新写入 → 刷新统计展示。
   必须走 CL.refreshExternal()（重新从 IDB 载入句子档案/事件内存桥），
   否则 CL.loadMem() 只会返回本页旧的内存桥 —— 看不到其他标签页刚写的练习记录。
   触发源由 core.js 统一处理（BroadcastChannel 主通道 + beacon/storage 降级通道），
   故这里只订阅 CL 事件，不再自行监听 storage（避免重复渲染）。 */
function reloadFromOtherTab(){
  discardMistakeExportSnapshot();
  var p = (CL.refreshExternal ? CL.refreshExternal() : Promise.resolve(CL.loadMem()));
  p.catch(function(){}).then(function(m){
    if(m) mem = m; else loadMem();
    _statsDecks = null;
    var q = (window.ContentRepo && ContentRepo.ensureIndexAll)
      ? ContentRepo.ensureIndexAll(mem).then(function(decks){ _statsDecks = decks; })
      : Promise.resolve();
    return q;
  }).then(function(){ renderStats(); });
}
if(CL && CL.on){
  CL.on('memExternal', reloadFromOtherTab);
} else {
  window.addEventListener('storage', function(e){
    if(e.key === 'chunklab.v1'){
      loadMem();
      var p = window.ContentRepo && ContentRepo.ensureIndexAll ? ContentRepo.ensureIndexAll(mem).then(function(decks){ _statsDecks = decks; }) : Promise.resolve();
      p.then(renderStats);
    }
  });
}
window.addEventListener('server-cache-applied', function(event){
  var detail=event&&event.detail;
  var account=window.AccountStorage;
  if(detail&&account&&detail.owner!==account.owner) return;
  refreshConfirmedStatsProjection().then(function(applied){
    if(!applied) return;
    var ready=window.ContentRepo&&ContentRepo.ensureIndexAll
      ? ContentRepo.ensureIndexAll(mem).then(function(decks){_statsDecks=decks;})
      : Promise.resolve();
    ready.then(renderStats);
  });
});
var _statsLastFocusRefreshAt = Date.now();
window.addEventListener('focus', function(){
  if(!statsProtocol3Active() || !CL.serverPersistenceReady || !CL.serverPersistenceReady() ||
     !window.ServerCache || !window.AccountStorage || !window.AccountStorage.owner) return;
  var now=Date.now();
  if(now-_statsLastFocusRefreshAt<5000) return;
  _statsLastFocusRefreshAt=now;
  ServerCache.refresh().catch(function(error){
    console.warn('[stats] cross-device refresh deferred:',error&&error.message||error);
  });
});

/* 首屏先走本地快路径。云端请求或题库资源即使迟到，也不会把页面锁成只有 Tab 的空壳。
   若统计已迁到 IndexedDB，先等本地预载完成，避免把 localStorage 的旧投影短暂显示成最新值；
   IDB 异常时最多等 180ms，仍以可用的本地投影开屏。 */
var _localPainted = false;
function paintLocalStats(){
  if(_localPainted) return;
  _localPainted = true;
  loadMem();
  renderStats();
}
var _localPaintTimer = setTimeout(paintLocalStats, 180);
_statsSyncTimer = setTimeout(showLocalStatsFallback, STATS_SYNC_TIMEOUT);
Promise.resolve(CL.preload ? CL.preload() : true).catch(function(error){
  console.warn('[stats] 本地统计预载失败，使用同步副本：', error && error.message || error);
}).then(function(){
  clearTimeout(_localPaintTimer);
  paintLocalStats();
});
Promise.all([CL.ensureCloud(), window.ContentRepo ? ContentRepo.ready : Promise.resolve()]).then(function(){
  return refreshConfirmedStatsProjection().then(function(applied){
    if(!applied) loadMem();
    if(window.ContentRepo && ContentRepo.ensureIndexAll){
      return ContentRepo.ensureIndexAll(mem).then(function(decks){ _statsDecks = decks; });
    }
    return window.ContentRepo ? ContentRepo.ensureAll(mem).then(function(){ _statsDecks = CL.allDecksView(mem); }) : Promise.resolve();
  });
}).then(function(){
  clearTimeout(_statsSyncTimer);
  _statsSyncTimer = null;
  _statsInitialSync = false;
  setStatsSyncState('ready');
  migrateLegacyStatKeys();
  renderStats();
}).catch(function(error){
  /* 云端/题库失败不应抹掉本地概览；保留可用的首屏并记录原因供排查。 */
  clearTimeout(_statsSyncTimer);
  _statsSyncTimer = null;
  _statsInitialSync = false;
  setStatsSyncState('local');
  console.warn('[stats] 异步初始化失败，继续使用本地统计：', error && error.message || error);
  loadMem();
  renderStats();
});
</script>

</body>
</html>
