<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>学习档案 · Chunk Lab</title>
<style>
:root{--bg:#f4f2ee;--surface:#fffdfa;--surface-2:#f9f7f3;--border:#dedbd4;--border-strong:#c8c2b8;--text:#202326;--muted:#74716a;--faint:#9a958c;--accent:#2c62c9;--accent-soft:#e8efff;--ok:#23855a;--ok-soft:#e8f5ee;--bad:#b6483e;--bad-soft:#f7eae8;--warn:#a16207;--warn-soft:#f3e8c9;--shadow:0 1px 2px rgba(46,43,37,.06),0 6px 24px -12px rgba(46,43,37,.18)}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font:13.5px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
.wrap{max-width:880px;margin:0 auto;padding:14px 18px 32px;min-width:0}
.page-head{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.page-head h2{margin:0;font-size:18px;font-weight:700}
.spacer{flex:1}
.btn{border:1px solid var(--border-strong);background:var(--surface);border-radius:8px;padding:5px 12px;font-size:13px;color:var(--text);cursor:pointer;transition:background .15s}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.primary:hover{background:#1e4fa3}
.btn.sm{padding:3px 10px;font-size:12.5px}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.hidden{display:none !important}

/* statsCards 自身是 block，内部 row 自管 grid */
.stats-cards{display:block;margin-bottom:14px}
.stats-cards .kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:10px}
/* ★ 指标对比 + 熟练度分布 并排一行（flexbox 等分） */
.stats-cards .pair-row{display:flex;flex-direction:row;gap:14px}
.stats-cards .pair-row > .stat-card{flex:1;min-width:0} /* 等分宽度，不被内容撑开 */
.stat-card{border:1px solid var(--border);border-radius:12px;padding:10px 12px;background:var(--surface);min-width:0;overflow:hidden}
.stat-card .k{font-size:11.5px;color:var(--faint);letter-spacing:.03em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stat-card .v{font-size:22px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stat-card .v.mastery-grid{font-size:12px;white-space:normal;letter-spacing:0} /* 子容器重置继承 */
.stat-card .start-btn{display:flex;align-items:center;gap:3px;margin-top:6px;background:transparent;border:none;padding:0;font-size:12px;font-weight:600;color:var(--accent);cursor:pointer;text-align:left;letter-spacing:.01em}
.start-btn .icon{width:13px;height:13px}
.stat-card .start-btn:hover{text-decoration:underline}
.stat-card.hl{border-color:var(--accent);background:var(--accent-soft)}
.stat-card.hl .v{color:var(--accent)}
.stat-card.ok .v{color:var(--ok)}
.stat-card.warn .v{color:var(--warn)}
/* ★ 空态引导卡（2026-09-09：新档案先看到"能长成什么样"，主动装入示例统计，不造假掌握/错题） */
.stat-hero{border:1px dashed var(--border);border-radius:14px;background:var(--surface);padding:16px 18px;margin-bottom:14px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.stat-hero-txt{flex:1;min-width:220px}
.stat-hero-t{font-size:14px;font-weight:700;color:var(--text)}
.stat-hero-d{font-size:12.5px;color:var(--muted);margin-top:4px;line-height:1.6}
.stat-hero-actions{display:flex;gap:8px;align-items:center}
/* 示例统计撤销条：装入后常驻本页（刷新前可撤，刷新后并入总览） */
.undo-bar{display:flex;align-items:center;gap:10px;border:1px solid var(--border);border-radius:10px;background:var(--surface);padding:8px 12px;margin-bottom:10px;font-size:12.5px;color:var(--muted)}
.undo-bar .grow{flex:1}
/* 指标对比/熟练度分布卡片：在 pair-row 内并排时不再跨列 */
.stat-card.dist-card{padding:10px 14px}
.stat-card.dist-card .k{margin-bottom:2px}
/* 指标对比柱状图（水平柱） */
.bar-chart{display:flex;flex-direction:column;gap:7px;margin-top:6px;min-width:0}
.bar-row{display:flex;align-items:center;gap:10px;min-width:0}
.bar-lbl{flex-shrink:0;width:56px;font-size:12px;color:var(--muted);text-align:right}
.bar-track{flex:1;height:16px;background:var(--surface-2);border-radius:8px;overflow:hidden;min-width:0}
.bar-fill{height:100%;border-radius:8px;transition:width .4s ease}
.bar-cnt{flex-shrink:0;width:34px;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;text-align:right}

/* 熟练度分布：圆环图 + 图例（紧凑：圆环小，图例单列 5 行） */
.mastery-donut{display:flex;align-items:center;gap:18px;font-size:12px;line-height:1.3;white-space:normal;letter-spacing:0;min-width:0;margin-top:2px}
.mastery-donut .donut-wrap{position:relative;flex-shrink:0;width:78px;height:78px;cursor:pointer;border-radius:50%}
.mastery-donut .donut-wrap:focus{outline:none;box-shadow:0 0 0 2px var(--accent-soft)}
.mastery-donut .donut-wrap.pop-open{box-shadow:0 0 0 2px var(--accent)}
.mastery-donut .donut{width:78px;height:78px;display:block}

/* 熟练度圆环 hover popover（2026-09-08 老板反馈：圆环内小字看不清 → 加 hover 完整数据）
   沿用 main.html .pop-info 设计语言（portal + fixed + JS viewport 坐标） */
.donut-pop{
  position:fixed;left:0;top:0;
  min-width:184px;max-width:240px;
  background:var(--surface);
  border:1px solid var(--border);border-radius:10px;
  padding:8px 10px;
  box-shadow:0 6px 20px -6px rgba(0,0,0,.14),0 2px 6px rgba(0,0,0,.06);
  z-index:60;
  opacity:0;pointer-events:none;
  transition:opacity .18s,transform .18s cubic-bezier(.2,.8,.3,1);
  font-size:12px;color:var(--text);
  -webkit-user-select:none;user-select:none;
}
.donut-pop.open{opacity:1;pointer-events:auto}
.donut-pop-title{
  font-size:10.5px;font-weight:700;color:var(--accent);
  letter-spacing:.06em;text-transform:uppercase;
  margin:0 0 4px;padding-bottom:3px;
  border-bottom:1px solid var(--border);
  display:flex;justify-content:space-between;align-items:center;
  min-height:16px;flex-shrink:0;
}
.donut-pop-title .badge{
  font-size:9px;padding:1px 6px;border-radius:999px;
  background:var(--accent-soft);color:var(--accent);letter-spacing:.02em;
}
.donut-pop-row{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:1px 0}
.donut-pop-row .lbl{color:var(--muted);font-size:11px;flex-shrink:0;line-height:1.25;display:inline-flex;align-items:center;gap:5px}
.donut-pop-row .lbl .dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;display:inline-block}
.donut-pop-row .val{font-weight:700;font-size:11.5px;line-height:1.25;font-variant-numeric:tabular-nums;text-align:right}
.donut-pop-row .val .pct{font-size:10px;color:var(--faint);font-weight:400;margin-left:4px}
.donut-pop-row .val.muted{color:var(--faint);font-weight:400}
.donut-pop-row .val.good{color:var(--ok)}

@media (max-width:640px){
  .donut-pop{
    min-width:200px;width:max-content;
    max-width:min(240px, calc(100vw - 32px));
  }
}
.mastery-donut .donut-legend{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.mastery-donut .donut-row{display:flex;align-items:center;gap:8px;min-width:0}
.mastery-donut .donut-row.extra{margin-top:4px;padding-top:5px;border-top:1px dashed var(--border);font-style:italic}
.mastery-donut .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;display:inline-block}
.mastery-donut .lbl{color:var(--muted);width:60px;font-size:12px}
.mastery-donut .cnt{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--text);width:24px;text-align:right;flex-shrink:0;margin-left:auto}
.mastery-donut .pct{font-size:11px;color:var(--faint);width:32px;text-align:right;font-variant-numeric:tabular-nums;flex-shrink:0}
.mastery-grid{display:flex;flex-direction:column;gap:4px;margin-top:6px;font-size:12px;font-weight:400;line-height:1.3;letter-spacing:0;min-width:0}

.stats-tabs{display:flex;gap:6px;margin-bottom:10px}
.stats-tabs .tab{border:1px solid var(--border);background:var(--surface);border-radius:8px;padding:5px 14px;font-size:13px;color:var(--text);cursor:pointer}
.stats-tabs .tab.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}
.stats-filter{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.stats-filter .f{border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:3px 12px;font-size:12px;color:var(--muted);cursor:pointer}
.stats-filter .f.on{border-color:var(--accent);background:var(--accent);color:#fff}

.stats-list{display:flex;flex-direction:column;gap:6px}
.srow{display:flex;align-items:center;gap:10px;padding:8px 12px;border:1px solid var(--border);border-radius:10px;background:var(--surface)}
.srow .row-num{align-self:flex-start;flex-shrink:0;width:32px;margin-top:2px;font-size:12px;font-weight:700;color:var(--accent);text-align:right;font-variant-numeric:tabular-nums}
.srow .sen{flex:1;min-width:0}
.srow .en{font-size:13.5px;font-weight:600;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srow .cn{font-size:11.5px;color:var(--faint);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srow .meta{flex-shrink:0;text-align:right;font-size:11.5px;color:var(--muted)}
.row-detail-toggle{display:none;flex-shrink:0;width:24px;height:24px;border:0;border-radius:50%;background:transparent;position:relative;cursor:pointer}
.row-detail-toggle::before{content:"";position:absolute;left:8px;top:7px;width:7px;height:7px;border-right:1.5px solid var(--muted);border-bottom:1.5px solid var(--muted);transform:rotate(45deg);transition:transform .15s ease}
.stats-detail-row.is-expanded .row-detail-toggle::before{transform:rotate(225deg);top:10px}
.badge{font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:999px;flex-shrink:0}
.badge.master{background:var(--ok-soft);color:var(--ok)}
.badge.weak{background:var(--bad-soft);color:var(--bad)}
.badge.new{background:#eef1f6;color:var(--muted)}
.badge.learn{background:var(--accent-soft);color:var(--accent)}

.wrong-row{display:flex;align-items:flex-start;gap:10px;padding:8px 12px;border:1px solid var(--border);border-radius:10px;background:var(--surface)}
.wrong-row .sen{flex:1;min-width:0}
.wrong-row .en{font-size:13.5px;font-weight:600;line-height:1.3}
.wrong-row .cn{font-size:11.5px;color:var(--faint);margin-top:1px}
.wrong-row .wrong-detail{font-size:11.5px;margin-top:4px;color:var(--bad)}
.wrong-row .wrong-detail b{color:var(--ok);font-weight:600}
.wrong-del{flex-shrink:0;border:none;background:transparent;color:var(--faint);width:24px;height:24px;border-radius:50%;cursor:pointer;line-height:1;padding:0;display:grid;place-items:center}
.wrong-del .icon{width:14px;height:14px}
.wrong-del:hover{background:var(--bad-soft);color:var(--bad)}

.empty-tip{padding:26px;text-align:center;color:var(--faint);font-size:13px;border:1px dashed var(--border);border-radius:12px}

/* 练习临时题库按钮（在 stats 内可触发进入复习队列） */
.review-row{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--border);border-radius:10px;background:var(--surface)}
.review-row .nm{flex:1;font-size:13.5px;font-weight:600}

/* 跨页跳转消息 */
.cross-page-hint{font-size:12px;color:var(--faint);text-align:center;padding:8px 12px;background:var(--surface-2);border-radius:8px;margin-top:14px}
.review-head{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.review-head .review-count{font-size:12.5px;color:var(--warn)}
.review-head .spacer{flex:1}
/* 宪法 SVG icon 尺寸（main.html 已定义，stats.html 缺失导致 SVG 占满父容器） */
.icon{width:1em;height:1em;vertical-align:-0.15em;display:inline-block;flex-shrink:0}
.icon-spin{animation:iconSpin 1.2s linear infinite}
@keyframes iconSpin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
/* 移动端：以扫描效率为优先，减少重复卡片留白但保留完整数据 */
@media (max-width:600px){
  html,body{font-size:13px}
  .wrap{padding:10px 8px 20px}
  .page-head{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:6px;margin-bottom:8px}
  .page-head .spacer{display:none}
  .page-head h2{font-size:17px;white-space:nowrap}
  #btnPracticeWrong{white-space:nowrap;padding:4px 8px;font-size:12px}
  .stats-cards{margin-bottom:8px}
  .stats-cards .kpi-row{grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin-bottom:6px}
  .stats-cards .kpi-rounds{display:none}
  .stat-card{padding:7px 9px;border-radius:10px}
  .stat-card .k{font-size:10.5px}
  .stat-card .v{font-size:20px;margin-top:1px}
  .stat-card .start-btn{margin-top:3px;font-size:11px}
  .stats-cards .pair-row{gap:6px}
  .stat-card.dist-card{padding:7px 8px}
  .bar-chart{gap:4px;margin-top:4px}
  .bar-row{gap:5px}
  .bar-lbl{width:42px;font-size:10px}
  .bar-track{height:12px}
  .bar-cnt{width:24px;font-size:11px}
  .mastery-donut{flex-direction:column;gap:4px;margin-top:1px}
  .mastery-donut .donut{width:62px;height:62px}
  .mastery-donut .donut-legend{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px 4px;width:100%}
  .mastery-donut .donut-row{gap:3px}
  .mastery-donut .donut-row.extra{grid-column:1 / -1;margin-top:2px;padding-top:3px}
  .mastery-donut .dot{width:6px;height:6px}
  .mastery-donut .lbl{width:auto;font-size:10px;white-space:nowrap}
  .mastery-donut .cnt{width:18px;font-size:11px}
  .mastery-donut .pct{width:25px;font-size:9px}
  .stats-tabs{gap:4px;margin-bottom:6px}
  .stats-tabs .tab{padding:4px 10px;font-size:12px}
  .stats-filter{gap:4px;margin-bottom:8px}
  .stats-filter .f{padding:2px 10px;font-size:11px}
  .stats-list{gap:4px}
  .srow{gap:6px;padding:6px;border-radius:9px}
  .srow .row-num{width:24px;font-size:11px}
  .srow .en{font-size:12px}
  .srow .cn{font-size:10.5px}
  .stats-detail-row{display:grid;grid-template-columns:24px minmax(0,1fr) auto 24px;grid-template-areas:"num sen badge toggle" "detail detail detail detail";column-gap:6px;row-gap:3px;align-items:center;cursor:pointer}
  .stats-detail-row .row-num{grid-area:num}
  .stats-detail-row .sen{grid-area:sen}
  .stats-detail-row .badge{grid-area:badge}
  .stats-detail-row .row-detail-toggle{grid-area:toggle}
  .stats-detail-row .meta{display:none;grid-area:detail;font-size:10px;width:auto;margin:0;padding-top:5px;border-top:1px solid var(--border);text-align:left}
  .stats-detail-row.is-expanded .meta{display:block}
  .stats-detail-row .row-detail-toggle{display:block}
  .cross-page-hint{display:none}
  .review-head{gap:6px}
  .review-head button{margin-left:auto}
}
/* 超窄屏：图表卡片改为上下排列，保证环形图图例与柱状图标签可读 */
@media (max-width:380px){
  .stats-cards .pair-row{flex-direction:column;gap:6px}
  .stat-card.dist-card{padding:8px 10px}
  .mastery-donut{flex-direction:row;align-items:center;gap:12px}
  .mastery-donut .donut{width:72px;height:72px}
  .mastery-donut .donut-legend{grid-template-columns:repeat(2,minmax(0,1fr));gap:3px 8px}
  .mastery-donut .donut-row{gap:5px}
  .mastery-donut .lbl{font-size:11px}
  .mastery-donut .cnt{font-size:12px}
  .mastery-donut .pct{font-size:10px}
  .srow .en,.srow .cn{white-space:normal;overflow:visible;text-overflow:clip;display:-webkit-box;-webkit-box-orient:vertical}
  .srow .en{-webkit-line-clamp:2}
  .srow .cn{-webkit-line-clamp:2}
}
</style>
</head>
<body>

<div class="wrap">
  <div class="page-head">
    <button class="btn sm ghost" id="statsBack" title="返回主页"><span data-icon="arrowL"></span>返回</button>
    <h2><span data-icon="stats"></span> 学习档案</h2>
    <span class="spacer"></span>
    <button class="btn sm primary" id="btnPracticeWrong" title="练习错题本中所有句子"><span data-icon="target"></span>练习错题</button>
  </div>

  <div class="stats-cards" id="statsCards"></div>

  <div class="stats-tabs" id="statsTabs">
    <button class="tab on" data-tab="sent">句子记录</button>
    <button class="tab" data-tab="review">复习</button>
    <button class="tab" data-tab="wrong">错题本</button>
  </div>

  <div class="stats-filter" id="statsFilter" style="display:flex">
    <button class="f on" data-f="all">全部</button>
    <button class="f" data-f="mastered">已熟</button>
    <button class="f" data-f="weak">需巩固</button>
    <button class="f" data-f="unseen">未练过</button>
  </div>

  <div class="stats-body" id="statsBody"></div>

  <div class="cross-page-hint">点击「开始复习」或「复习 N 句」会切到练习页（main.html）</div>
</div>

<script src="builtins.js"></script>
<script src="oral8000.js"></script>
<script src="freq-idioms.js"></script>
<script src="js/idb.js"></script>
<script src="core.js"></script>
<script src="api.js"></script>
<script src="auth-ui.js"></script>
<script src="js/icons.js"></script>
<script>
/* 宪法：UI 禁用字符 icon —— 初始 data-icon 元素替换为内联 SVG（icons.js） */
if(window.Icons) Icons.install();
/* ===== 学习档案 独立页面（stats.html）=====
   - 共享 core.js（CL 命名空间）：存储/工具/领域判定/事件总线
   - 数据通过浏览器本地存储与主页共享（同源） */

var mem = { decks:[], best:{}, mastered:{}, stats:{ totalRounds:0, totalAnswered:0, bySentence:{}, events:[] }, settings:{} };
/* CL 桥接：页面内沿用局部函数名（实现收敛到 core.js，调用点零改动） */
function loadMem(){ mem = CL.loadMem(); }
function saveStore(){ CL.saveAndNotify(mem); }
function $(id){ return CL.$(id); }
function esc(s){ return CL.esc(s); }
function normSent(s){ return CL.normSent(s); }
function displayDeckName(name){
  var text = String(name || '').trim();
  var first = text.split(/\s*[·•]\s*/)[0].trim();
  return first || text;
}
function masteredKey(deckId, it){ return CL.masteredKey(deckId, it); }
function findDeck(deckId){
  var all = allDecks();
  for(var i=0;i<all.length;i++) if(all[i].id === deckId) return all[i];
  return null;
}
function allDecks(){
  /* 收敛：内置（deletedItems 过滤副本）+ 用户导入，统一走 CL（core.js 单一实现） */
  return CL.allDecksView(mem);
}
function timeAgo(t){ return CL.timeAgo(t); }
function classifyStat(s){ return CL.classifyStat(s); }
function isFluencyByDeck(deckId, it){ return CL.isFluencyByDeck(mem, deckId, it); }
function isMarkedForDeck(deckId, it){ return CL.isMarkedForDeck(mem, deckId, it); }
function withStatsSource(it, deckId){
  var copy = {};
  Object.keys(it || {}).forEach(function(k){ copy[k] = it[k]; });
  copy._statsDeckId = deckId || '';
  return copy;
}

/* 与主页一致：旧版本临时复习 ID 能唯一对应题库时自动并回稳定统计键。 */
function migrateLegacyStatKeys(){
  if(!mem.stats || !mem.stats.bySentence) return false;
  var decks = allDecks(), known = {};
  decks.forEach(function(d){ known[d.id] = d; });
  var changed = false, by = mem.stats.bySentence;
  function merge(a,b){
    var latest = (a.lastAt||0) >= (b.lastAt||0) ? a : b;
    var out = Object.assign({}, latest);
    out.times=(a.times||0)+(b.times||0); out.okTimes=(a.okTimes||0)+(b.okTimes||0);
    out.wrongTimes=(a.wrongTimes||0)+(b.wrongTimes||0); out.maxStreak=Math.max(a.maxStreak||0,b.maxStreak||0);
    return out;
  }
  Object.keys(by).forEach(function(oldKey){
    var st=by[oldKey]; if(!st || !st.deckId || known[st.deckId]) return;
    var sourceId='';
    if(st.deckId.indexOf('rev-')===0) decks.forEach(function(d){ if(!sourceId && st.deckId.indexOf('rev-'+d.id+'-')===0) sourceId=d.id; });
    if(!sourceId){
      var candidates=decks.filter(function(d){ return (d.items||[]).some(function(it){ return normSent(it.sentence||it.en||'')===normSent(st.sentence||''); }); });
      if(candidates.length===1) sourceId=candidates[0].id;
      if(candidates.length>1){ var named=candidates.filter(function(d){ return d.name===st.deckName; }); if(named.length===1) sourceId=named[0].id; }
    }
    if(!sourceId) return;
    var newKey=sourceId+'#'+CL.fnv8(st.sentence||'');
    by[newKey]=by[newKey]?merge(by[newKey],st):Object.assign(st,{deckId:sourceId,deckName:known[sourceId].name});
    if(newKey!==oldKey) delete by[oldKey]; changed=true;
  });
  if(changed) saveStore();
  return changed;
}

/* ===== 渲染 ===== */
var _statsTab = 'sent';
var _statsFilter = 'all';

/* ===== 示例统计：主动装入 / 本页撤销（2026-09-09）=====
   数据源 CL.demoStatsSample：只造 bySentence/totalAnswered 计数，
   不写 mastered/reinforceBook（练习队列与错题复习流零影响）。
   撤销快照仅存内存（本页刷新前可撤）；demo 句被真实练习触碰后不再撤销（已归真）。 */
var _demo = null; /* { keys:{k:{times,okTimes,wrongTimes}}, answered } */

function installDemoStats(){
  var d = CL.demoStatsSample(allDecks());
  if(!d){ alert('题库可练句太少，直接去练几题就能看到统计'); return; }
  if(!mem.stats) mem.stats = { totalRounds:0, totalAnswered:0, bySentence:{}, events:[] };
  var by = mem.stats.bySentence || (mem.stats.bySentence = {});
  var keys = {}, added = 0;
  Object.keys(d.bySentence).forEach(function(k){
    if(by[k]) return; /* 防御：真实已练过的句子不覆盖 */
    by[k] = d.bySentence[k];
    keys[k] = { times: by[k].times, okTimes: by[k].okTimes, wrongTimes: by[k].wrongTimes };
    added += by[k].times;
  });
  if(!added){ alert('示例句都已练过，直接开始你的真实记录吧'); return; }
  mem.stats.totalAnswered = (mem.stats.totalAnswered || 0) + added;
  _demo = { keys: keys, answered: added };
  saveStore(); /* 知情并入：示例统计随本机档案上云（含撤销后回推覆盖） */
  renderStats();
}
function undoDemoStats(){
  if(!_demo) return;
  var by = mem.stats.bySentence || {}, removed = 0, alive = 0;
  Object.keys(_demo.keys).forEach(function(k){
    var cur = by[k], snap = _demo.keys[k];
    if(cur && cur.times === snap.times && cur.okTimes === snap.okTimes && cur.wrongTimes === snap.wrongTimes){
      delete by[k]; removed += snap.times;   /* 未被真实练习触碰 → 撤掉 */
    } else { alive++; }                       /* 已被真实练习 → 归真，保留 */
  });
  mem.stats.totalAnswered = Math.max(0, (mem.stats.totalAnswered || 0) - removed);
  _demo = null;
  saveStore();
  renderStats();
  if(alive) alert(alive + ' 个示例句已有真实练习记录，已保留（其余示例已撤销）');
}

function renderStats(){
  if(!mem.stats) mem.stats = { totalRounds:0, totalAnswered:0, bySentence:{}, events:[] };
  var by = mem.stats.bySentence || {};
  /* ★ 关键：keys 也要按 deletedItems 过滤，否则 deleted 句的 stats 仍计入 KPI/圆环 4 档，
     跟 sentence list（已过滤）数据源不同，造成 KPI 说 8 master / 圆环多 1 段 / list 只 7 master */
  var keys = Object.keys(by).filter(function(k){
    var sep = k.indexOf('#');
    var dId = sep > 0 ? k.substring(0, sep) : '';
    var cid = sep > 0 ? k.substring(sep + 1) : '';
    return !CL.isItemDeleted(mem, dId, { cid: cid });
  });

  /* 统计卡：桌面保留 5 项，移动端隐藏完成轮次以压缩为 4 项 */
  var masteredCnt = keys.filter(function(k){ return classifyStat(by[k])==='master'; }).length;
  var weakCnt = keys.filter(function(k){ return classifyStat(by[k])==='weak'; }).length;
  var bookCnt = getReinforceBook().length;
  var isEmpty = keys.length === 0 && !(mem.stats.totalAnswered);
  /* 0 态正向表达（2026-09-09）：需巩固/错题本为 0 是「状态良好」不是缺口；
     完成轮次口径用 title 说明（练完一轮计 1 次）。 */
  var cardsHtml =
    '<div class="kpi-row">'+
    '<div class="stat-card hl"><div class="k">累计练习句次</div><div class="v">'+mem.stats.totalAnswered+'</div></div>'+
    '<div class="stat-card kpi-rounds" title="每连续练完一轮（一批句）计 1 次"><div class="k">完成轮次</div><div class="v">'+mem.stats.totalRounds+'</div></div>'+
    '<div class="stat-card ok"><div class="k">熟练句子</div><div class="v">'+masteredCnt+'</div></div>'+
    '<div class="stat-card '+(weakCnt>0?'warn':'ok')+'" title="'+(weakCnt>0?'需要复习巩固的句子':'没有待巩固句子，状态良好')+'"><div class="k">需巩固</div><div class="v">'+weakCnt+'</div>'+
      (weakCnt>0 ? '<button class="start-btn" id="startWeak">开始学习 '+(window.Icons?Icons.svg('arrowR'):'')+'</button>' : '')+'</div>'+
    '<div class="stat-card '+(bookCnt>0?'':'ok')+'" title="'+(bookCnt>0?'练习中答错的句子':'错题本是空的，状态良好')+'"><div class="k">错题本</div><div class="v">'+bookCnt+'</div>'+
      (bookCnt>0 ? '<button class="start-btn" id="startBook">开始学习 '+(window.Icons?Icons.svg('arrowR'):'')+'</button>' : '')+'</div>'+
    '</div>';
  /* 空态引导：新档案先展示「可长成的形态」，示例只造计数、主动装入、本页可撤销 */
  var heroHtml = '';
  if(isEmpty){
    heroHtml =
    '<div class="stat-hero" id="statHero">'+
      '<div class="stat-hero-txt">'+
        '<div class="stat-hero-t">档案还空着——练几题，这里会长出你的掌握分布</div>'+
        '<div class="stat-hero-d">想先看看完整档案长什么样？可以装入一份示例统计（只生成练习次数，不会伪造已掌握/错题，练习队列不受影响；装入后本页可撤销）。</div>'+
      '</div>'+
      '<div class="stat-hero-actions">'+
        '<button class="btn sm primary" id="btnDemoStats">'+(window.Icons?Icons.svg('sparkle'):'')+' 装入示例统计</button>'+
        '<button class="btn sm ghost" onclick="window.location.href=\'./main.html\'">去练几题</button>'+
      '</div>'+
    '</div>';
  }
  var undoHtml = '';
  if(_demo){
    undoHtml =
    '<div class="undo-bar">'+
      '<span>当前档案含示例统计（'+_demo.answered+' 次演示练习）</span>'+
      '<span class="grow"></span>'+
      '<button class="btn sm ghost" id="btnUndoDemo">撤销示例</button>'+
    '</div>';
  }
  $('statsCards').innerHTML = undoHtml + heroHtml + cardsHtml;

  /* 指标对比柱状图（累计练习 + 错题本） */
  var bars = [
    { label:'累计练习', count:mem.stats.totalAnswered, color:'#2c62c9' },
    { label:'错题本',    count:bookCnt,                  color:'#9ca3af' }
  ];
  var barsMax = Math.max.apply(null, bars.map(function(b){ return b.count; })) || 1;
  var barHtml = bars.map(function(b){
    var w = b.count / barsMax * 100;
    var cntText = String(b.count);
    var isZero = b.count === 0;
    return '<div class="bar-row">'+
      '<span class="bar-lbl">'+b.label+'</span>'+
      '<div class="bar-track">'+
        '<div class="bar-fill" style="width:'+w.toFixed(1)+'%;background:'+b.color+(isZero?';opacity:.18':'')+'"></div>'+
      '</div>'+
      '<span class="bar-cnt" style="color:'+(isZero?'var(--faint)':b.color)+'">'+cntText+'</span>'+
    '</div>';
  }).join('');
  /* 熟练度分布 */
  var seg = {master:0, learn:0, weak:0, unseen:0};
  var allDecksArr = allDecks();
  var totalInDecks = 0;
  allDecksArr.forEach(function(d){ totalInDecks += (d.items||[]).length; });
  keys.forEach(function(k){ seg[classifyStat(by[k])]++; });
  seg.unseen = Math.max(0, totalInDecks - keys.length);
  /* SVG 圆环图（自绘 · 零依赖）—— 4 段：熟练/学习中/需巩固/未练过
     中心显示「已学过」= 总句数 - 未练过（已接触过的句子数）
     「标熟」作为独立附加行（避免与"已掌握"重叠） */
  var total = seg.master + seg.learn + seg.weak + seg.unseen;
  var totalShown = total || 1;
  var studied = total - seg.unseen;
  var segs = [
    {key:'master', count:seg.master, color:'#23855a', label:'熟练'},
    {key:'learn',  count:seg.learn,  color:'#2c62c9', label:'学习中'},
    {key:'weak',   count:seg.weak,   color:'#a16207', label:'需巩固'},
    {key:'unseen', count:seg.unseen, color:'#9a958c', label:'未练过'}
  ];
  var C = 2 * Math.PI * 42;
  var off = 0;
  var donut = '<svg viewBox="0 0 100 100" class="donut" role="img" aria-label="熟练度分布">'+
    '<circle r="42" cx="50" cy="50" fill="none" stroke="var(--surface-2)" stroke-width="14"/>';
  segs.forEach(function(s){
    var len = s.count / totalShown * C;
    if(len > 0.5){
      donut += '<circle r="42" cx="50" cy="50" fill="none" stroke="'+s.color+'" stroke-width="14" '+
        'stroke-dasharray="'+len.toFixed(2)+' '+(C-len).toFixed(2)+'" stroke-dashoffset="-'+off.toFixed(2)+'" transform="rotate(-90 50 50)"/>';
    }
    off += len;
  });
  /* 中心：已学过句数 + 总句数 + 累计练习次数（消除"55 vs 16"困惑） */
  var practiced = mem.stats && mem.stats.totalAnswered ? mem.stats.totalAnswered : 0;
  /* ★ 根因（2026-09-08 老板反馈）：原 4 行小字（"已学句数"/"/ 279 句"/"练过 X 次"）字号 6-6.5px，
     圆环内根本看不清。删小字冗余行 + 弹 hover popover 显示完整数据：
     - 圆环内只留核心大字"60" + 总句数"/ 279"两行（已学 + 总）
     - 详细分布 / 练习次数 / 标熟数全部 hover 出来 */
  donut += '<text x="50" y="44" text-anchor="middle" font-size="18" font-weight="800" fill="var(--text)">'+studied+'</text>'+
    '<text x="50" y="58" text-anchor="middle" font-size="6" fill="var(--faint)">已学句数</text>'+
    '<text x="50" y="68" text-anchor="middle" font-size="7" fill="var(--faint)">/ '+total+' 句</text></svg>';
  var legend = '<div class="donut-legend">'+
    segs.map(function(s){
      var pct = total ? Math.round(s.count / total * 100) : 0;
      return '<div class="donut-row">'+
        '<span class="dot" style="background:'+s.color+'"></span>'+
        '<span class="lbl">'+s.label+'</span>'+
        '<span class="cnt">'+s.count+'</span>'+
        '<span class="pct">'+pct+'%</span>'+
      '</div>';
    }).join('')+
    /* 标熟作为独立附加行（⊇ 已掌握，单独显示避免重叠） */
    '<div class="donut-row extra" title="用户自选/自动标记的标熟（含已掌握）">'+
      '<span class="dot" style="background:#12924f"></span>'+
      '<span class="lbl">标熟</span>'+
      '<span class="cnt">'+Object.keys(mem.mastered||{}).length+'</span>'+
      '<span class="pct">—</span>'+
    '</div>'+
  '</div>';
  /* ★ 指标对比 + 熟练度分布 并排一行
     ★ 根因：insertAdjacentHTML 的 fragment 解析器会自动闭合未关闭标签，
       若分两次插入（先开 pair-row 再关），第一次插入时 pair-row 已被自动闭合，
       导致第二张卡变成 pair-row 的兄弟节点（独占整行）→ 一直上下堆叠。
       → 修复：两张卡在【同一个 insertAdjacentHTML 调用】里一次性插入。 */
  var pairHtml =
     '<div class="pair-row">'+
      '<div class="stat-card dist-card" style="flex:1;min-width:0"><div class="k">指标对比</div>'+
        '<div class="v bar-chart">'+barHtml+'</div></div>'+
      '<div class="stat-card dist-card" style="flex:1;min-width:0"><div class="k">熟练度分布</div>'+
        '<div class="v mastery-donut">'+
          '<div class="donut-wrap" id="donutWrap" role="button" tabindex="0" aria-label="熟练度分布详情" aria-describedby="donutPop">'+
            donut+
          '</div>'+
          legend+
        '</div></div>'+
    '</div>';
  $('statsCards').insertAdjacentHTML('beforeend', pairHtml);

  /* 熟练度圆环 popover 数据快照（每次 renderStats 重渲染时刷新）
     用 module 级变量而非 dataset：popover portal 化后跨 DOM 引用，dataset 会随 DOM 重建丢失 */
  window._masteryPopData = {
    studied: studied,
    total: total,
    practiced: practiced,
    masteredCount: Object.keys(mem.mastered||{}).length,
    segs: segs.map(function(s){ return { key:s.key, color:s.color, label:s.label, count:s.count }; })
  };
  bindMasteryPop();

  /* Tab 状态 */
  Array.prototype.forEach.call($('statsTabs').children, function(b){
    b.classList.toggle('on', b.dataset.tab === _statsTab);
  });
  $('statsFilter').style.display = (_statsTab === 'sent') ? 'flex' : 'none';
  Array.prototype.forEach.call($('statsFilter').children, function(b){
    b.classList.toggle('on', b.dataset.f === _statsFilter);
  });

  var body = $('statsBody');
  if(_statsTab === 'wrong'){
    renderWrongBook(body);
  } else if(_statsTab === 'review'){
    renderReviewList(body);
  } else {
    renderSentenceList(body);
  }

  var sw = $('startWeak'); if(sw) sw.onclick = practiceWeakSentences;
  var sb = $('startBook'); if(sb) sb.onclick = practiceWrongBook;
  var db = $('btnDemoStats'); if(db) db.onclick = installDemoStats;
  var ud = $('btnUndoDemo'); if(ud) ud.onclick = undoDemoStats;
}

/* ===== 熟练度圆环 popover（2026-09-08）=====
   沿用 main.html 圆环 popover 设计：portal + position:fixed + viewport 坐标 + hover(桌面)/click(移动)。
   数据快照：每次 renderStats 重渲染时刷新到 window._masteryPopData。
   popover DOM 复用：第一次绑定时创建并 portal 到 body，后续只更新内容（避免每次重渲染重建）。 */
function buildMasteryPopRows(){
  var d = window._masteryPopData || {};
  /* ★ 2026-09-09 老板反馈：静态区（圆环中心 + 图例）已展示已学句数/4 档分布/标熟，
     hover 不再复述，只补静态区没有的「练过次数」 */
  return '<div class="donut-pop-row"><span class="lbl">练过次数</span><span class="val">'+ (d.practiced||0) +' 次</span></div>';
}

function updateMasteryPop(){
  var pop = $('donutPop');
  if(!pop) return;
  var d = window._masteryPopData || {};
  var head = (d.studied === d.total && d.total > 0) ? '<div class="donut-pop-title"><span class="badge">已全部学完</span></div>' : '';
  pop.innerHTML = head + buildMasteryPopRows();
}

function showMasteryPop(){
  var pop = $('donutPop');
  var wrap = $('donutWrap');
  if(!pop || !wrap) return;
  updateMasteryPop();
  var r = wrap.getBoundingClientRect();
  var isMobile = window.innerWidth <= 640;
  if(isMobile){
    /* 圆环下方居中，clamp 防溢出 */
    var centerX = r.left + r.width / 2;
    var half = pop.offsetWidth / 2;
    var minX = half + 8;
    var maxX = window.innerWidth - half - 8;
    pop.style.left = Math.max(minX, Math.min(centerX, maxX)) + 'px';
    pop.style.top = (r.bottom + 8) + 'px';
    pop.style.transform = 'translateX(-50%)';
  } else {
    /* 桌面：圆环右下方（右侧空间足够） */
    pop.style.left = (r.right + 10) + 'px';
    pop.style.top = (r.bottom + 8) + 'px';
    pop.style.transform = 'none';
  }
  pop.classList.add('open');
  pop.setAttribute('aria-hidden', 'false');
  wrap.classList.add('pop-open');
}

function hideMasteryPop(){
  var pop = $('donutPop');
  if(pop){
    pop.classList.remove('open');
    pop.setAttribute('aria-hidden', 'true');
  }
  var wrap = $('donutWrap');
  if(wrap) wrap.classList.remove('pop-open');
}

function toggleMasteryPop(){
  var pop = $('donutPop');
  if(!pop) return;
  if(pop.classList.contains('open')) hideMasteryPop();
  else showMasteryPop();
}

/* 绑一次：每次 renderStats 重建卡片时，donutWrap 是新的 DOM 节点，
   popover 是 body 末端常驻 → 只重绑事件不重建 popover */
function bindMasteryPop(){
  var wrap = $('donutWrap');
  if(!wrap) return;
  var pop = $('donutPop');
  /* 第一次：创建 popover DOM 并 portal 到 body */
  if(!pop){
    pop = document.createElement('div');
    pop.id = 'donutPop';
    pop.className = 'donut-pop';
    pop.setAttribute('role', 'tooltip');
    pop.setAttribute('aria-hidden', 'true');
    pop.innerHTML = '';
    document.body.appendChild(pop);
  }
  if(wrap._popBound) return;
  wrap._popBound = true;
  /* hover 系列只在支持 hover 的设备上绑（移动 tap 会合成 hover+click 双事件链） */
  var canHover = !window.matchMedia || window.matchMedia('(hover: hover)').matches;
  if(canHover){
    wrap.addEventListener('mouseenter', showMasteryPop);
    wrap.addEventListener('mouseleave', hideMasteryPop);
    wrap.addEventListener('focus', showMasteryPop);
    wrap.addEventListener('blur', function(){
      setTimeout(function(){
        if(document.activeElement !== wrap) hideMasteryPop();
      }, 150);
    });
  }
  /* 通用：click/tap 切换 */
  wrap.addEventListener('click', function(e){
    e.stopPropagation();
    toggleMasteryPop();
  });
  wrap.addEventListener('keydown', function(e){
    if(e.key === 'Enter' || e.key === ' '){
      e.preventDefault();
      toggleMasteryPop();
    }
  });
  /* Esc 全局关闭 */
  if(!wrap._escBound){
    wrap._escBound = true;
    document.addEventListener('keydown', function(e){
      if(e.key === 'Escape') hideMasteryPop();
    });
  }
  /* 点圆环/popover 外任何地方关闭 */
  if(!wrap._docBound){
    wrap._docBound = true;
    document.addEventListener('click', function(e){
      if(!wrap.contains(e.target) && !(pop && pop.contains(e.target))) hideMasteryPop();
    }, true);
  }
  /* 滚动/resize 关闭（fixed 钉 viewport，wrap 移走会漂错位） */
  if(!wrap._scrollBound){
    wrap._scrollBound = true;
    window.addEventListener('scroll', hideMasteryPop, true);
    window.addEventListener('resize', hideMasteryPop);
  }
}

function renderSentenceList(body){
  var by = mem.stats.bySentence || {};
  var rows = [];

  /* ★ 关键修复（v2）：rows 从「bySentence + mastered」改为「allDecks() 全集」（已过滤 deletedItems）。
     旧版只有"已练过 + 标熟"两类，导致：
       1. 「未练过」tab 永远为空——classifyStat 返回 'unseen' 的条件是 times===0，但 rows 压根没装这些条目
       2. 「全部」tab 也只显示已练过的，不符合字面意思
     圆环大字"60 / 339 句" 用的是 seg.unseen = totalInDecks - keys.length（基于 allDecks() 全集），
     跟 sentence list 不同源 → 用户看到圆环说"未练过 279"但 tab 空白，体感像 bug。 */
  var decks = allDecks();
  var seen = {};
  decks.forEach(function(d){
    var dId = d.id;
    (d.items || []).forEach(function(it){
      if(CL.isItemDeleted(mem, dId, it)) return;
      var cid = it.cid || CL.fnv8(it.sentence || '');
      var key = dId + '#' + cid;
      if(seen[key]) return;          /* deck 内同 cid 重复句去重 */
      seen[key] = true;
      var st = by[key];
      if(st && st.times){
        /* 已练过：用 stats 数据（spread 防 mutate）+ 叠加 item 的 translation */
        rows.push(Object.assign({}, st, { translation: it.translation || '' }));
      } else {
        /* 未练过：构造伪 stat，classifyStat 会返回 'unseen' */
        rows.push({
          deckId: dId,
          sentence: it.sentence || '',
          translation: it.translation || '',
          times: 0, okTimes: 0, wrongTimes: 0, streak: 0, maxStreak: 0,
          lastAt: 0, interval: 1, ease: 2.5, dueAt: 0,
          _masteredOnly: !!(mem.mastered && mem.mastered[key])
        });
      }
    });
  });

  /* mem.mastered 中"只标熟未练过"的句子（item 已不在 decks）：仍要显示在「已熟」tab
     ★ 但 deletedItems 标删的 item 不能从 mastered 复活（用户已经删除） */
  if(mem.mastered){
    Object.keys(mem.mastered).forEach(function(key){
      if(seen[key]) return;
      var m = mem.mastered[key];
      var sep = key.indexOf('#');
      var dId = sep > 0 ? key.substring(0, sep) : '';
      var cid = sep > 0 ? key.substring(sep + 1) : '';
      if(CL.isItemDeleted(mem, dId, { cid: cid })) return;  /* 已被删 → 跳过 */
      seen[key] = true;
      rows.push({
        deckId: dId, sentence: m.sentence || '', translation: '',
        times: 0, okTimes: 0, wrongTimes: 0, streak: 0, maxStreak: 0,
        lastAt: m.markedAt || 0, interval: 1, ease: 2.5, dueAt: 0,
        _masteredOnly: true
      });
    });
  }

  /* 给每个 row 算 _practiceState（master/learn/weak/unseen），filter 统一判断 */
  rows.forEach(function(r){ r._practiceState = classifyStat(r); });

  /* 排序：先按状态优先级（master > learn > weak > unseen），再按 lastAt desc；
     unseen 桶内按 deckId + sentence 字典序（首次接触顺序无意义，给个稳定排序即可） */
  var stateOrder = { master: 0, learn: 1, weak: 2, unseen: 3 };
  rows.sort(function(a, b){
    var sa = stateOrder[a._practiceState]; if(sa === undefined) sa = 99;
    var sb = stateOrder[b._practiceState]; if(sb === undefined) sb = 99;
    if(sa !== sb) return sa - sb;
    if(a._practiceState === 'unseen') return (a.deckId + '\u0001' + a.sentence).localeCompare(b.deckId + '\u0001' + b.sentence);
    return (b.lastAt || 0) - (a.lastAt || 0);
  });

  var out = rows.filter(function(s){
    /* 只标熟未练过的句子（_masteredOnly=true）只出现在「已熟」tab，不出现在其它 tab */
    if(_statsFilter === 'all') return true;
    if(_statsFilter === 'mastered'){
      return s._masteredOnly || s._practiceState === 'master';
    }
    if(s._masteredOnly) return false;
    return s._practiceState === _statsFilter;
  });
  if(!out.length){
    body.innerHTML = '<div class="empty-tip">'+
      (rows.length === 0 ? '题库里还没有任何句子，去练习页导入或启用内置题库吧' :
       _statsFilter==='all' ? '还没有练习记录，先去练几题吧' :
       '没有符合条件的句子')+'</div>';
    return;
  }
  var html = '<div class="stats-list">';
  out.forEach(function(s, idx){
    var badgeHtml =
      s._masteredOnly ? '<span class="badge master">已标记</span>' :
      s._practiceState==='master' ? '<span class="badge master">熟练</span>' :
      s._practiceState==='weak'   ? '<span class="badge weak">需巩固</span>' :
      s._practiceState==='learn'  ? '<span class="badge learn">学习中</span>' :
                                    '<span class="badge new">未练过</span>';
    var tStr = s.lastAt ? timeAgo(s.lastAt) : '—';
    html += '<div class="srow stats-detail-row"><span class="row-num">#'+(idx+1)+'</span><div class="sen">'+
      '<div class="en">'+esc(s.sentence)+'</div>'+
      '<div class="cn">'+esc(s.translation||'')+'</div></div>'+
      badgeHtml+
      '<button class="row-detail-toggle" type="button" aria-expanded="false" aria-label="展开统计详情"></button>'+
      '<div class="meta">'+s.times+' 次 · 对 '+s.okTimes+'/错 '+s.wrongTimes+' · '+tStr+'</div>'+
    '</div>';
  });
  html += '</div>';
  body.innerHTML = html;
}

function renderWrongBook(body){
  var book = getReinforceBook();
  if(!book.length){
    body.innerHTML = '<div class="empty-tip">错题本是空的。练习时答错的句子会自动加入这里，跨会话保留。</div>';
    return;
  }
  var html = '<div style="display:flex;justify-content:flex-end;margin-bottom:8px">'+
    '<button class="btn sm ghost" id="btnClearWrongBook" style="color:var(--bad)">'+(window.Icons?Icons.svg('trash'):'')+' 清空错题本</button></div>';
  html += '<div class="stats-list">';
  book.slice().reverse().forEach(function(b){
    var mine = '';
    if(b.mistakes && b.mistakes.length){
      mine = b.mistakes.map(function(m){
        return esc(m.userAnswer||'（空）')+' → <b>'+esc(m.chunk)+'</b>';
      }).join('<br>');
    }
    html += '<div class="wrong-row"><div class="sen">'+
      '<div class="en">'+esc(b.sentence)+'</div>'+
      '<div class="cn">'+esc(b.translation||'')+'</div>'+
      '<div class="wrong-detail">错点：'+mine+'</div>'+
    '</div>'+
    '<button class="wrong-del" data-key="'+esc(b._key||'')+'" title="从错题本删除">'+(window.Icons?Icons.svg('close'):'')+'</button></div>';
  });
  html += '</div>';
  body.innerHTML = html;
  var bc = $('btnClearWrongBook'); if(bc) bc.onclick = function(){ if(confirm('清空错题本？')){ mem.reinforceBook = []; saveStore(); renderStats(); } };
  Array.prototype.forEach.call(body.querySelectorAll('.wrong-del'), function(btn){
    btn.onclick = function(){
      var key = btn.getAttribute('data-key');
      mem.reinforceBook = (mem.reinforceBook || []).filter(function(x){ return x._key !== key; });
      saveStore(); renderStats();
    };
  });
}

function getReinforceBook(){
  if(!mem.reinforceBook) mem.reinforceBook = [];
  return mem.reinforceBook;
}

/* ===== SRS 复习 ===== */
function dueSentences(){
  if(!mem.stats || !mem.stats.bySentence) return [];
  var out = [];
  var seen = {};
  Object.keys(mem.stats.bySentence).forEach(function(k){
    var st = mem.stats.bySentence[k];
    if(typeof st.dueAt !== 'number' || !st.dueAt || st.dueAt > Date.now()) return;
    var deck = findDeck(st.deckId);
    if(!deck) return;
    var it = (deck.items || []).find(function(x){ return x.sentence === st.sentence; });
    if(!it) return;
    var key = st.deckId + '#' + normSent(it.sentence);
    if(seen[key]) return;
    seen[key] = true;
    out.push({ it:withStatsSource(it, st.deckId), st:st, deck:deck });
  });
  return out;
}
function renderReviewList(body){
  var dues = dueSentences();
  var html = '<div class="review-head">'+
    '<b style="font-size:13px;color:var(--warn)">'+(window.Icons?Icons.svg('refresh'):'')+' SRS 到期复习</b> '+
    '<span class="review-count">'+(dues.length>0?'<b style="color:var(--warn)">'+dues.length+' 句</b>':'0 句')+'</span>'+ 
    '<span class="spacer"></span>'+ 
    (dues.length>0 ? '<button class="btn primary" id="startDueReview">开始复习</button>' : '')+
    '</div>';
  if(dues.length){
    html += '<div class="stats-list">';
    dues.forEach(function(d){
      html += '<div class="srow"><div class="sen">'+
        '<div class="en">'+esc(d.it.sentence)+'</div>'+
        '<div class="cn">'+esc(d.it.translation||'')+'</div></div>'+
        '<div class="meta" style="color:var(--warn)">'+(window.Icons?Icons.svg('refresh'):'')+' 已逾期 '+(d.st.dueAt ? Math.max(0, Math.round((Date.now()-d.st.dueAt)/86400000)) : 0)+' 天 · '+esc(displayDeckName(d.deck.name))+'</div></div>';
    });
    html += '</div>';
  } else {
    html += '<div class="empty-tip" style="padding:14px">没有到期复习的句子。新学的句子会按间隔重复（1→3→7→14→30 天）自动排入复习队列。</div>';
  }

  html += '<div style="margin-top:18px;padding-top:14px;border-top:1px solid var(--border)">'+
    '<div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">'+
    '<b style="font-size:13px;color:var(--muted)">'+(window.Icons?Icons.svg('book'):'')+' 手动复习入口</b> '+
    '<span style="font-size:12px;color:var(--faint)">（按题库分组，已标熟/已掌握的句子；立即重测一遍）</span>'+
    '</div>';
  var decksWithMarked = [];
  allDecks().forEach(function(d){
    var items = (d.items||[]).filter(function(it){
      return isMarkedForDeck(d.id, it) || isFluencyByDeck(d.id, it);
    });
    if(items.length) decksWithMarked.push({deck:d, items:items});
  });
  if(!decksWithMarked.length){
    html += '<div class="empty-tip" style="padding:14px">还没有标熟/掌握的句子。当句子被标熟或考试通过后，可在此手动复习。</div>';
  } else {
    html += '<div class="stats-list">';
    decksWithMarked.forEach(function(entry){
      var d = entry.deck;
      html += '<div class="review-row">'+
        '<div class="nm">'+esc(displayDeckName(d.name))+' <span style="font-size:12px;color:var(--faint);font-weight:400">'+entry.items.length+' 句</span></div>'+ 
        '<button class="btn sm" data-rev-deck="'+esc(d.id)+'" style="color:#b45309;border-color:#fcd34d">'+(window.Icons?Icons.svg('book'):'')+' 复习 '+entry.items.length+' 句</button>'+
        '</div>';
    });
    html += '</div>';
  }
  html += '</div>';

  body.innerHTML = html;
  var sd = $('startDueReview'); if(sd) sd.onclick = practiceDue;
  Array.prototype.forEach.call(body.querySelectorAll('[data-rev-deck]'), function(btn){
    btn.onclick = function(){
      var deckId = btn.getAttribute('data-rev-deck');
      var deck = findDeck(deckId);
      if(deck) practiceReviewDeck(deck);
    };
  });
}

function practiceDue(){
  var dues = dueSentences();
  if(!dues.length){ alert('没有到期复习的句子'); return; }
  var items = dues.map(function(d){ return withStatsSource(d.it, d.st.deckId); });
  launchReviewDeck({ id:'srs-'+Date.now().toString(36), name:'到期复习', items:items });
}
function practiceReviewDeck(deck){
  var items = (deck.items || []).filter(function(it){
    return isMarkedForDeck(deck.id, it) || isFluencyByDeck(deck.id, it);
  }).map(function(it){ return withStatsSource(it, deck.id); });
  if(!items.length){ alert('该题库没有已标熟/已掌握的句子'); return; }
  launchReviewDeck({ id:'rev-'+deck.id+'-'+Date.now().toString(36), name:'复习 · '+displayDeckName(deck.name)+' · '+items.length+' 句', items:items });
}
function practiceWeakSentences(){
  var by = mem.stats.bySentence || {};
  var items = [];
  var seen = {};
  Object.keys(by).forEach(function(k){
    if(classifyStat(by[k]) !== 'weak') return;
    var st = by[k];
    var deck = findDeck(st.deckId);
    if(!deck) return;
    var it = (deck.items || []).find(function(x){ return x.sentence === st.sentence; });
    if(!it) return;
    var key = st.deckId + '#' + normSent(it.sentence);
    if(seen[key]) return;
    seen[key] = true;
    items.push(withStatsSource(it, st.deckId));
  });
  if(!items.length){ alert('找不到可练习的句子（可能被删除）'); return; }
  launchReviewDeck({ id:'weak-'+Date.now().toString(36), name:'需巩固 · '+items.length+' 句', items:items });
}
function practiceWrongBook(){
  var book = getReinforceBook();
  var seen = {};
  var items = [];
  book.forEach(function(b){
    var key = b.deckId + '#' + normSent(b.sentence);
    if(seen[key]) return;
    seen[key] = true;
    var deck = findDeck(b.deckId);
    if(!deck) return;
    var it = (deck.items||[]).find(function(x){ return x.sentence === b.sentence; });
    if(it) items.push(withStatsSource(it, b.deckId));
  });
  if(!items.length){ alert('错题本中的句子已全部删除或找不到对应题库'); return; }
  launchReviewDeck({ id:'book-'+Date.now().toString(36), name:'错题 · '+items.length+' 句', items:items });
}

/* ★ 跨页面通信：通过 postMessage 通知主页启动临时题库（统一走 CL） */
function launchReviewDeck(deck){
  try{
    localStorage.setItem('chunklab_pending_review_deck', JSON.stringify({ deck:deck, ts:Date.now() }));
  }catch(e){ console.error(e); }
  /* 同 tab 导航回主页：autostart=1 + pendingReviewDeck 自动启动复习队列 */
  window.location.href = './main.html?autostart=1';
}

/* ===== 事件绑定 ===== */
CL.ensureCloud().then(function(){
loadMem();
migrateLegacyStatKeys();
renderStats();

Array.prototype.forEach.call($('statsTabs').children, function(b){
  b.onclick = function(){
    _statsTab = b.dataset.tab;
    renderStats();
  };
});
Array.prototype.forEach.call($('statsFilter').children, function(b){
  b.onclick = function(){
    _statsFilter = b.dataset.f;
    renderStats();
  };
});
$('btnPracticeWrong').onclick = practiceWrongBook;
/* 移动端记录采用渐进式展示：点击整行展开/收起次数、对错和最近练习时间。
   桌面端详情始终可见，因此不改变原有交互。 */
function toggleSentenceDetail(row){
  var expanded = row.classList.toggle('is-expanded');
  var toggle = row.querySelector('.row-detail-toggle');
  if(toggle){
    toggle.setAttribute('aria-expanded', expanded ? 'true' : 'false');
    toggle.setAttribute('aria-label', expanded ? '收起统计详情' : '展开统计详情');
  }
}
$('statsBody').addEventListener('click', function(ev){
  if(!window.matchMedia || !window.matchMedia('(max-width:600px)').matches) return;
  var row = ev.target.closest && ev.target.closest('.stats-detail-row');
  if(row) toggleSentenceDetail(row);
});
/* ★ 返回主页（独立窗口场景通用） */
$('statsBack').onclick = function(){ window.location.href = './main.html'; };

/* 接收主页面消息：刷新数据 */
window.addEventListener('message', function(ev){
  if(ev.data && ev.data.type === 'memUpdated'){
    loadMem();
    renderStats();
  }
});

/* 监听 storage 事件（其他标签页修改也刷新） */
window.addEventListener('storage', function(e){
  if(e.key === 'chunklab.v1'){
    loadMem();
    renderStats();
  }
});
}); /* CL.ensureCloud().then */
