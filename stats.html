<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="icon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<title>学习档案 · Chunk Lab</title>
<style>
:root{--bg:#f4f2ee;--surface:#fffdfa;--surface-2:#f9f7f3;--border:#dedbd4;--border-strong:#c8c2b8;--text:#202326;--muted:#74716a;--faint:#9a958c;--accent:#2c62c9;--accent-soft:#e8efff;--ok:#23855a;--ok-soft:#e8f5ee;--bad:#b6483e;--bad-soft:#f7eae8;--warn:#a16207;--warn-soft:#f3e8c9;--shadow:0 1px 2px rgba(46,43,37,.06),0 6px 24px -12px rgba(46,43,37,.18)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent} /* 触摸高亮关默认（方角色块），按压反馈统一由 :active 提供 */
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font:13.5px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
.wrap{max-width:880px;margin:0 auto;padding:14px 18px 32px;min-width:0}
.page-head{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.page-head h2{margin:0;font-size:18px;font-weight:700}
.spacer{flex:1}
.btn{border:1px solid var(--border-strong);background:var(--surface);border-radius:8px;padding:5px 12px;font-size:13px;color:var(--text);cursor:pointer;transition:background .15s}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.primary:hover{background:#1e4fa3}
.btn.sm{padding:3px 10px;font-size:12.5px}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.hidden{display:none !important}

.stats-cards{display:block;margin-bottom:14px}

.stats-tabs{display:flex;gap:6px;margin-bottom:10px}
.stats-tabs .tab{border:1px solid var(--border);background:var(--surface);border-radius:8px;padding:5px 14px;font-size:13px;color:var(--text);cursor:pointer}
.stats-tabs .tab.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}
.stats-filter{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.stats-filter .f{border:1px solid var(--border);background:var(--surface);border-radius:6px;padding:2px 10px;font-size:12px;color:var(--muted);cursor:pointer}
.stats-filter .f.on{border-color:var(--accent);background:var(--accent);color:#fff}

.stats-list{display:flex;flex-direction:column;gap:6px}
.srow{display:flex;align-items:center;gap:10px;padding:8px 12px;border:1px solid var(--border);border-radius:10px;background:var(--surface)}
.srow .row-num{align-self:flex-start;flex-shrink:0;width:32px;margin-top:2px;font-size:12px;font-weight:700;color:var(--accent);text-align:right;font-variant-numeric:tabular-nums}
.srow .sen{flex:1;min-width:0}
.srow .en{font-size:13.5px;font-weight:600;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srow .cn{font-size:11.5px;color:var(--faint);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srow .meta{flex-shrink:0;text-align:right;font-size:11.5px;color:var(--muted)}
.row-detail-toggle{display:none;flex-shrink:0;width:24px;height:24px;border:0;border-radius:50%;background:transparent;position:relative;cursor:pointer}
.row-detail-toggle::before{content:"";position:absolute;left:8px;top:7px;width:7px;height:7px;border-right:1.5px solid var(--muted);border-bottom:1.5px solid var(--muted);transform:rotate(45deg);transition:transform .15s ease}
.stats-detail-row.is-expanded .row-detail-toggle::before{transform:rotate(225deg);top:10px}
.badge{font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:999px;flex-shrink:0}
.badge.master{background:var(--ok-soft);color:var(--ok)}
.badge.weak{background:var(--bad-soft);color:var(--bad)}
.badge.new{background:#eef1f6;color:var(--muted)}
.badge.learn{background:var(--accent-soft);color:var(--accent)}

.wrong-head{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.wrong-head .count{font-size:12.5px;color:var(--bad)}
.wrong-head .spacer{flex:1}
.wrong-row{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-top:1px solid var(--border);background:transparent}
.wrong-row .sen{flex:1;min-width:0}
.wrong-row .en{font-size:13.5px;font-weight:600;line-height:1.3}
.wrong-row .cn{font-size:11.5px;color:var(--faint);margin-top:1px}
.wrong-row .wrong-detail{font-size:11.5px;margin-top:4px;color:var(--bad)}
.wrong-row .wrong-detail b{color:var(--ok);font-weight:600}
.wrong-del{flex-shrink:0;border:none;background:transparent;color:var(--faint);width:24px;height:24px;border-radius:50%;cursor:pointer;line-height:1;padding:0;display:grid;place-items:center}
.wrong-del .icon{width:14px;height:14px}
.wrong-del:hover{background:var(--bad-soft);color:var(--bad)}
/* 触摸按压反馈（2026-09-10）：tap-highlight 已全局关闭，按压态由 :active 提供 */
.btn:active{transform:translateY(1px)}
.wrong-del:active{background:var(--bad-soft);color:var(--bad)}
.stat-card .start-btn:active{opacity:.6}

.empty-tip{padding:26px;text-align:center;color:var(--faint);font-size:13px;border:1px dashed var(--border);border-radius:12px}

/* 练习临时题库按钮（在 stats 内可触发进入复习队列） */
.review-row{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--border);border-radius:10px;background:var(--surface)}
.review-row .nm{flex:1;font-size:13.5px;font-weight:600}

/* 跨页跳转消息 */
.cross-page-hint{font-size:12px;color:var(--faint);text-align:center;padding:8px 12px;background:var(--surface-2);border-radius:8px;margin-top:14px}
.review-head{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.review-head .review-count{font-size:12.5px;color:var(--warn)}
.review-head .spacer{flex:1}
/* 宪法 SVG icon 尺寸（main.html 已定义，stats.html 缺失导致 SVG 占满父容器） */
.icon{width:1em;height:1em;vertical-align:-0.15em;display:inline-block;flex-shrink:0}
.icon-spin{animation:iconSpin 1.2s linear infinite}
@keyframes iconSpin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
/* 移动端：以扫描效率为优先，减少重复卡片留白但保留完整数据 */
@media (max-width:600px){
  html,body{font-size:13px}
  .wrap{padding:10px 8px 20px}
  .page-head{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:6px;margin-bottom:8px}
  .page-head .spacer{display:none}
  .page-head h2{font-size:17px;white-space:nowrap}
  .stats-cards{margin-bottom:8px}
  .stats-cards .kpi-row{grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin-bottom:6px}
  .stats-cards .kpi-rounds{display:none}
  .stat-card{padding:7px 9px;border-radius:10px}
  .stat-card .k{font-size:10.5px}
  .stat-card .v{font-size:20px;margin-top:1px}
  .stat-card .start-btn{margin-top:3px;font-size:11px}
  .stats-cards .pair-row{gap:6px}
  .stat-card.dist-card{padding:7px 8px}
  .bar-chart{gap:4px;margin-top:4px}
  .bar-row{gap:5px}
  .bar-lbl{width:42px;font-size:10px}
  .bar-track{height:12px}
  .bar-cnt{width:24px;font-size:11px}
  .mastery-donut{flex-direction:column;gap:4px;margin-top:1px}
  .mastery-donut .donut{width:62px;height:62px}
  .mastery-donut .donut-legend{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px 4px;width:100%}
  .mastery-donut .donut-row{gap:3px}
  .mastery-donut .donut-row.extra{grid-column:1 / -1;margin-top:2px;padding-top:3px}
  .mastery-donut .dot{width:6px;height:6px}
  .mastery-donut .lbl{width:auto;font-size:10px;white-space:nowrap}
  .mastery-donut .cnt{width:18px;font-size:11px}
  .mastery-donut .pct{width:25px;font-size:9px}
  .stats-tabs{gap:4px;margin-bottom:6px}
  .stats-tabs .tab{padding:4px 10px;font-size:12px}
  .stats-filter{gap:4px;margin-bottom:8px}
  .stats-filter .f{padding:2px 10px;font-size:11px}
  .stats-list{gap:4px}
  .srow{gap:6px;padding:6px;border-radius:9px}
  .srow .row-num{width:24px;font-size:11px}
  .srow .en{font-size:12px}
  .srow .cn{font-size:10.5px}
  .stats-detail-row{display:grid;grid-template-columns:24px minmax(0,1fr) auto 24px;grid-template-areas:"num sen badge toggle" "detail detail detail detail";column-gap:6px;row-gap:3px;align-items:center;cursor:pointer}
  .stats-detail-row .row-num{grid-area:num}
  .stats-detail-row .sen{grid-area:sen}
  .stats-detail-row .badge{grid-area:badge}
  .stats-detail-row .row-detail-toggle{grid-area:toggle}
  .stats-detail-row .meta{display:none;grid-area:detail;font-size:10px;width:auto;margin:0;padding-top:5px;border-top:1px solid var(--border);text-align:left}
  .stats-detail-row.is-expanded .meta{display:block}
  .stats-detail-row .row-detail-toggle{display:block}
  .cross-page-hint{display:none}
  .review-head{gap:6px}
  .review-head button{margin-left:auto}
}
/* 超窄屏：图表卡片改为上下排列，保证环形图图例与柱状图标签可读 */
@media (max-width:380px){
  .stats-cards .pair-row{flex-direction:column;gap:6px}
  .stat-card.dist-card{padding:8px 10px}
  .mastery-donut{flex-direction:row;align-items:center;gap:12px}
  .mastery-donut .donut{width:72px;height:72px}
  .mastery-donut .donut-legend{grid-template-columns:repeat(2,minmax(0,1fr));gap:3px 8px}
  .mastery-donut .donut-row{gap:5px}
  .mastery-donut .lbl{font-size:11px}
  .mastery-donut .cnt{font-size:12px}
  .mastery-donut .pct{font-size:10px}
  .srow .en,.srow .cn{white-space:normal;overflow:visible;text-overflow:clip;display:-webkit-box;-webkit-box-orient:vertical}
  .srow .en{-webkit-line-clamp:2}
  .srow .cn{-webkit-line-clamp:2}
}
/* Flat overview: numbers first, dated activity second, details in tabs. */
[hidden]{display:none!important}
.overview-primary,.overview-secondary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;padding:20px 0;border-bottom:1px solid var(--border)}
.overview-metric{display:flex;flex-direction:column;min-width:0}
.overview-metric span{color:var(--muted);font-size:12px}
.overview-metric strong{font-size:28px;font-variant-numeric:tabular-nums}
.overview-secondary{padding:14px 0}
.overview-secondary strong{font-size:19px}
.activity-section{padding:22px 0 12px}
.activity-section h3{font-size:14px;margin:0 0 16px}
.activity-week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:12px}
.activity-day{text-align:center;font-size:12px;color:var(--muted)}
.activity-day b{color:var(--text);font-variant-numeric:tabular-nums}
.activity-track{height:76px;display:flex;align-items:flex-end;max-width:32px;margin:6px auto;border-bottom:1px solid var(--border)}
.activity-track>div{width:100%;background:var(--accent);border-radius:3px 3px 0 0}
.overview-note{font-size:12px;color:var(--muted);margin:16px 0}
.stats-tabs{border-bottom:1px solid var(--border);gap:6px;margin:0 0 12px}
.stats-tabs .tab{border:0;border-radius:0;background:transparent;min-height:44px;padding:8px 12px}
.stats-tabs .tab.on{background:transparent;border-bottom:2px solid var(--accent)}
.stats-list{gap:0}
.srow,.review-row{border:0;border-bottom:1px solid var(--border);border-radius:0;background:transparent;padding:8px 0}
/* 桌面端以信息密度优先；移动端在下方媒体查询中恢复触控尺寸。 */
.btn,.stats-filter .f,.wrong-del,.row-detail-toggle{min-height:0}
.wrong-del,.row-detail-toggle{min-width:0}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media(max-width:600px){
  .wrap{padding:12px 14px 24px}
  .overview-primary,.overview-secondary{gap:10px}
  .overview-metric strong{font-size:24px}
  .overview-secondary strong{font-size:18px}
  .stats-tabs .tab{padding:8px;font-size:12px}
  .activity-week{gap:5px}
  .btn,.stats-filter .f,.wrong-del,.row-detail-toggle{min-height:44px}
  .wrong-del,.row-detail-toggle{min-width:44px}
  .srow,.review-row{padding:8px 0}
  .stats-detail-row{grid-template-columns:24px minmax(0,1fr) auto 44px}
}
</style>
</head>
<body>

<div class="wrap">
  <div class="page-head">
    <button class="btn sm ghost" id="statsBack" title="返回主页"><span data-icon="arrowL"></span>返回</button>
    <h2><span data-icon="stats"></span> 学习档案</h2>
  </div>

  <div class="stats-tabs" id="statsTabs">
    <button class="tab on" data-tab="overview">概览</button>
    <button class="tab" data-tab="sent">句子记录</button>
    <button class="tab" data-tab="review">复习</button>
    <button class="tab" data-tab="wrong">错题本</button>
  </div>

  <div class="stats-cards" id="statsCards"></div>
  <div class="stats-filter" id="statsFilter" style="display:flex">
    <button class="f on" data-f="all">全部</button>
    <button class="f" data-f="mastered">已熟</button>
    <button class="f" data-f="weak">需巩固</button>
    <button class="f" data-f="unseen">未练过</button>
  </div>

  <div class="stats-body" id="statsBody"></div>

</div>

<script src="js/account-storage.js"></script>
<script>var businessStorage=window.AccountStorage.storage;</script>
<script src="builtins.js"></script>
<script src="js/content-repository.js"></script>
<script src="js/idb.js"></script>
<script src="js/batch-sync.js"></script>
<script src="core.js"></script>
<script src="api.js"></script>
<script src="js/sync-resolution.js"></script>
<script src="auth-ui.js"></script>
<script src="js/legacy-restore.js"></script>
<script src="js/icons.js"></script>
<script>
/* 宪法：UI 禁用字符 icon —— 初始 data-icon 元素替换为内联 SVG（icons.js） */
if(window.Icons) Icons.install();
/* ===== 学习档案 独立页面（stats.html）=====
   - 共享 core.js（CL 命名空间）：存储/工具/领域判定/事件总线
   - 数据通过浏览器本地存储与主页共享（同源） */

var mem = { decks:[], best:{}, mastered:{}, stats:{ totalRounds:0, totalAnswered:0, bySentence:{}, events:[] }, settings:{} };
var _statsDecks = null; /* 内置题库使用轻量 index；完整详情只在开始练习时取 */
/* CL 桥接：页面内沿用局部函数名（实现收敛到 core.js，调用点零改动） */
function loadMem(){ mem = CL.loadMem(); _statsDecks = null; }
function saveStore(){ return CL.saveAndNotify(mem); }
function $(id){ return CL.$(id); }
function esc(s){ return CL.esc(s); }
function normSent(s){ return CL.normSent(s); }
function displayDeckName(name){
  var text = String(name || '').trim();
  var first = text.split(/\s*[·•]\s*/)[0].trim();
  return first || text;
}
function masteredKey(deckId, it){ return CL.masteredKey(deckId, it); }
function findDeck(deckId){
  var all = allDecks();
  for(var i=0;i<all.length;i++) if(all[i].id === deckId) return all[i];
  return null;
}
function allDecks(){
  /* 内置扩展题库优先使用 index；用户导入题库仍走 CL 的只读视图。 */
  return _statsDecks || CL.allDecksView(mem);
}
function timeAgo(t){ return CL.timeAgo(t); }
function classifyStat(s){ return CL.classifyStat(s); }
function isFluencyByDeck(deckId, it){ return CL.isFluencyByDeck(mem, deckId, it); }
function isMarkedForDeck(deckId, it){ return CL.isMarkedForDeck(mem, deckId, it); }
function withStatsSource(it, deckId){
  var copy = {};
  Object.keys(it || {}).forEach(function(k){ copy[k] = it[k]; });
  copy._statsDeckId = deckId || '';
  return copy;
}

/* 与主页一致：旧版本临时复习 ID 能唯一对应题库时自动并回稳定统计键。 */
function migrateLegacyStatKeys(){
  if(!mem.stats || !mem.stats.bySentence) return false;
  var decks = allDecks(), known = {};
  decks.forEach(function(d){ known[d.id] = d; });
  var changed = false, by = mem.stats.bySentence;
  function merge(a,b){
    var latest = (a.lastAt||0) >= (b.lastAt||0) ? a : b;
    var out = Object.assign({}, latest);
    out.times=(a.times||0)+(b.times||0); out.okTimes=(a.okTimes||0)+(b.okTimes||0);
    out.wrongTimes=(a.wrongTimes||0)+(b.wrongTimes||0); out.maxStreak=Math.max(a.maxStreak||0,b.maxStreak||0);
    return out;
  }
  Object.keys(by).forEach(function(oldKey){
    var st=by[oldKey]; if(!st || !st.deckId || known[st.deckId]) return;
    var sourceId='';
    if(st.deckId.indexOf('rev-')===0) decks.forEach(function(d){ if(!sourceId && st.deckId.indexOf('rev-'+d.id+'-')===0) sourceId=d.id; });
    if(!sourceId){
      var candidates=decks.filter(function(d){ return (d.items||[]).some(function(it){ return normSent(it.sentence||it.en||'')===normSent(st.sentence||''); }); });
      if(candidates.length===1) sourceId=candidates[0].id;
      if(candidates.length>1){ var named=candidates.filter(function(d){ return d.name===st.deckName; }); if(named.length===1) sourceId=named[0].id; }
    }
    if(!sourceId) return;
    var newKey=sourceId+'#'+CL.fnv8(st.sentence||'');
    by[newKey]=by[newKey]?merge(by[newKey],st):Object.assign(st,{deckId:sourceId,deckName:known[sourceId].name});
    if(newKey!==oldKey) delete by[oldKey]; changed=true;
  });
  if(changed) saveStore();
  return changed;
}

/* ===== 渲染 ===== */
var _statsTab = 'overview';
var _statsFilter = 'all';
var _wrongBookFilter = 'all';
var _listPages = {}, LIST_PAGE_SIZE = 50;
function listPage(rows, key){
  var page = Math.min(_listPages[key] || 0, Math.max(0, Math.ceil(rows.length / LIST_PAGE_SIZE)-1));
  _listPages[key] = page;
  return rows.slice(page * LIST_PAGE_SIZE, (page+1) * LIST_PAGE_SIZE);
}
function listPager(total, key){
  if(total <= LIST_PAGE_SIZE) return '';
  var page = _listPages[key] || 0, count = Math.ceil(total / LIST_PAGE_SIZE);
  return '<div style="display:flex;align-items:center;justify-content:center;gap:8px;margin:12px 0;flex-wrap:wrap">'+
    '<button class="btn sm" data-list-key="'+key+'" data-list-page="'+(page-1)+'"'+(page===0?' disabled':'')+'>上一页</button>'+
    '<span>'+(page+1)+' / '+count+' 页 · '+total+' 条</span>'+
    '<button class="btn sm" data-list-key="'+key+'" data-list-page="'+(page+1)+'"'+(page+1>=count?' disabled':'')+'>下一页</button></div>';
}

/* Overview uses the same dated activity as the home calendar. */
function renderStats(){
  if(!mem.stats) mem.stats = {totalRounds:0,totalAnswered:0,bySentence:{},events:[]};
  var by = mem.stats.bySentence || {};
  var keys = Object.keys(by).filter(function(k){
    var sep = k.indexOf('#');
    return !CL.isItemDeleted(mem,k.slice(0,sep),{cid:k.slice(sep+1)});
  });
  var masteredCnt = keys.filter(function(k){ return classifyStat(by[k]) === 'master'; }).length;
  var weakCnt = keys.filter(function(k){ return classifyStat(by[k]) === 'weak'; }).length;
  var days = CL.dailyActivity(mem), now = new Date(), today = days[CL.ymd(now)] || {answered:0};
  var dueCnt = dueSentences().length;
  var metric = function(label,value,id){
    return '<div class="overview-metric"><span>'+label+'</span><strong'+(id?' id="'+id+'"':'')+'>'+value+'</strong></div>';
  };
  var html = '<div class="overview-primary">'+metric('今日答题',today.answered,'todayAnswered')+
    metric('待复习',dueCnt)+metric('需巩固',weakCnt)+'</div>';
  html += '<div class="overview-secondary">'+metric('已熟练',masteredCnt)+
    metric('累计答题',Number(mem.stats.totalAnswered)||0)+metric('错题本',getReinforceBook().length)+'</div>';
  html += '<section class="activity-section"><h3>近 7 天答题</h3><div class="activity-week">';
  var week = [];
  for(var i=6;i>=0;i--){
    var date = new Date(now); date.setDate(date.getDate()-i);
    var key=CL.ymd(date);
    week.push({key:key,label:i===0?'今天':(date.getMonth()+1)+'/'+date.getDate(),count:(days[key]||{}).answered||0});
  }
  var max=Math.max.apply(null,week.map(function(d){return d.count;}))||1;
  week.forEach(function(d){
    html += '<div class="activity-day" aria-label="'+d.key+' 答题 '+d.count+' 句">'+
      '<b>'+d.count+'</b><div class="activity-track"><div style="height:'+(d.count/max*100)+'%"></div></div><span>'+d.label+'</span></div>';
  });
  html += '</div></section>';
  html += '<p class="overview-note">累计完成 '+(Number(mem.stats.totalRounds)||0)+' 轮 · 每完整练完一批计 1 轮</p>';
  if(!keys.length && !mem.stats.totalAnswered){
    html += '<div class="empty-tip">还没有学习记录。<a href="./main.html">开始练习</a></div>';
  }
  $('statsCards').innerHTML=html;
  $('statsCards').hidden=_statsTab!=='overview';
  Array.prototype.forEach.call($('statsTabs').children,function(b){
    b.classList.toggle('on',b.dataset.tab===_statsTab);
    b.setAttribute('aria-pressed',String(b.dataset.tab===_statsTab));
  });
  $('statsFilter').style.display=_statsTab==='sent'?'flex':'none';
  Array.prototype.forEach.call($('statsFilter').children,function(b){b.classList.toggle('on',b.dataset.f===_statsFilter);});
  var body=$('statsBody');
  if(_statsTab==='wrong') renderWrongBook(body);
  else if(_statsTab==='review') renderReviewList(body);
  else if(_statsTab==='sent') renderSentenceList(body);
  else body.innerHTML='';
}


function renderSentenceList(body){
  var by = mem.stats.bySentence || {};
  var rows = [];

  /* ★ 关键修复（v2）：rows 从「bySentence + mastered」改为「allDecks() 全集」（已过滤 deletedItems）。
     旧版只有"已练过 + 标熟"两类，导致：
       1. 「未练过」tab 永远为空——classifyStat 返回 'unseen' 的条件是 times===0，但 rows 压根没装这些条目
       2. 「全部」tab 也只显示已练过的，不符合字面意思
     圆环大字"60 / 339 句" 用的是 seg.unseen = totalInDecks - keys.length（基于 allDecks() 全集），
     跟 sentence list 不同源 → 用户看到圆环说"未练过 279"但 tab 空白，体感像 bug。 */
  var decks = allDecks();
  var seen = {};
  decks.forEach(function(d){
    var dId = d.id;
    (d.items || []).forEach(function(it){
      if(CL.isItemDeleted(mem, dId, it)) return;
      var cid = it.cid || CL.fnv8(it.sentence || '');
      var key = dId + '#' + cid;
      if(seen[key]) return;          /* deck 内同 cid 重复句去重 */
      seen[key] = true;
      var st = by[key];
      if(st && st.times){
        /* 已练过：用 stats 数据（spread 防 mutate）+ 叠加 item 的 translation */
        rows.push(Object.assign({}, st, { translation: it.translation || '' }));
      } else {
        /* 未练过：构造伪 stat，classifyStat 会返回 'unseen' */
        rows.push({
          deckId: dId,
          sentence: it.sentence || '',
          translation: it.translation || '',
          times: 0, okTimes: 0, wrongTimes: 0, streak: 0, maxStreak: 0,
          lastAt: 0, interval: 1, ease: 2.5, dueAt: 0,
          _masteredOnly: !!(mem.mastered && mem.mastered[key])
        });
      }
    });
  });

  /* mem.mastered 中"只标熟未练过"的句子（item 已不在 decks）：仍要显示在「已熟」tab
     ★ 但 deletedItems 标删的 item 不能从 mastered 复活（用户已经删除） */
  if(mem.mastered){
    Object.keys(mem.mastered).forEach(function(key){
      if(seen[key]) return;
      var m = mem.mastered[key];
      var sep = key.indexOf('#');
      var dId = sep > 0 ? key.substring(0, sep) : '';
      var cid = sep > 0 ? key.substring(sep + 1) : '';
      if(CL.isItemDeleted(mem, dId, { cid: cid })) return;  /* 已被删 → 跳过 */
      seen[key] = true;
      rows.push({
        deckId: dId, sentence: m.sentence || '', translation: '',
        times: 0, okTimes: 0, wrongTimes: 0, streak: 0, maxStreak: 0,
        lastAt: m.markedAt || 0, interval: 1, ease: 2.5, dueAt: 0,
        _masteredOnly: true
      });
    });
  }

  /* 给每个 row 算 _practiceState（master/learn/weak/unseen），filter 统一判断 */
  rows.forEach(function(r){ r._practiceState = classifyStat(r); });

  /* 排序：先按状态优先级（master > learn > weak > unseen），再按 lastAt desc；
     unseen 桶内按 deckId + sentence 字典序（首次接触顺序无意义，给个稳定排序即可） */
  var stateOrder = { master: 0, learn: 1, weak: 2, unseen: 3 };
  rows.sort(function(a, b){
    var sa = stateOrder[a._practiceState]; if(sa === undefined) sa = 99;
    var sb = stateOrder[b._practiceState]; if(sb === undefined) sb = 99;
    if(sa !== sb) return sa - sb;
    if(a._practiceState === 'unseen') return (a.deckId + '\u0001' + a.sentence).localeCompare(b.deckId + '\u0001' + b.sentence);
    return (b.lastAt || 0) - (a.lastAt || 0);
  });

  var out = rows.filter(function(s){
    /* 只标熟未练过的句子（_masteredOnly=true）只出现在「已熟」tab，不出现在其它 tab */
    if(_statsFilter === 'all') return true;
    if(_statsFilter === 'mastered'){
      return s._masteredOnly || s._practiceState === 'master';
    }
    if(s._masteredOnly) return false;
    return s._practiceState === _statsFilter;
  });
  if(!out.length){
    body.innerHTML = '<div class="empty-tip">'+
      (rows.length === 0 ? '题库里还没有任何句子，去练习页导入或启用内置题库吧' :
       _statsFilter==='all' ? '还没有练习记录，先去练几题吧' :
       '没有符合条件的句子')+'</div>';
    return;
  }
  var html = '<div class="stats-list">';
  var pageKey = 'sent-' + _statsFilter;
  listPage(out, pageKey).forEach(function(s, idx){
    var badgeHtml =
      s._masteredOnly ? '<span class="badge master">已标记</span>' :
      s._practiceState==='master' ? '<span class="badge master">熟练</span>' :
      s._practiceState==='weak'   ? '<span class="badge weak">需巩固</span>' :
      s._practiceState==='learn'  ? '<span class="badge learn">学习中</span>' :
                                    '<span class="badge new">未练过</span>';
    var tStr = s.lastAt ? timeAgo(s.lastAt) : '—';
    html += '<div class="srow stats-detail-row"><span class="row-num">#'+(_listPages[pageKey]*LIST_PAGE_SIZE+idx+1)+'</span><div class="sen">'+
      '<div class="en">'+esc(s.sentence)+'</div>'+
      '<div class="cn">'+esc(s.translation||'')+'</div></div>'+
      badgeHtml+
      '<button class="row-detail-toggle" type="button" aria-expanded="false" aria-label="展开统计详情"></button>'+
      '<div class="meta">'+s.times+' 次 · 对 '+s.okTimes+'/错 '+s.wrongTimes+' · '+tStr+'</div>'+
    '</div>';
  });
  html += '</div>' + listPager(out.length, pageKey);
  body.innerHTML = html;
}

function renderWrongBook(body){
  var book = getReinforceBook();
  if(!book.length){
    body.innerHTML = '<div class="empty-tip">错题本是空的。练习时答错的句子会自动加入这里，跨会话保留。</div>';
    return;
  }
  var focusBook = book.filter(function(b){ return reinforceNeedsReview(b); });
  var shownBook = _wrongBookFilter === 'focus' ? focusBook : book;
  var html = '<div class="wrong-head">'+
    '<b>错题本</b><span class="count">'+book.length+' 句</span><span class="spacer"></span>'+
    '<button class="btn sm primary" id="btnPracticeWrongTab">开始复习</button>'+
    '<button class="btn sm ghost" id="btnClearWrongBook" style="color:var(--bad)">'+(window.Icons?Icons.svg('trash'):'')+' 清空</button></div>';
  html += '<div class="stats-filter wrong-filter">'+
    '<button class="f '+(_wrongBookFilter==='all'?'on':'')+'" data-wrong-filter="all">全部 '+book.length+'</button>'+
    '<button class="f '+(_wrongBookFilter==='focus'?'on':'')+'" data-wrong-filter="focus">需巩固 '+focusBook.length+'</button></div>';
  if(!shownBook.length){
    html += '<div class="empty-tip" style="padding:18px">当前没有需巩固的错题。切换到“全部”可查看所有记录。</div>';
  } else {
    html += '<div class="stats-list">';
  listPage(shownBook.slice().reverse(), 'wrong').forEach(function(b){
    var mine = '';
    if(b.mistakes && b.mistakes.length){
      mine = b.mistakes.map(function(m){
        return esc(m.userAnswer||'（空）')+' → <b>'+esc(m.chunk)+'</b>';
      }).join('<br>');
    }
    html += '<div class="wrong-row"><div class="sen">'+
      '<div class="en">'+esc(b.sentence)+'</div>'+
      '<div class="cn">'+esc(b.translation||'')+'</div>'+
      '<div class="wrong-detail">错点：'+mine+'</div>'+
    '</div>'+
    '<button class="wrong-del" data-key="'+esc(b._key||'')+'" title="从错题本删除">'+(window.Icons?Icons.svg('close'):'')+'</button></div>';
  });
    html += '</div>';
  }
  body.innerHTML = html;
  body.insertAdjacentHTML('beforeend', listPager(shownBook.length,'wrong'));
  var bp = $('btnPracticeWrongTab'); if(bp) bp.onclick = practiceWrongBook;
  var bc = $('btnClearWrongBook'); if(bc) bc.onclick = function(){ if(confirm('清空错题本？')){ mem.reinforceBook = []; saveStore(); renderStats(); } };
  Array.prototype.forEach.call(body.querySelectorAll('[data-wrong-filter]'), function(btn){
    btn.onclick = function(){
      _wrongBookFilter = btn.getAttribute('data-wrong-filter') || 'all';
      _listPages.wrong = 0;
      renderStats();
    };
  });
  Array.prototype.forEach.call(body.querySelectorAll('.wrong-del'), function(btn){
    btn.onclick = function(){
      var key = btn.getAttribute('data-key');
      mem.reinforceBook = (mem.reinforceBook || []).filter(function(x){ return x._key !== key; });
      saveStore(); renderStats();
    };
  });
}

function getReinforceBook(){
  if(!mem.reinforceBook) mem.reinforceBook = [];
  return mem.reinforceBook;
}

/* 错题本是事实记录；“需巩固”只做派生筛选，不再另存一份句子清单。 */
function reinforceNeedsReview(b){
  if(b && b.needsReview) return true;
  var by = (mem.stats && mem.stats.bySentence) || {};
  return Object.keys(by).some(function(k){
    var st = by[k];
    return st && st.deckId === (b && b.deckId) &&
      normSent(st.sentence) === normSent(b && b.sentence) &&
      classifyStat(st) === 'weak';
  });
}

/* ===== SRS 复习 ===== */
function dueSentences(){
  if(!mem.stats || !mem.stats.bySentence) return [];
  var out = [];
  var seen = {};
  var sources = new Map();
  allDecks().forEach(function(deck){
    var cids = new Map(), sentences = new Map();
    (deck.items || []).forEach(function(it){
      var cid = it.cid || CL.fnv8(it.sentence || '');
      if(!cids.has(cid)) cids.set(cid,it);
      if(!sentences.has(it.sentence)) sentences.set(it.sentence,it);
    });
    sources.set(deck.id,{deck:deck,cids:cids,sentences:sentences});
  });
  Object.keys(mem.stats.bySentence).forEach(function(k){
    var st = mem.stats.bySentence[k];
    if(typeof st.dueAt !== 'number' || !st.dueAt || st.dueAt > Date.now()) return;
    var source = sources.get(st.deckId);
    if(!source) return;
    var deck = source.deck;
    var sep = k.indexOf('#');
    var cid = sep > 0 ? k.substring(sep + 1) : '';
    var it = source.cids.get(cid) || source.sentences.get(st.sentence);
    if(!it) return;
    var key = st.deckId + '#' + normSent(it.sentence);
    if(seen[key]) return;
    seen[key] = true;
    out.push({ it:withStatsSource(it, st.deckId), st:st, deck:deck });
  });
  return out;
}
function renderReviewList(body){
  var dues = dueSentences();
  var html = '<div class="review-head">'+
    '<b style="font-size:13px;color:var(--warn)">待复习</b> '+
    '<span class="review-count">'+(dues.length>0?'<b style="color:var(--warn)">'+dues.length+' 句</b>':'0 句')+'</span>'+ 
    '<span class="spacer"></span>'+ 
    (dues.length>0 ? '<button class="btn primary" id="startDueReview">开始复习</button>' : '')+
    '</div>';
  if(dues.length){
    html += '<div class="stats-list">';
    listPage(dues,'due').forEach(function(d){
      html += '<div class="srow"><div class="sen">'+
        '<div class="en">'+esc(d.it.sentence)+'</div>'+
        '<div class="cn">'+esc(d.it.translation||'')+'</div></div>'+
        '<div class="meta" style="color:var(--warn)">'+(window.Icons?Icons.svg('refresh'):'')+' 已逾期 '+(d.st.dueAt ? Math.max(0, Math.round((Date.now()-d.st.dueAt)/86400000)) : 0)+' 天 · '+esc(displayDeckName(d.deck.name))+'</div></div>';
    });
    html += '</div>';
  } else {
    html += '<div class="empty-tip" style="padding:14px">没有到期复习的句子。新学的句子会按间隔重复（1→3→7→14→30 天）自动排入复习队列。</div>';
  }

  html += listPager(dues.length,'due');
  html += '<div style="margin-top:18px;padding-top:14px;border-top:1px solid var(--border)">'+
    '<div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">'+
    '<b style="font-size:13px;color:var(--muted)">复测熟练句子</b> '+
    '</div>';
  var decksWithMarked = [];
  allDecks().forEach(function(d){
    var items = (d.items||[]).filter(function(it){
      return isMarkedForDeck(d.id, it) || isFluencyByDeck(d.id, it);
    });
    if(items.length) decksWithMarked.push({deck:d, items:items});
  });
  if(!decksWithMarked.length){
    html += '<div class="empty-tip" style="padding:14px">还没有标熟/掌握的句子。当句子被标熟或考试通过后，可在此手动复习。</div>';
  } else {
    html += '<div class="stats-list">';
    decksWithMarked.forEach(function(entry){
      var d = entry.deck;
      html += '<div class="review-row">'+
        '<div class="nm">'+esc(displayDeckName(d.name))+' <span style="font-size:12px;color:var(--faint);font-weight:400">'+entry.items.length+' 句</span></div>'+ 
        '<button class="btn sm" data-rev-deck="'+esc(d.id)+'" style="color:#b45309;border-color:#fcd34d">'+(window.Icons?Icons.svg('book'):'')+' 复习 '+entry.items.length+' 句</button>'+
        '</div>';
    });
    html += '</div>';
  }
  html += '</div>';

  body.innerHTML = html;
  var sd = $('startDueReview'); if(sd) sd.onclick = practiceDue;
  Array.prototype.forEach.call(body.querySelectorAll('[data-rev-deck]'), function(btn){
    btn.onclick = function(){
      var deckId = btn.getAttribute('data-rev-deck');
      var deck = findDeck(deckId);
      if(deck) practiceReviewDeck(deck);
    };
  });
}

function practiceDue(){
  var dues = dueSentences();
  if(!dues.length){ alert('没有到期复习的句子'); return; }
  var items = dues.map(function(d){ return withStatsSource(d.it, d.st.deckId); });
  launchReviewItems({ id:'srs-'+Date.now().toString(36), name:'到期复习', items:items });
}
function practiceReviewDeck(deck){
  var items = (deck.items || []).filter(function(it){
    return isMarkedForDeck(deck.id, it) || isFluencyByDeck(deck.id, it);
  }).map(function(it){ return withStatsSource(it, deck.id); });
  if(!items.length){ alert('该题库没有已标熟/已掌握的句子'); return; }
  launchReviewItems({ id:'rev-'+deck.id+'-'+Date.now().toString(36), name:'复习 · '+displayDeckName(deck.name), items:items });
}
function practiceWrongBook(){
  var book = getReinforceBook().filter(function(b){ return _wrongBookFilter === 'focus' ? reinforceNeedsReview(b) : true; });
  var seen = {};
  var items = [];
  book.forEach(function(b){
    var key = b.deckId + '#' + normSent(b.sentence);
    if(seen[key]) return;
    seen[key] = true;
    var deck = findDeck(b.deckId);
    if(!deck) return;
    var it = (deck.items||[]).find(function(x){ return x.sentence === b.sentence; });
    if(it) items.push(withStatsSource(it, b.deckId));
  });
  if(!items.length){ alert('错题本中的句子已全部删除或找不到对应题库'); return; }
  launchReviewItems({ id:'book-'+Date.now().toString(36), name:'错题', items:items });
}

function launchReviewItems(deck){
  // Keep lightweight references; the practice page fetches only its current batch.
  launchReviewDeck(deck);
}

/* ★ 跨页面通信：通过 postMessage 通知主页启动临时题库（统一走 CL） */
function launchReviewDeck(deck){
  try{
    businessStorage.setItem('chunklab_pending_review_deck', JSON.stringify({ deck:deck, ts:Date.now() }));
  }catch(e){ console.error(e); alert('复习队列保存失败，可能是浏览器存储空间不足。请先备份数据后重试。'); return; }
  /* 同 tab 导航回主页：autostart=1 + pendingReviewDeck 自动启动复习队列 */
  window.location.href = './main.html?autostart=1';
}

/* ===== 事件绑定 ===== */
Promise.all([CL.ensureCloud(), window.ContentRepo ? ContentRepo.ready : Promise.resolve()]).then(function(){
loadMem();
  if(window.ContentRepo && ContentRepo.ensureIndexAll){
    return ContentRepo.ensureIndexAll(mem).then(function(decks){ _statsDecks = decks; });
  }
  return window.ContentRepo ? ContentRepo.ensureAll(mem).then(function(){ _statsDecks = CL.allDecksView(mem); }) : Promise.resolve();
}).then(function(){
migrateLegacyStatKeys();
renderStats();

Array.prototype.forEach.call($('statsTabs').children, function(b){
  b.onclick = function(){
    _statsTab = b.dataset.tab;
    renderStats();
  };
});
Array.prototype.forEach.call($('statsFilter').children, function(b){
  b.onclick = function(){
    _statsFilter = b.dataset.f;
    renderStats();
  };
});
/* 移动端记录采用渐进式展示：点击整行展开/收起次数、对错和最近练习时间。
   桌面端详情始终可见，因此不改变原有交互。 */
function toggleSentenceDetail(row){
  var expanded = row.classList.toggle('is-expanded');
  var toggle = row.querySelector('.row-detail-toggle');
  if(toggle){
    toggle.setAttribute('aria-expanded', expanded ? 'true' : 'false');
    toggle.setAttribute('aria-label', expanded ? '收起统计详情' : '展开统计详情');
  }
}
$('statsBody').addEventListener('click', function(ev){
  var pager = ev.target.closest('[data-list-page]');
  if(pager && !pager.disabled){
    _listPages[pager.dataset.listKey] = Math.max(0, Number(pager.dataset.listPage) || 0);
    renderStats(); $('statsBody').scrollIntoView({block:'start'}); return;
  }
  if(!window.matchMedia || !window.matchMedia('(max-width:600px)').matches) return;
  var row = ev.target.closest && ev.target.closest('.stats-detail-row');
  if(row) toggleSentenceDetail(row);
});
/* ★ 返回主页（独立窗口场景通用） */
$('statsBack').onclick = function(){ window.location.href = './main.html'; };

/* 接收主页面消息：刷新数据 */
window.addEventListener('message', function(ev){
  if(ev.data && ev.data.type === 'memUpdated'){
    loadMem();
    var p = window.ContentRepo && ContentRepo.ensureIndexAll ? ContentRepo.ensureIndexAll(mem).then(function(decks){ _statsDecks = decks; }) : Promise.resolve();
    p.then(renderStats);
  }
});

/* ★ 多标签页旧快照防护（P0）：其他标签页有新写入 → 刷新统计展示。
   必须走 CL.refreshExternal()（重新从 IDB 载入句子档案/事件内存桥），
   否则 CL.loadMem() 只会返回本页旧的内存桥 —— 看不到其他标签页刚写的练习记录。
   触发源由 core.js 统一处理（BroadcastChannel 主通道 + beacon/storage 降级通道），
   故这里只订阅 CL 事件，不再自行监听 storage（避免重复渲染）。 */
function reloadFromOtherTab(){
  var p = (CL.refreshExternal ? CL.refreshExternal() : Promise.resolve(CL.loadMem()));
  p.catch(function(){}).then(function(m){
    if(m) mem = m; else loadMem();
    _statsDecks = null;
    var q = (window.ContentRepo && ContentRepo.ensureIndexAll)
      ? ContentRepo.ensureIndexAll(mem).then(function(decks){ _statsDecks = decks; })
      : Promise.resolve();
    return q;
  }).then(function(){ renderStats(); });
}
if(CL && CL.on){
  CL.on('memExternal', reloadFromOtherTab);
} else {
  window.addEventListener('storage', function(e){
    if(e.key === 'chunklab.v1'){
      loadMem();
      var p = window.ContentRepo && ContentRepo.ensureIndexAll ? ContentRepo.ensureIndexAll(mem).then(function(decks){ _statsDecks = decks; }) : Promise.resolve();
      p.then(renderStats);
    }
  });
}
}); /* CL.ensureCloud().then */
